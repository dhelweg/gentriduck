version: 2

models:
  - name: int_thesis_2018_area_index
    description: >
      Conformed union of all three 2018 thesis golden staging models (bzr standard,
      plr standard, plr distance_weighted). Normalises column names to the shared
      mart schema. This is the single source of truth for the 2018 thesis index
      within the Gentriduck warehouse and is used directly by the gentrification_index
      mart. When Epic B3/C ingestion lands, this model is replaced/extended with
      computed values; until then it serves as the directional baseline per the
      Epic B strategy (docs/epic-b/B0-input-inventory.md).
      All German data values are translated to English by the upstream staging models.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER' from the thesis goldens.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: area_level
        description: Area level identifier. Values from seed_dim_area_level.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["bezirk", "bzr", "plr"]
      - name: area_code
        description: Area code (raum_id from the thesis golden).
        data_tests:

          - not_null
      - name: area_name
        description: Area name (raum_desc; German proper noun; latin-1 decoded).
        data_tests:

          - not_null
      - name: period_yyyymm
        description: Reporting period as string YYYYMM (e.g. '201612').
        data_tests:

          - not_null
      - name: variant
        description: >
          Index variant discriminator. 'standard' uses non-distance-weighted POI
          features; 'distance_weighted' uses the POI inverse-distance weighting
          from the 2018 thesis Java UDF (to be reproduced in DuckDB ST_Distance/
          ST_DWithin in Epic B3/C).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["standard", "distance_weighted"]
      - name: status_class_bi
        description: >
          Projected status class (binary English label; high/medium/low).
          high = low deprivation / high POI status score.
          low = high deprivation / low POI status score.
          See B5-findings-check.md for the label polarity explanation.
        data_tests:

          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: dynamism_class_bi
        description: >
          Projected dynamism class (binary English label; positive/neutral/negative).
          positive = high gentrification pressure / above-average POI churn.
          negative = low gentrification pressure / below-average POI churn.
        data_tests:

          - accepted_values:
              arguments:
                values: ["positive", "neutral", "negative"]
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
              - period_yyyymm
              - variant

  - name: dim_city
    description: >
      Conformed city dimension (ADR-0005 city-agnostic seam). One row per city.
      Currently Berlin only (BER). Sourced from seed_dim_city. Multi-city expansion
      (Epic H) adds a new seed row + adapter without changing this model or any mart.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: city_code
        description: Short city identifier (e.g. 'BER'). Natural key.
        data_tests:

          - not_null
          - unique
      - name: city_name
        description: Human-readable city name (e.g. 'Berlin').
        data_tests:

          - not_null
      - name: country_code
        description: ISO 3166-1 alpha-2 country code (e.g. 'DE').
        data_tests:

          - not_null
      - name: oa_leaf_area_level
        description: >
          OA-D8 (#240): this city's OA leaf area_level ('plr' for Berlin,
          'subarea_l2' for Hamburg) -- the per-city config
          int_poi_offering_advantage_arealevel.sql joins against to identify
          each city's own finest OA grain generically.
        data_tests:

          - not_null

  - name: dim_area
    description: >
      Conformed area dimension (ADR-0005 city-agnostic seam). Distinct
      (city_code, area_level, area_code, area_name) from int_thesis_2018_area_index
      + stg_berlin_lor + stg_berlin_lor_bzr + stg_berlin_lor_pgr (#242 I18) +
      stg_hamburg_geo (#40 H1, ADR-0014), joined with seed_dim_area_level for
      level_name.
      NOTE: parent_area_code is intentionally omitted from this dimension --
      parent/child links now live in the separate dim_area_hierarchy model
      (#242, I18), not as a column here, so dim_area's own grain/dedup logic
      stays untouched. See dim_area_hierarchy.sql for details.
      Area names are proper nouns kept in their local language (German for both
      Berlin and Hamburg).
    meta:
      dbt_meta_owner: data-engineer
    # QA-3 (#178): grain test -- the model's own QUALIFY ROW_NUMBER() OVER
    # (PARTITION BY city_code, area_level, area_code ...) = 1 dedup step makes this
    # the natural key; both LOR vintages are deliberately collapsed to one row here
    # (see model SQL header), so no vintage column participates in the grain.
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
    columns:
      - name: city_code
        description: City identifier (FK -> dim_city).
        data_tests:

          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_code
      - name: area_level
        description: >
          Area level identifier. Berlin uses 'bezirk'/'pgr'/'bzr'/'plr'/'ortsteil'
          (pgr added #242 I18; ortsteil added #269 I-ortsteile -- a non-LOR
          geography, see dim_area_hierarchy.sql); Hamburg (#40 H1, ADR-0014)
          uses the generic 'district'/'subarea_l1'/'subarea_l2' levels (see
          seed_dim_area_level).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "bezirk",
                    "pgr",
                    "bzr",
                    "plr",
                    "ortsteil",
                    "district",
                    "subarea_l1",
                    "subarea_l2",
                  ]
      - name: area_code
        description: Area code. Natural key within (city_code, area_level).
        data_tests:

          - not_null
      - name: area_name
        description: Area name (German proper noun; Berlin or Hamburg place names).
        data_tests:

          - not_null
      - name: level_name
        description: Human-readable level name from seed_dim_area_level.

  - name: dim_area_hierarchy
    description: >
      #242 (I18, geo-hierarchy pages): parent/child links for dim_area's area
      levels, city-agnostic per ADR-0005. Berlin: PLR -> BZR -> PGR -> Bezirk,
      derived from LOR code-prefix nesting -- structural, non-methodology-
      bearing. Hamburg: Stadtteil (subarea_l1) -> Bezirk (district), passed
      through from the WFS-provided parent code -- also non-methodology-bearing.

      #269 (I-ortsteile): adds Ortsteil -> Bezirk (source-provided parent
      code, passed through -- Ortsteil nests into Bezirk exactly). Ortsteil <->
      PLR does NOT nest and is deliberately NOT in this model -- that
      relationship is a separate, gated area-overlap crosswalk,
      int_berlin_plr_ortsteil_overlap.sql (methodology-bearing, geo-DS
      sign-off required).

      OA-D1b (#240, ADR-0024 D4, 2026-07-17): adds Hamburg statistisches
      Gebiet (subarea_l2) -> Stadtteil (subarea_l1). Confirmed (spike) that
      Gebiet has neither a source-provided parent attribute nor a code-prefix-
      derivable one (see model SQL header) -- resolved via a
      ST_Within(centroid, parent_geom) spatial crosswalk instead, with a
      nearest-Stadtteil fallback for the 2 of 943 Gebiete whose centroid falls
      outside every Stadtteil polygon. THIS EDGE IS METHODOLOGY-BEARING
      (new spatial method, per CLAUDE.md's R-C1 catch-all "any model that
      changes ... spatial method") -- geo-DS + domain-expert dual sign-off
      required before integration into develop, same requirement as
      int_berlin_plr_ortsteil_overlap.sql. The REST of this model (Berlin
      prefix-nesting, Hamburg L1->district and Ortsteil->Bezirk passthrough)
      remains structural/non-methodology-bearing as before.
    meta:
      dbt_meta_owner: data-engineer
    # Grain: one row per (city_code, area_level, area_code) that has a
    # resolved parent -- i.e. every child area has at most one parent by
    # construction (union of disjoint per-level CTEs, each keyed 1:1 off
    # dim_area / stg_hamburg_geo's own natural key). This test guards against
    # a future fan-out regression (e.g. an accidental duplicate join).
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
    columns:
      - name: city_code
        description: City identifier (FK -> dim_city). ADR-0005 seam.
        data_tests:

          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_code
      - name: area_level
        description: Child area level.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values:
                  ["pgr", "bzr", "plr", "subarea_l1", "subarea_l2", "ortsteil"]
      - name: area_code
        description: >
          Child area code. Every row here is itself sourced from a dim_area
          (or, for Hamburg, stg_hamburg_geo) row, so a dedicated FK test would
          be redundant with dim_area's own tests -- not null is sufficient here.
        data_tests:

          - not_null
      - name: parent_area_level
        description: >
          Parent area level ('bzr', 'pgr', 'bezirk' for Berlin -- 'bezirk' is
          both PGR's and, since #269, Ortsteil's parent level; 'district' for
          Hamburg subarea_l1; 'subarea_l1' for Hamburg subarea_l2, added
          OA-D1b #240). 'bezirk' intentionally has no corresponding dim_area
          row yet (Epic C; see dim_area's own accepted_values test, which
          already anticipates this level_code) -- PGR's and Ortsteil's
          parent_area_code are still real administrative facts, recorded here
          ahead of a Bezirk geometry row.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["bzr", "pgr", "bezirk", "district", "subarea_l1"]
      - name: parent_area_code
        description: >
          Parent area code. Strictly FK-tested against dim_area for every
          parent_area_level EXCEPT 'bezirk' (no dim_area row exists yet, by
          design -- see above) -- a real dim_area row must exist one level up,
          including for the OA-D1b Hamburg subarea_l2 -> subarea_l1 spatial-
          crosswalk edge (every Stadtteil the crosswalk resolves to is itself
          a populated dim_area row).
        data_tests:

          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_code
              config:
                where: "parent_area_level != 'bezirk'"

  - name: int_berlin_plr_ortsteil_overlap
    description: >
      #269 (I-ortsteile): area-overlap crosswalk between Berlin PLR (lor_2021)
      and Ortsteil geometries -- Ortsteile do not nest into PLR (see
      dim_area_hierarchy.sql), so this is a genuine areal-interpolation join
      (ST_Intersects + ST_Area overlap, DuckDB spatial extension, EPSG:25833),
      same class of problem as int_berlin_brw_plr.sql. Exposes the FULL
      overlap-weight table (one row per non-trivial PLR x Ortsteil pair,
      weight = overlap_area_m2 / plr_area_m2) plus a per-PLR
      is_dominant_ortsteil flag (the largest-overlap-share Ortsteil).
      Downstream rollups (mart_area_demographics's ortsteil level,
      mart_ortsteil_plr_stage_mix) use ONLY the dominant assignment -- each
      PLR is counted as belonging wholly to one Ortsteil, not fractionally
      split (see model header for the full rationale: whole-PLR-unit
      bridging, not a splittable-substrate apportionment).
      Sliver guard: overlap >= 0.5% of the PLR's own area (fraction-only --
      see header for why an absolute-area floor, used by int_berlin_brw_plr,
      is scale-inappropriate here).
      Empirical (2026-07-17): 82 of 542 lor_2021 PLRs (15.1%) straddle a
      non-trivial Ortsteil boundary; 631 total crosswalk rows; all 542 PLRs
      and all 97 Ortsteile covered; per-PLR overlap fractions sum to
      0.994-1.000 (tessellations agree almost exactly); dominant-row
      confidence ranges 43.6%-100%, averaging 97.9%.
      GATE: methodology-adjacent (area-overlap crosswalk + dominant-assignment
      rule) -- geo-DS sign-off required before integration (#269 ticket gate).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plr_area_code
              - ortsteil_area_code
      # Exactly one dominant Ortsteil per PLR -- see the standalone
      # transform/tests/test_ortsteil_overlap_one_dominant_per_plr.sql (guards
      # against a future regression in the ROW_NUMBER() tie-break logic
      # silently producing 0 or 2+ dominant rows for the same PLR).
    columns:
      - name: city_code
        description: City identifier; always 'BER'.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: plr_area_code
        description: 8-digit lor_2021 PLR code.
        data_tests:

          - not_null
          # dbt_utils.relationships_where (not the plain `relationships` test):
          # the `where` config on a plain `relationships` test filters THIS
          # model's rows, not the referenced dim_area rows -- dim_area's
          # area_code namespace is only unique WITHIN a given area_level, so
          # the referenced side must be scoped to area_level='plr' via
          # to_condition.
          - dbt_utils.relationships_where:
              arguments:
                to: ref('dim_area')
                field: area_code
                to_condition: "area_level = 'plr'"
      - name: ortsteil_area_code
        description: 4-digit Ortsteil code.
        data_tests:

          - not_null
          - dbt_utils.relationships_where:
              arguments:
                to: ref('dim_area')
                field: area_code
                to_condition: "area_level = 'ortsteil'"
      - name: ortsteil_area_name
        description: Ortsteil name, denormalized for convenience.
      - name: bezirk_code
        description: 2-digit Bezirk code the Ortsteil belongs to, denormalized for convenience.
      - name: plr_area_m2
        description: PLR polygon area (m^2), EPSG:25833.
        data_tests:

          - not_null
      - name: overlap_area_m2
        description: Intersection area (m^2) between this PLR and this Ortsteil.
        data_tests:

          - not_null
      - name: overlap_frac_of_plr
        description: >
          overlap_area_m2 / plr_area_m2 -- the crosswalk WEIGHT. Sums to
          approximately 1.0 across all rows for a given plr_area_code
          (verified 0.994-1.000 across all 542 PLRs).
        data_tests:

          - not_null
      - name: is_dominant_ortsteil
        description: >
          TRUE for the single largest-overlap_frac_of_plr row per PLR (the
          assignment downstream rollups use). Exactly one TRUE per
          plr_area_code.
        data_tests:

          - not_null
      - name: n_ortsteil_overlaps
        description: >
          Count of non-trivial (post-sliver-guard) Ortsteile this PLR overlaps.
          1 = fully contained in its dominant Ortsteil; >1 = a straddling PLR
          (82 of 542, 15.1%, per the empirical count above).
        data_tests:

          - not_null

  - name: int_berlin_ewr_plr2021
    description: >
      Aligns the EWR socio-economic time series to the unified LOR 2021 PLR scheme.
      Rows with area_vintage='lor_2021' (reference_year >= 2021) are passed through
      directly. Rows with area_vintage='lor_pre2021' (reference_year <= 2020) are
      joined to seed_lor_crosswalk_2006_to_2021 and indicator_value is weighted by
      the crosswalk weight (1.0 for 1:1 maps, fractional for splits).

      When multiple pre-2021 PLRs contribute to the same 2021 PLR, indicator values
      are aggregated as SUM(value * weight) per (reference_year, plr_id_2021, indicator).
      For extensive indicators (counts): exact. For intensive indicators (rates/shares):
      approximates a population-weighted average under uniform-population-within-PLR
      assumption (standard practice at the Berlin PLR spatial scale).

      Status (as of 2026-06-19): seed_lor_crosswalk_2006_to_2021 is POPULATED with
      3055 areal_pop_weighted rows from GDI Berlin WFS geometries (EPSG:25833) via
      ingestion/berlin/lor/ingest_lor_crosswalk.py. Geo-DS approved 2026-06-19
      (docs/epic-c/C3-crosswalk-geo-signoff.md, verdict PASS). Both pre-2021 and
      2021 rows now produce output; the 2020->2021 vintage boundary is bridged.

      All output rows use area_vintage='lor_2021' (they are all in the 2021 PLR scheme).
      crosswalk_weight and crosswalk_type are NULL post-aggregation (not meaningful).

      Known breaks (inherited):
        - LOR 2021 reform: resolved by this model for aligned analysis.
        - Migrationshintergrund ~2017: see seed_ewr_indicator_meta (stable_from_year=2017).
          This model does not filter; consumers should apply reference_year >= 2017
          for migration_background_share.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - reference_year
              - plr_id_2021
              - indicator
          config:
            where: "plr_id_2021 is not null"
    columns:
      - name: city_code
        description: City identifier; always 'BER' (ADR-0005; normalized at stg_berlin_ewr staging boundary).
        data_tests:

          - not_null:
              config:
                where: "plr_id_2021 is not null"
      - name: plr_id_2021
        description: PLR area code in the LOR 2021 scheme (8-digit, zero-padded).
        data_tests:

          - not_null:
              config:
                where: "reference_year is not null"
      - name: area_vintage
        description: >
          LOR scheme vintage of the output row. Always 'lor_2021' since all output
          rows are mapped to the 2021 PLR scheme (pre-2021 source rows are crosswalk-
          mapped to 2021 PLR codes, 2021 source rows pass through directly).
        data_tests:

          - not_null:
              config:
                where: "plr_id_2021 is not null"
          - accepted_values:
              arguments:
                values: ["lor_2021"]
              config:
                where: "plr_id_2021 is not null"
      - name: reference_year
        description: Calendar year of the 31-Dec snapshot.
        data_tests:

          - not_null:
              config:
                where: "plr_id_2021 is not null"
      - name: reference_date
        description: 31-Dec snapshot date as DATE.
        data_tests:

          - not_null:
              config:
                where: "plr_id_2021 is not null"
      - name: indicator
        description: Indicator key from the 13-indicator approved set.
        data_tests:

          - not_null:
              config:
                where: "plr_id_2021 is not null"
          - accepted_values:
              arguments:
                values:
                  - residents_total
                  - residents_male_share
                  - residents_female_share
                  - age_under18_share
                  - age_18_27_share
                  - age_27_45_share
                  - age_45_65_share
                  - age_65plus_share
                  - mean_age_years
                  - foreigners_share
                  - migration_background_share
                  - residence_duration_5y_share
                  - residence_duration_10y_share
              config:
                where: "plr_id_2021 is not null"
      - name: indicator_value
        description: >
          Aggregated weighted indicator value: SUM(source_value * crosswalk_weight)
          per (reference_year, plr_id_2021, indicator). For lor_2021 passthrough rows
          weight=1.0 so value is unchanged. For lor_pre2021 mapped rows, multiple
          contributing PLRs are summed. NULL if all contributing source values were NULL.
      - name: is_suppressed_any
        description: >
          True if any contributing source PLR was statistically suppressed. MAX over
          all contributing pre-2021 PLRs (propagated suppression flag).
        data_tests:

          - not_null:
              config:
                where: "plr_id_2021 is not null"
      - name: source_attribution
        description: CC BY 3.0 DE attribution string propagated from stg_berlin_ewr.
        data_tests:

          - not_null:
              config:
                where: "plr_id_2021 is not null"
      - name: crosswalk_weight
        description: >
          NULL post-aggregation. Pre-aggregation: weight applied from the crosswalk
          (1.0 for passthrough/identity; fractional for splits). Not meaningful as
          an aggregate value across multiple contributing PLRs.
      - name: crosswalk_type
        description: >
          NULL post-aggregation. Pre-aggregation: 'passthrough' (lor_2021 rows),
          'official_concordance', 'areal_pop_weighted', or 'identity' (from crosswalk).
          Not meaningful as an aggregate value.

  - name: int_poi_amenity_weighted_base
    description: >
      OA-B.3 (#172) helper: pre-materializes the tier-weighted amenity composite
      per (city_code, snapshot_year, area_code, area_vintage) before the
      LAG/z-score pass (int_poi_status_dynamism_improved), mirroring
      int_poi_share_base's role for the faithful total_poi_count pipeline.

      amenity_weighted_count: SUM(poi_count * seed_poi_offering_relevance
      offering_weight) over all domains EXCEPT Vacancy (ADR-0017 D-2).
      vacancy_weighted_count: same weighted sum, Vacancy domain only -- kept
      separate, never summed with the amenity composite.

      Berlin only (city_code='BER') -- see model SQL header scope note.

      Do not use directly for analysis; use int_poi_status_dynamism_improved.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER'.
        data_tests:

          - accepted_values:
              arguments:
                values: ["BER"]
              config:
                where: "area_code is not null"
      - name: amenity_weighted_count
        description: >
          Tier-weighted POI stock (Vacancy excluded), this PLR-year
          (OA-B.1/B.2 causal-tier weights, #170/#171).
      - name: vacancy_weighted_count
        description: >
          Tier-weighted Vacancy-domain stock (weight=1.0), this PLR-year --
          the opposite-pole disinvestment marker, kept separate (ADR-0017 D-2).

  - name: int_poi_amenity_weighted_base_2021
    description: >
      OA-B.3 (#172): crosswalk-remaps int_poi_amenity_weighted_base to the
      unified lor_2021 PLR scheme (mirrors int_poi_share_base_2021's #63 fix)
      so the improved-variant LAG window spans the 2020->2021 boundary.
      Consumed exclusively by int_poi_status_dynamism_improved.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: area_vintage
        description: Always 'lor_2021' after the crosswalk remap (Berlin only).
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_2021"]
              config:
                where: "area_code is not null"

  - name: int_poi_status_dynamism_improved
    description: >
      OA-B.3 (#172, ADR-0017 workstream 2): "improved" companion to
      int_poi_status_dynamism -- status_score_improved / dynamism_score_improved
      / disinvestment_score_improved, computed from the causality-first
      tier-weighted amenity-OA composite (int_poi_amenity_weighted_base_2021)
      instead of raw total_poi_count. methodology_variant='improved' throughout;
      never blended with the faithful scores (ADR-0017 D3/D4). Berlin only.
      See the model SQL header for the full construct and the R-C2 grounding
      chain (docs/planning/oa-revival-and-methodology-improvement.md).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        data_tests:

          - accepted_values:
              arguments:
                values: ["BER"]
              config:
                where: "area_code is not null"
      - name: methodology_variant
        description: Always 'improved' (ADR-0017 D4).
        data_tests:

          - accepted_values:
              arguments:
                values: ["improved"]
              config:
                where: "area_code is not null"
      - name: status_score_improved
        description: >
          D3 PREDICTOR (curated): z-score of amenity_weighted_count relative to
          all PLRs that year. NOT an outcome; never blended with the faithful
          status_score.
      - name: dynamism_score_improved
        description: >
          D3 PREDICTOR (curated, C5-equivalent share-normalized): z-score of
          amenity_share_yoy_change. NOT an outcome; never blended with the
          faithful dynamism_score.
      - name: disinvestment_score_improved
        description: >
          z-score of vacancy_weighted_count -- the opposite-pole disinvestment
          marker (Smith 1979, ADR-0017 D-2). Kept separate from
          status/dynamism_score_improved, never summed into one composite.

  - name: int_poi_status_dynamism_improved_pre2021
    description: >
      OA-ablation (#261): "improved" companion to int_poi_status_dynamism_pre2021 --
      status_score_improved / dynamism_score_improved / disinvestment_score_improved,
      computed from the SAME causality-first tier-weighted amenity composite
      (int_poi_amenity_weighted_base) as int_poi_status_dynamism_improved, but staying
      in the lor_pre2021 (448-PLR, 2008-2020) coordinate system instead of the
      crosswalked-to-2021 grain int_poi_status_dynamism_improved consumes. Built to
      enable a true same-anchor faithful-vs-improved ablation against the 2018 golden
      (analysis/c_three_way_comparison.py Part 2). See the model SQL header for the
      full #261 tier-weight review (conclusion: seed_poi_offering_relevance transfers
      to the pre-2021 taxonomy UNCHANGED -- full type-level coverage confirmed, no new
      weights authored). methodology_variant='improved' throughout; never blended with
      the faithful scores (ADR-0017 D3/D4). Z-scores are normalised within the
      lor_pre2021 PLR population for each snapshot_year -- NOT directly comparable to
      int_poi_status_dynamism_improved's lor_2021 z-scores (different reference
      population, same rule as int_poi_status_dynamism_pre2021). Berlin only.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        data_tests:

          - accepted_values:
              arguments:
                values: ["BER"]
              config:
                where: "area_code is not null"
      - name: area_vintage
        description: Always 'lor_pre2021' for this model.
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021"]
              config:
                where: "area_code is not null"
      - name: methodology_variant
        description: Always 'improved' (ADR-0017 D4).
        data_tests:

          - accepted_values:
              arguments:
                values: ["improved"]
              config:
                where: "area_code is not null"
      - name: status_score_improved
        description: >
          D3 PREDICTOR (curated): z-score of amenity_weighted_count relative to
          all lor_pre2021 PLRs that year. NOT an outcome; never blended with the
          faithful status_score.
      - name: dynamism_score_improved
        description: >
          D3 PREDICTOR (curated, C5-equivalent share-normalized): z-score of
          amenity_share_yoy_change. NOT an outcome; never blended with the
          faithful dynamism_score.
      - name: disinvestment_score_improved
        description: >
          z-score of vacancy_weighted_count -- the opposite-pole disinvestment
          marker (Smith 1979, ADR-0017 D-2). Kept separate from
          status/dynamism_score_improved, never summed into one composite.
          NULL/undefined in the earliest snapshot years (2008-2011) where
          Vacancy-domain OSM coverage is near-zero (STDDEV=0 guard) -- a known,
          accepted limitation, same as int_poi_status_dynamism_improved's own
          early-year behaviour (B3-geo-signoff.md §2.4), not a defect.

  - name: int_poi_status_dynamism
    description: >
      C4/C5 intermediate: per-PLR per-year POI status and dynamism scores.

      status_score: z-score of total_poi_count relative to all PLRs for that year.
      Captures how POI-rich an area is; mirrors the 2018 thesis status_index.

      dynamism_score (C5 normalized, geo-DS approved 2026-06-19): z-score of
      share_yoy_change, where share = plr_poi_count / berlin_total_poi_count per year.
      This controls for OSM completeness-bias: a PLR that gains share disproportionately
      is exhibiting real churn rather than reflecting mapper coverage growth.
      Prior to C5, dynamism was a z-score of raw YoY count deltas (completeness-biased).
      C5 geo-DS sign-off: docs/epic-c/C5-geo-signoff.md (verdict PASS).

      Limitation (C5): the share approach assumes uniform OSM coverage growth across
      PLRs. Non-uniform coverage (some PLRs mapped later than others) may create
      spurious share dynamics. Option B (ohsome edit-density normalization) is available
      for a future epic.

      YoY deltas are computed within (city_code, area_code, area_vintage). For Berlin,
      the upstream int_poi_share_base_2021 remaps all rows to the lor_2021 scheme
      before this model reads them, so the LAG window spans the 2020->2021 boundary
      and produces non-NULL deltas at snapshot_year=2021 (fixes issue #63). For any
      other city with a single vintage across its whole series (e.g. Hamburg's
      'current', ADR-0014, #125), int_poi_share_base_2021 passes rows through
      unchanged and the LAG window is already contiguous with no boundary to bridge.

      C5 anomaly checks (implemented as standalone test SQL files, not schema.yml tests,
      because DuckDB does not allow window functions in WHERE clauses):
        - tests/test_c5_poi_share_spike.sql: warn if any PLR share exceeds 2x 5yr avg.
        - tests/test_c5_poi_count_drop.sql: warn if city-wide count drops >5% YoY.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). 'BER' (Berlin) or 'HH' (Hamburg, #125).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, 2008-2026).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded). Vintage-specific.
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          Berlin: always 'lor_2021' since int_poi_share_base_2021 remaps all
          pre-2021 PLR codes to their 2021 equivalents before this model reads
          them. Other cities: their own upstream vintage passed through unchanged
          (e.g. Hamburg's 'current', ADR-0014, #125).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: total_poi_count
        description: Total POI count for this PLR in this year (from int_poi_features_pivot).
      - name: berlin_total_poi_count
        description: >
          Sum of total_poi_count across all PLRs for this city and year.
          Used as the denominator for plr_poi_share computation (C5 normalization).
      - name: plr_poi_share
        description: >
          This PLR's fraction of total Berlin POIs for this year:
          plr_poi_share = total_poi_count / berlin_total_poi_count.
          Ranges from 0 to 1; city-wide sum per year = 1.0.
      - name: plr_poi_share_prev_year
        description: >
          plr_poi_share for the prior year (LAG within area_code, area_vintage).
          NULL for the first year of each PLR/vintage combination.
      - name: share_yoy_change
        description: >
          Year-over-year change in plr_poi_share:
          share_yoy_change = plr_poi_share - plr_poi_share_prev_year.
          NULL for the first year per PLR/vintage (no LAG available).
          Positive = PLR gained share relative to Berlin; negative = lost share.
      - name: status_score
        description: >
          Z-score of total_poi_count relative to all PLRs for that year.
          Captures how POI-rich this area is compared to the city-wide average.
          NULL when total_poi_count is NULL or stddev is 0 (< 2 PLRs).
      - name: dynamism_score_raw
        description: >
          C5 normalized (pre-winsorization): z-score of share_yoy_change relative
          to all PLRs for that year, before the QA-winsor (#268) +/-3 SD clip.
          Positive = this PLR's share grew more than the city average.
          NULL for the first year per PLR/vintage or when stddev is 0.
          Diagnostics only -- downstream consumers should read dynamism_score.
      - name: dynamism_score
        description: >
          C5 normalized, QA-winsor (#268) winsorized at +/-3 SD: z-score of
          share_yoy_change relative to all PLRs for that year, clipped to
          [-3, 3] so a handful of thin-PLR extreme observations (149 obs beyond
          +/-3 SD pre-winsorization, range -5.1 to +13.4, per C6-geo-signoff.md)
          cannot swing downstream composites/maps/narratives. Positive = this
          PLR's share grew more than the city average. NULL for the first year
          per PLR/vintage or when stddev is 0. This is the governed value every
          downstream consumer (fct_gentrification_change, gentrification_index,
          E-series analysis) should read.

  - name: int_poi_status_dynamism_pre2021
    description: >
      B7 (#117): POI status and dynamism scores for the lor_pre2021 PLR system (448 PLRs,
      2008-2020). Mirrors int_poi_status_dynamism but stays in the lor_pre2021 coordinate
      system, bypassing the crosswalk in int_poi_share_base_2021.

      Enables int_gentrification_ts to produce thesis-era rows (MSS 2015/2017/2019) with
      POI predictors in the same PLR boundary system as the MSS outcomes.

      Z-scores are normalised within the lor_pre2021 PLR population for each snapshot_year
      (matching the thesis computation which ran on ~447 lor_pre2021 PLRs). NOT directly
      comparable to int_poi_status_dynamism z-scores (different reference population).
      Cross-vintage z-score comparison is prohibited; int_mss_lead_lag enforces
      within-vintage lag via the area_vintage constraint.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
          config:
            where: "area_code is not null"
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        data_tests:

          - not_null
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, 2008-2020 for lor_pre2021).
        data_tests:

          - not_null
      - name: area_code
        description: PLR identifier in the lor_pre2021 system (8-digit, zero-padded).
        data_tests:

          - not_null
      - name: area_vintage
        description: Always 'lor_pre2021' for this model.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021"]

  - name: int_ewr_socioeco
    description: >
      C4 intermediate: pivots int_berlin_ewr_plr2021 from long to wide format and
      computes the EWR composite socio-economic vulnerability score -- the
      **R-C1 methodology-gate model** for Berlin's socio-economic covariate
      (CLAUDE.md methodology gate list). QA-3 (#178): this schema entry documents
      the model for the first time; no logic change (documentation/tests only).

      Full composite (Thesis Section 4.2, 2014+): mean of 5 z-scores
      (foreigners_share, age_under18_share, migration_background_share,
      mean_age_years, residence_duration_5y_share), each computed across all PLRs
      for that (city_code, reference_year). Higher ewr_composite = more
      socio-economically vulnerable; negated when entering gentrification_score in
      int_gentrification_ts.

      Partial composite (B9b, pre-2014 extension, 3 indicators: age_under18_share,
      mean_age_years, residence_duration_5y_share) is available via
      ewr_composite_partial for reference_year <= 2013, where foreigners_share and
      migration_background_share are absent from the source EWR editions.
      is_partial_composite flags which rows only have the partial composite
      (ewr_composite is NULL for those rows). NOT cross-era comparable with the
      full composite -- see B9-geo-signoff.md / B9-domain-signoff.md.

      migration_background_share is methodologically stable only from 2017
      (Mikrozensus reform); this model does not filter on it -- consumers should
      apply reference_year >= 2017 for migration comparisons.

      Grain: one row per (city_code, area_code, area_vintage, reference_year).
      All rows carry area_vintage='lor_2021' (source is already crosswalk-aligned
      by int_berlin_ewr_plr2021). Berlin only (city_code='BER').

      Graceful degradation: returns zero rows when int_berlin_ewr_plr2021 has no rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - reference_year
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER'.
        data_tests:

          - accepted_values:
              arguments:
                values: ["BER"]
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR identifier in the lor_2021 scheme (8-digit, zero-padded).
        data_tests:

          - not_null:
              config:
                where: "reference_year is not null"
      - name: area_vintage
        description: >
          Always 'lor_2021' -- source (int_berlin_ewr_plr2021) has already
          crosswalk-aligned all pre-2021 rows to the 2021 PLR scheme.
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_2021"]
              config:
                where: "area_code is not null"
      - name: reference_year
        description: Calendar year of the 31-Dec EWR snapshot (2010-2024).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: ewr_composite
        description: >
          Full 5-indicator composite (Thesis Section 4.2, 2014+): mean z-score of
          foreigners_share, age_under18_share, migration_background_share,
          mean_age_years, residence_duration_5y_share. NULL pre-2014 (see
          ewr_composite_partial) or when any key indicator is suppressed.
      - name: ewr_composite_partial
        description: >
          Partial 3-indicator composite (B9b, all years): mean z-score of
          age_under18_share, mean_age_years, residence_duration_5y_share only.
          NOT cross-era comparable with ewr_composite -- consumers must filter on
          is_partial_composite to pick the right column for their analysis window.
      - name: is_partial_composite
        description: >
          TRUE for reference_year <= 2013 (only the partial composite is
          available); FALSE for reference_year >= 2014 (full composite present).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"

  - name: int_ewr_socioeco_pre2021
    description: >
      B7 (#117): EWR socio-economic composite for the lor_pre2021 PLR system (2008-2020).
      Mirrors int_ewr_socioeco but reads directly from stg_berlin_ewr (lor_pre2021 rows),
      bypassing the crosswalk in int_berlin_ewr_plr2021. Preserves lor_pre2021 area codes.

      Key indicators (Thesis §3.1; EWR codebook): foreigners_share, age_under18_share,
      migration_background_share (NULL pre-2014), mean_age_years, residence_duration_5y_share.
      ewr_composite = mean of 5 z-scores; NULL when any key indicator is suppressed or absent
      (migration_background_share absent pre-2014 → ewr_composite NULL pre-2014).

      Z-scores normalised within the lor_pre2021 PLR population per year. NOT directly
      comparable to int_ewr_socioeco (lor_2021 reference population, 542 PLRs).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - reference_year
          config:
            where: "area_code is not null"
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        data_tests:

          - not_null
      - name: area_code
        description: PLR identifier in the lor_pre2021 system (8-digit, zero-padded).
        data_tests:

          - not_null
      - name: area_vintage
        description: Always 'lor_pre2021' for this model.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021"]
      - name: reference_year
        description: EWR reference year (2008-2020 for lor_pre2021 data).
        data_tests:

          - not_null
      - name: ewr_composite
        description: >
          Mean of 5 z-scores (foreigners, under-18, migration-background, mean-age,
          residence-duration). NULL pre-2014 (migration_background_share absent).

  - name: int_osm_poi_harmonized
    description: >
      C2 POI taxonomy harmonization view.  Selects from stg_osm_poi and applies
      approved tag-schema drift remapping via seed_poi_tag_drift, resolving each
      POI to its canonical (poi_domain_h, poi_category_h, poi_type_h) triple.
      Canonical classifications are sourced from seed_poi_canonical_category.
      Provenance is recorded in harmonization_provenance so downstream models can
      filter or weight remapped POIs independently.
      Graceful-degradation: returns zero rows when stg_osm_poi has no data
      (no parquet files produced by C1 ingestion); the schema is always present.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_year
              - osm_id
          config:
            where: "osm_id is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, e.g. 2018).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: osm_id
        description: OSM node identifier (e.g. 'node/12345678').
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: poi_domain_h
        description: >
          Harmonized POI domain.  COALESCE(canonical_poi_domain, poi_domain).
          Same as poi_domain when no drift rule applies.
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: poi_category_h
        description: >
          Harmonized POI category.  COALESCE(canonical_poi_category, poi_category).
          Same as poi_category when no drift rule applies.
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: poi_type_h
        description: >
          Harmonized POI type.  COALESCE(canonical_poi_type, poi_type).
          Same as poi_type when no drift rule applies.
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: harmonization_provenance
        description: >
          Indicates how the harmonized classification was derived.
          'native'      — no drift rule matched; original classification retained.
          'drift_remap' — matched exactly one drift rule; remapped to canonical.
          'ambiguous'   — matched more than one drift rule (guard; should not occur
                          with the approved seed).
          'unmapped'    — matched a drift rule but canonical seed has no entry for
                          the canonical_key/value pair.
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
          - accepted_values:
              arguments:
                values: ["native", "drift_remap", "ambiguous", "unmapped"]
              config:
                where: "osm_id is not null"

  - name: int_osm_poi_plr
    description: >
      C3-join -- Spatial join model that assigns each OSM POI to its PLR area_code
      using the correct LOR vintage geometry (geo-DS approved methodology).
      Vintage assignment: snapshot_year <= 2020 uses pre-2021 PLR geometries
      (448 PLRs); snapshot_year >= 2021 uses LOR 2021 geometries (542 PLRs).
      Spatial predicate: ST_Within (exact point-in-polygon; no buffer).
      Left join: POIs outside all PLRs receive area_code = NULL (known exclusions:
      water bodies, airport perimeter outside PLR boundaries).
      Graceful-degradation: returns zero rows when OSM or LOR parquet files are
      absent so dbt build passes before ingestion is run.
      Materialised as table (spatial join is expensive; avoids recomputation on
      every downstream ref).
      Source: LOR WFS from GDI Berlin, CC BY 3.0 DE.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_year
              - osm_id
          config:
            where: "osm_id is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, e.g. 2018).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: osm_id
        description: OSM node identifier (e.g. 'node/12345678').
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_code
        description: >
          PLR area code from spatial join (8-digit, zero-padded). NULL when the
          POI falls outside all PLR boundaries (water bodies, airport perimeter).
        data_tests:

          - assert_null_rate_below:
              arguments:
                column_name: area_code
                partition_by: snapshot_year
                max_null_fraction: 0.12
              config:
                severity: warn
                where: "snapshot_year is not null"
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_code
              config:
                severity: warn
                where: "area_code is not null"
      - name: area_vintage
        description: >
          LOR vintage of the geometry used for the spatial join.
          'lor_pre2021' for snapshot_year <= 2020; 'lor_2021' for snapshot_year >= 2021.
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]
              config:
                where: "area_code is not null"
      - name: poi_domain_h
        description: >
          Harmonized POI domain (from int_osm_poi_harmonized).
          COALESCE(canonical_poi_domain, poi_domain).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: poi_category_h
        description: >
          Harmonized POI category (from int_osm_poi_harmonized).
          COALESCE(canonical_poi_category, poi_category).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: poi_type_h
        description: >
          Harmonized POI type (from int_osm_poi_harmonized).
          COALESCE(canonical_poi_type, poi_type).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: harmonization_provenance
        description: >
          Provenance of the harmonized classification (from int_osm_poi_harmonized).
          'native', 'drift_remap', 'ambiguous', or 'unmapped'.
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"

  - name: int_osm_poi_hamburg
    description: >
      H1 (#40) -- Spatial join model that assigns each Hamburg OSM POI to its
      statistisches-Gebiet area_code (Hamburg's PLR-analogue, ADR-0014 Pillar
      1's finest grain, subarea_l2). Mirrors int_osm_poi_plr's design for the
      Hamburg city scope (ADR-0014 Pillar 6: OSM sourcing needs "no new
      adapter mechanics, only passing Hamburg's polygons instead of Berlin's
      PLR polygons"). Single-vintage join ('current' live WFS edition) -- no
      pre2021/2021-style vintage-cutoff branch, since only one Hamburg
      geometry vintage exists yet (ADR-0014 open question #2, deferred).
      Spatial predicate: ST_Within in EPSG:25832 (Hamburg's native CRS, NOT
      Berlin's EPSG:25833) -- first OSM-POI exercise of the ADR-0005 per-city
      CRS parameter. Left join: POIs outside all Gebiete receive
      area_code = NULL (water bodies, airport perimeter, out-of-city-limits
      bbox spillover).
      Graceful-degradation: returns zero rows when Hamburg OSM or geometry
      parquet files are absent so dbt build passes before ingestion is run.
      Materialised as table (spatial join is expensive; avoids recomputation
      on every downstream ref).
      Not methodology-bearing: reuses the already-approved ST_Within
      predicate (Epic C3-join) against a new city's geometry/POI pair.
      Source: LGV Hamburg WFS (dl-de/by-2.0) + Geofabrik .osh.pbf (ODbL).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_year
              - osm_id
          config:
            where: "osm_id is not null"
    columns:
      - name: city_code
        description: City identifier; always 'HH' (ADR-0005 canonical, ADR-0014).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
          - accepted_values:
              arguments:
                values: ["HH"]
              config:
                where: "osm_id is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, e.g. 2018).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: osm_id
        description: OSM node identifier (e.g. 'node/12345678').
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_code
        description: >
          statistisches-Gebiet area code from spatial join. NULL when the POI
          falls outside all Gebiet boundaries (water bodies, airport
          perimeter, bbox spillover into neighbouring states).
        data_tests:

          - assert_null_rate_below:
              arguments:
                column_name: area_code
                partition_by: snapshot_year
                max_null_fraction: 0.12
              config:
                severity: warn
                where: "snapshot_year is not null"
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_code
              config:
                severity: warn
                where: "area_code is not null"
      - name: area_vintage
        description: >
          Hamburg geometry vintage used for the spatial join. 'current' for
          this first slice (single live-WFS edition; see ADR-0014 open
          question #2 on the deferred historical crosswalk).
        data_tests:

          - accepted_values:
              arguments:
                values: ["current"]
              config:
                where: "area_code is not null"
      - name: poi_domain_h
        description: >
          Harmonized POI domain (from int_osm_poi_harmonized).
          COALESCE(canonical_poi_domain, poi_domain).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: poi_category_h
        description: >
          Harmonized POI category (from int_osm_poi_harmonized).
          COALESCE(canonical_poi_category, poi_category).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: poi_type_h
        description: >
          Harmonized POI type (from int_osm_poi_harmonized).
          COALESCE(canonical_poi_type, poi_type).
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"
      - name: harmonization_provenance
        description: >
          Provenance of the harmonized classification (from int_osm_poi_harmonized).
          'native', 'drift_remap', 'ambiguous', or 'unmapped'.
        data_tests:

          - not_null:
              config:
                where: "osm_id is not null"

  - name: int_ewr_socioeco_hamburg_disagg
    description: >
      #40 H1 integration slice: helper model performing the Stadtteil ->
      statistisches-Gebiet disaggregation JOIN for Hamburg's EWR-equivalent
      predictors (ADR-0014 open question #5). Split out from
      int_ewr_socioeco_hamburg purely to avoid a DuckDB nested-window-function
      binder limitation (same pattern as int_poi_share_base). Every Gebiet
      inherits its matched Stadtteil's indicator values unchanged (uniform
      disaggregation via a name-matched crosswalk built from
      stg_hamburg_sozialmonitoring.stadtteil_name -> stg_hamburg_geo Stadtteil
      area_name). See int_ewr_socioeco_hamburg's header for the full
      methodology rationale (this model implements the join mechanics; that
      model carries the sign-off requirement).
      #125 (2026-07-01, H1-geo-signoff Condition 1): the crosswalk join now
      normalizes away internal whitespace/dots/colons/hyphens and applies an
      explicit alias for Sozialmonitoring's Hamm-Mitte/Hamm-Nord/Hamm-Süd
      three-way split (-> single Stadtteil 'Hamm'), raising the measured
      match rate from 88.5% to >=98% (see
      test_hamburg_gebiet_stadtteil_crosswalk_match_rate). Residual
      non-matches are legitimate data-coverage gaps (uninhabited/harbor
      Stadtteile below Sozialmonitoring's scoring threshold), not
      normalization bugs.
      H-C3 (#160, #129): stadtteil_code is now also exposed as a passthrough
      output column (no new join, no method change) so int_hamburg_lead_lag
      can carry the Stadtteil-grain SE-clustering key required by
      H1-geo-signoff.md Condition 2.
      Graceful degradation: returns zero rows when any upstream has no rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - reference_year
          config:
            where: "area_code is not null and reference_year is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'HH'.
      - name: area_code
        description: statistisches-Gebiet area code (subarea_l2 grain).
      - name: area_vintage
        description: Always 'current' (single Hamburg geometry edition, ADR-0014 Pillar 1).
      - name: is_disaggregated_from_stadtteil
        description: >
          Always TRUE -- every row's indicator values are inherited unchanged from
          the matched parent Stadtteil (see model description).
      - name: stadtteil_code
        description: >
          The resolved Stadtteil natural code this Gebiet maps to (subarea_l1 grain),
          via the name-matched crosswalk described above. NULL for Gebiete with no
          crosswalk match (legitimate data-coverage gaps, see model description).
          Constant per Gebiet across all reference_year rows. Consumed by
          int_hamburg_lead_lag (#160) as the Stadtteil-grain SE-clustering key
          required by #129 / H1-geo-signoff.md Condition 2.

  - name: int_ewr_socioeco_hamburg
    description: >
      #40 H1 methodology-gated integration slice: Hamburg EWR-equivalent composite
      socio-economic score (D4 baseline covariate), the city-agnostic analogue of
      int_ewr_socioeco. Resolves ADR-0014 open question #5 (two-grain reconciliation):
      Stadtteil-grain predictors (stg_hamburg_ewr_stadtteil) are disaggregated down to
      statistisches-Gebiet grain via a name-matched crosswalk built from
      stg_hamburg_sozialmonitoring's informational stadtteil_name field, joined to
      stg_hamburg_geo's Stadtteil area_name. Every Gebiet within a Stadtteil inherits
      identical indicator values (uniform disaggregation -- no population-weighted
      split; see SQL header for the full rationale and its documented resolution-loss
      property). Composite is a 3-indicator z-score mean (age_under18_share,
      foreigners_share, unemployment_share) -- narrower than Berlin's 5-indicator
      composite (Hamburg lacks migration_background_share/residence_duration_5y_share
      in the ingested source set). NOT directly comparable in magnitude to Berlin's
      ewr_composite; see SQL header for the full cross-city caveat.
      geo-DS + domain-expert sign-off REQUIRED before this model may be used beyond
      the develop-integration slice (R-C1).
      Graceful degradation: returns zero rows when any upstream has no rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - reference_year
          config:
            where: "area_code is not null and reference_year is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'HH'.
        data_tests:

          - accepted_values:
              arguments:
                values: ["HH"]
              config:
                where: "area_code is not null"
      - name: area_code
        description: statistisches-Gebiet area code (subarea_l2 grain).
      - name: area_vintage
        description: Always 'current' (single Hamburg geometry edition, ADR-0014 Pillar 1).
        data_tests:

          - accepted_values:
              arguments:
                values: ["current"]
              config:
                where: "area_code is not null"
      - name: reference_year
        description: Calendar year of the Stadtteil-grain EWR-equivalent release.
      - name: is_disaggregated_from_stadtteil
        description: >
          Always TRUE for this model's rows -- every Gebiet inherits its value from
          Stadtteil grain (see SQL header, two-grain reconciliation method). Downstream
          consumers should not treat Gebiete within the same Stadtteil as independent
          observations for iid-assuming statistical tests.
      - name: ewr_composite
        description: >
          D4 baseline covariate: 3-indicator z-score mean (age_under18_share,
          foreigners_share, unemployment_share). Higher = more socio-economically
          vulnerable (same sign convention as Berlin's int_ewr_socioeco.ewr_composite).
          NOT directly comparable in magnitude to Berlin's 5-indicator composite.

  - name: int_hamburg_wohnlage_stadtteil
    description: >
      #203 [H-C5]: Wohnlage residential-quality tier composition per
      Stadtteil -- Hamburg analogue of int_berlin_wohnlage_plr (D3, Thesis
      Sec.3.4). Unlike Berlin's point-in-polygon spatial join, this model
      uses a publisher-supplied Stadtteil name-match (verified 100% row
      coverage against stg_hamburg_geo.area_name, area_level='subarea_l1';
      enforced >=98% by test_hamburg_wohnlage_stadtteil_match_rate). No
      rent-VALUE join (Berlin D1 analogue) is attempted in this slice --
      deliberately deferred (see model SQL header). Wohnlage vocabulary is a
      two-tier scheme ('Gute Wohnlage'/'Normale Wohnlage'), NOT Berlin's
      three-tier einfach/mittel/gut -- preserved as-published, no cross-city
      remap. No time dimension (current-state crosswalk, no WFS edition-year
      published). geo-DS + domain-expert sign-off: PASS
      (docs/epic-h/203-hc5-geo-signoff.md, docs/epic-h/203-hc5-domain-signoff.md).
      Graceful degradation: returns zero rows when stg_hamburg_wohnlage or
      stg_hamburg_geo return zero rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - wohnlage
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "pct_wohnlage between 0 and 1"
          config:
            where: "pct_wohnlage is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'HH'.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["HH"]
              config:
                where: "area_code is not null"
      - name: area_code
        description: Stadtteil area code (matches stg_hamburg_geo, area_level='subarea_l1').
        data_tests:

          - not_null
      - name: area_vintage
        description: "Hamburg geometry vintage ('current' -- ADR-0014; no historical vintage ingested yet)."
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: wohnlage
        description: >
          Hamburg's own Wohnlage tier label ('Gute Wohnlage', 'Normale
          Wohnlage' -- live schema, #203). NOT remapped onto Berlin's
          einfach/mittel/gut scheme.
        data_tests:

          - not_null
      - name: n_addresses
        description: Count of Wohnlage-classified addresses in this Stadtteil for this tier.
      - name: pct_wohnlage
        description: >
          Share of addresses in this Wohnlage tier within this Stadtteil.
          pct_wohnlage = n_addresses / SUM(n_addresses) OVER (PARTITION BY
          city_code, area_code, area_vintage). Sums to 1.0 within each
          Stadtteil. Ranges 0 to 1 inclusive.
      - name: wohnlage_low_n
        description: >
          Flag: TRUE when the Stadtteil has fewer than 10 total Wohnlage
          address points (mirrors Berlin D3 geo condition 7). Downstream
          consumers must NULL derived scalars for low-N Stadtteile, never
          zero-fill.

  - name: int_hamburg_displacement_zone_flag
    description: >
      #203 [H-C5]: spatially resolves stg_hamburg_displacement_zones
      (current-state soziale Erhaltungsverordnung / Sec.172 BauGB polygons)
      onto the Stadtteil grain -- Hamburg analogue of
      int_berlin_milieuschutz_plr_flag (#70 [B1]), same legal basis, same
      disclosure-only scoping (binary flag + overlap fraction; NOT
      composited with int_hamburg_wohnlage_stadtteil or wired into the
      contract-enforced gentrification_index mart). ST_Intersects (not
      ST_Within) -- Erhaltungsverordnung polygons are not aligned to
      Stadtteil boundaries. CRS EPSG:25832 native on both sides (NOT
      Berlin's EPSG:25833); a y-axis sanity guard (5.90e6-5.97e6) mirrors
      Berlin's own coordinate-swap guard. Current-state only (16 in-force
      zones as of #203; no per-year edition endpoint) -- not a
      reconstructed historical panel. geo-DS + domain-expert sign-off:
      PASS (docs/epic-h/203-hc5-geo-signoff.md,
      docs/epic-h/203-hc5-domain-signoff.md).
      Graceful degradation: returns zero rows when stg_hamburg_displacement_zones
      or stg_hamburg_geo return zero rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
    columns:
      - name: city_code
        description: City identifier (ADR-0005), always 'HH'.
        data_tests:

          - not_null
      - name: area_code
        description: Stadtteil identifier (matches stg_hamburg_geo, area_level='subarea_l1').
      - name: area_vintage
        description: "Hamburg geometry vintage ('current' -- ADR-0014)."
      - name: under_displacement_protection
        description: >
          TRUE when the Stadtteil spatially intersects at least one current
          soziale Erhaltungsverordnung designation. A policy marker of
          displacement risk the city already recognizes, not a measured
          displacement outcome -- Stadtteile without the flag are not
          thereby "safe from displacement," only "not (yet) formally
          protected" (mirrors int_berlin_milieuschutz_plr_flag's framing).
        data_tests:

          - not_null
      - name: displacement_zone_count
        description: Count of distinct Erhaltungsverordnung designations overlapping this Stadtteil (0 if none).
      - name: displacement_zone_area_codes
        description: >
          Comma-separated list of overlapping designation area_codes, NULL
          when under_displacement_protection is FALSE.
      - name: earliest_in_force_date
        description: >
          Earliest in-force date among overlapping designations,
          informational only -- NOT a reconstructed historical status
          panel (source exposes current-state only; see model SQL header).
      - name: displacement_zone_overlap_frac
        description: >
          Total intersection area / Stadtteil area, clipped to [0,1]. No
          materiality threshold is applied by this model -- deferred to the
          consumer (mirrors int_berlin_milieuschutz_plr_flag's
          milieuschutz_overlap_frac).

  - name: int_hamburg_wohnlage_mietenspiegel
    description: >
      #215 [H-C6]: Mietenspiegel rent-VALUE join, Hamburg analogue of
      int_price_rent_wohnlage_mietspiegel (Berlin D1). Follow-up to #203,
      which deferred this join because of an unreconciled `ausstattung`
      (fitting-standard) dimension -- investigated and resolved here: the
      live 2025 edition carries exactly one ausstattung value ('mit Bad und
      Sammelheizung'), Hamburg's own standard-equipment baseline, directly
      analogous to Berlin's fixed "standard equipment" assumption (see model
      SQL header for the full reconciliation). Fixed representative profile:
      size_bucket='66m² bis unter 91m²', year_built_bucket='1968 bis 1977',
      ausstattung='mit Bad und Sammelheizung' -- caveat: verified against a
      SINGLE ingested edition (2025), unlike Berlin's cross-edition bucket
      stability check; flagged on G2 as a limitation to revisit at the next
      Hamburg Mietenspiegel edition. No vintage-matching join (Wohnlage side
      has no vintage dimension) -- joins against MAX(edition_year). Not wired
      into gentrification_index (disclosure-only, mirrors #203). geo-DS +
      domain-expert sign-off: PASS (docs/epic-h/215-hc6-geo-signoff.md,
      docs/epic-h/215-hc6-domain-signoff.md).
      Graceful degradation: returns zero rows when int_hamburg_wohnlage_stadtteil
      or stg_hamburg_mietenspiegel return zero rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "pct_gute_wohnlage + pct_normale_wohnlage between 0.999 and 1.001"
          config:
            where: "not wohnlage_low_n"
    columns:
      - name: city_code
        description: City identifier (ADR-0005), always 'HH'.
        data_tests:

          - not_null
      - name: area_code
        description: Stadtteil identifier (matches stg_hamburg_geo, area_level='subarea_l1').
      - name: area_vintage
        description: "Hamburg geometry vintage ('current' -- ADR-0014)."
      - name: pct_gute_wohnlage
        description: Share of addresses in 'Gute Wohnlage' tier per Stadtteil.
      - name: pct_normale_wohnlage
        description: Share of addresses in 'Normale Wohnlage' tier per Stadtteil.
      - name: wohnlage_low_n
        description: >
          Inherited from int_hamburg_wohnlage_stadtteil: TRUE when
          SUM(n_addresses) for the Stadtteil < 10. est_rent_* are NULL when
          TRUE.
      - name: est_rent_mid
        description: >
          Modelled net cold rent (EUR/sqm/month) at the fixed representative
          dwelling profile -- NOT observed rent paid (Holm 2010
          Bestandsmiete-lagging-bias). NULL when wohnlage_low_n = TRUE.
      - name: est_rent_low
        description: Lower-bound modelled rent estimate, same profile as est_rent_mid.
      - name: est_rent_high
        description: Upper-bound modelled rent estimate, same profile as est_rent_mid.
      - name: mietenspiegel_edition_used
        description: Mietenspiegel edition_year the rent values were sourced from.

  - name: int_hamburg_sozialmonitoring_index
    description: >
      #40 H1 methodology-gated integration slice: numeric-ordinal mapping of Hamburg
      Sozialmonitoring's text-coded Status-Index/Dynamik-Index labels onto the SAME
      1-4 (status)/1-3 (dynamik) integer scale Berlin's MSS already uses in
      int_gentrification_ts -- the outcome-pillar half of ADR-0014 open question #5.
      status_index: 1=hoch...4=sehr niedrig (direct label correspondence to Berlin's
      MSS polarity). dynamik_index: 1=positiv, 2=stabil, 3=negativ (identical label
      set to Berlin's MSS). CAVEAT: Hamburg's Dynamik uses a 3-year change window
      (vs Berlin's 2-year) and annual editions (vs Berlin's biennial) -- ordinal
      category is comparable, magnitude/pooled-regression use is not without
      controlling for window/cadence (ADR-0014 Pillar-2 non-equivalence note).
      gesamtindex is always NULL (Hamburg publishes no numeric-code analogue).
      geo-DS + domain-expert sign-off REQUIRED before this model may be used beyond
      the develop-integration slice (R-C1).
      Graceful degradation: returns zero rows when stg_hamburg_sozialmonitoring is empty.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - edition
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'HH'.
        data_tests:

          - accepted_values:
              arguments:
                values: ["HH"]
              config:
                where: "area_code is not null"
      - name: edition
        description: Sozialmonitoring publication year (annual, 2013-2025).
      - name: area_code
        description: statistisches-Gebiet id ('statgeb'), subarea_l2 grain.
      - name: status_index
        description: >
          D1 outcome, numeric-mapped: 1=hoch (best) ... 4=sehr niedrig (worst).
          Same polarity as Berlin's MSS status_index. Treat as ORDINAL.
        data_tests:

          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
              config:
                where: "status_index is not null"
      - name: dynamik_index
        description: >
          D2 outcome, numeric-mapped: 1=positiv, 2=stabil, 3=negativ. Same label
          set as Berlin's MSS dynamik_index but a 3-year (vs 2-year) change window
          -- see model description for the cross-city magnitude caveat.
        data_tests:

          - accepted_values:
              arguments:
                values: [1, 2, 3]
              config:
                where: "dynamik_index is not null"
      - name: gesamtindex
        description: Always NULL -- Hamburg publishes no numeric gesamtindex analogue.

  - name: int_poi_features_pivot
    description: >
      C4 intermediate: pivots fct_poi_development from long format (one row per
      city/year/area/vintage/domain/category/type) to wide format (one row per
      city/year/area/vintage) with one column per POI category, one column per POI
      domain, one column per POI type, and a total_poi_count summary column.

      OA-A.1 (#165, ADR-0017 D1): domain- and type-level pivots restore the columns
      dropped at this model's flattening point (previously category-only). Each
      level is pivoted independently by conditional SUM(...) FILTER(WHERE <level>_h
      = '...') on its own harmonized label -- a straightforward carry-through, not a
      new methodology decision (no aggregation/weighting/normalization choice).
      Column-name prefixes (poi_domain_<slug> / poi_<slug> / poi_type_<slug>) avoid
      collisions where the same label appears at more than one level (e.g. 'Office',
      'Other', 'Vacancy' are each both a domain and a category value in
      seed_poi_mapping.csv).

      Value coverage: domain and type pivots cover ALL distinct seed_poi_mapping.csv
      domain (13) / type (163) values -- the closed-world taxonomy C1/H1 ingestion
      resolves every OSM tag to (a non-matching tag is dropped at ingestion, never
      written with a fallback label). The pre-existing category pivot is a
      hand-curated subset of seed_poi_mapping.csv's 53 categories (UNCHANGED by this
      ticket); categories/domains/types not enumerated as a named column still count
      in total_poi_count. int_osm_poi_harmonized's drift remap
      (seed_poi_canonical_category) can rarely coalesce in a handful of
      differently-cased labels not in seed_poi_mapping.csv -- same "counted in the
      total, not in a named column" behaviour.

      Graceful degradation: returns zero rows when fct_poi_development has no rows.
      Consumed by int_poi_share_base (total_poi_count only, today); domain/type
      columns are for OA-A.2 (#166, int_poi_offering_advantage).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). 'BER' (Berlin) or 'HH' (Hamburg).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded).
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          Spatial-join vintage. 'lor_pre2021'/'lor_2021' for Berlin LOR; 'current'
          for Hamburg statistische Gebiete.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: total_poi_count
        description: >
          Total POI count for this area in this snapshot year, summed across all
          categories/domains/types (level-independent -- every POI has exactly one
          domain, one category, one type).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "area_code is not null"
      # Individual poi_domain_<slug> (13), poi_<slug> (category, 48 -- pre-existing,
      # unchanged by #165), and poi_type_<slug> (163) columns are conditional-count
      # pivots: NULL is a valid state (zero POIs of that domain/category/type in this
      # area/year), so a not_null test would be incorrect. Not individually documented
      # here (224 columns); see the model description above for the naming convention
      # and value-coverage note, and int_poi_features_pivot.sql for the exact column
      # list (one FILTER clause per column, grouped by level with a header comment).

  - name: int_poi_share_base
    description: >
      C5 helper: pre-materializes per-area POI share per year before dynamism
      computation. DuckDB does not support nested window functions; materializing
      this as a separate table breaks the chain at this boundary.

      Grain: (city_code, snapshot_year, area_code, area_vintage). Contains Berlin's
      lor_pre2021 (snapshot_year <= 2020) and lor_2021 (snapshot_year >= 2021) rows
      with vintage-specific PLR codes, plus any other city's own single-vintage rows
      (e.g. Hamburg's 'current' statistische Gebiete, ADR-0014, #125). Direct
      consumers should use int_poi_share_base_2021 (which remaps Berlin's rows to
      the 2021 PLR scheme and passes other cities through unchanged) unless they
      need the raw vintage split.

      This model is consumed exclusively by int_poi_share_base_2021.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). 'BER' (Berlin) or 'HH' (Hamburg, #125).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, 2008-2026).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded). Vintage-specific (pre-2021 or 2021 scheme).
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          Berlin: LOR scheme vintage, 'lor_pre2021' (snapshot_year <= 2020) or
          'lor_2021' (snapshot_year >= 2021). Hamburg: 'current' (single live-WFS
          statistische-Gebiete edition, ADR-0014 Pillar 1 -- no historical vintage
          crosswalk yet, #125).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: total_poi_count
        description: Total POI count for this area in this snapshot year.
      - name: berlin_total_poi_count
        description: >
          Sum of total_poi_count across all areas for this city and year. Column
          name retained from the pre-#125 Berlin-only version; the value is
          per-city (window partitioned by city_code), not literally Berlin-only.
      - name: plr_poi_share
        description: >
          This area's fraction of total city-wide POIs for this year:
          total_poi_count / berlin_total_poi_count. Ranges 0-1; city-wide sum = 1.0.

  - name: int_poi_share_base_2021
    description: >
      Remaps int_poi_share_base to a unified LOR 2021 PLR scheme for all Berlin
      snapshot years, and passes through any other city's single-vintage rows
      unchanged (e.g. Hamburg's 'current', #125). Fixes issue #63: before this
      model, int_poi_status_dynamism read int_poi_share_base directly, causing the
      LAG window (partitioned by area_code + area_vintage) to produce NULL at
      snapshot_year=2021 because pre-2021 rows had different PLR codes and a
      different area_vintage value.

      Crosswalk strategy (mirrors int_berlin_ewr_plr2021):
      - Berlin lor_pre2021 rows (snapshot_year <= 2020): joined to
        seed_lor_crosswalk_2006_to_2021; total_poi_count (an extensive/count
        indicator) is apportioned as SUM(count * weight); output area_vintage
        forced to 'lor_2021'.
      - ALL OTHER rows (Berlin's own lor_2021 rows, snapshot_year >= 2021; and any
        other city's own vintage, e.g. Hamburg's 'current'): passed through
        unchanged, keeping their own area_vintage. See the SQL header for the
        methodology question this passthrough choice raises for a hypothetical
        future city with its own mid-series boundary reform (#125) -- Hamburg
        itself has no such reform in the ingested source, so passthrough is exact
        for it today.

      berlin_total_poi_count and plr_poi_share are recomputed after aggregation,
      partitioned by (city_code, snapshot_year, area_vintage) (ratio recomputation
      is exact for counts).

      Consumed exclusively by int_poi_status_dynamism.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). 'BER' (Berlin) or 'HH' (Hamburg, #125).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR/area code (8-digit LOR 2021 code for Berlin; Hamburg statistisches-Gebiet code, passthrough).
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          Berlin: always 'lor_2021' (pre-2021 source rows are crosswalk-mapped to
          2021 PLR codes; 2021+ source rows pass through directly). Other cities
          (e.g. Hamburg): their own upstream vintage, passed through unchanged
          (e.g. 'current', #125).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              # GUARD (#161 / H-C4, ADR-0005 addendum 2026-07-10): this list is the
              # enforced tripwire for the city-onboarding checklist. A red build here
              # means a new vintage tag showed up -- STOP and decide whether the new
              # city needs its own crosswalk seed (mirroring
              # seed_lor_crosswalk_2006_to_2021) before widening this list; passthrough
              # is only exact for a single-vintage city (see the model's SQL header and
              # docs/epic-h/125-multi-city-lineage-geo-signoff.md Condition C4). Do not
              # widen this list as a reflexive fix without that decision.
              arguments:
                values: ["lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, 2008-2026).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: total_poi_count
        description: >
          Aggregated total POI count for this area in this year.
          For passthrough rows (Berlin lor_2021, other cities): same as int_poi_share_base.
          For Berlin lor_pre2021-remapped rows: SUM(source_count * crosswalk_weight) across
          all pre-2021 PLRs that map to this 2021 PLR (exact for count/extensive data).
      - name: berlin_total_poi_count
        description: >
          Sum of total_poi_count across all areas for this city, year, and vintage.
          City-wide total is invariant to Berlin's PLR boundary remapping (same
          city, same year, same POIs). Column name retained from the pre-#125
          Berlin-only version.
      - name: plr_poi_share
        description: >
          This area's fraction of total city-wide POIs for this year:
          total_poi_count / berlin_total_poi_count. Recomputed after aggregation.
          Ranges 0-1; city-wide sum per (city, year, vintage) = 1.0.

  - name: int_gentrification_ts
    description: >
      R-A1 re-grounded time-series panel (#64, B7 #117): combines D3 predictors (POI), D1/D2
      MSS social outcomes, and D4 EWR baseline covariate. Two branches UNIONed:

      Branch A — lor_2021 (editions 2021, 2023, 2025, 542 PLRs): MSS + int_poi_status_dynamism
      + int_ewr_socioeco. All in lor_2021 PLR coordinate system.

      Branch B — lor_pre2021 (editions 2015, 2017, 2019, ~447 PLRs, B7 #117): MSS +
      int_poi_status_dynamism_pre2021 + int_ewr_socioeco_pre2021. All in lor_pre2021 PLR
      coordinate system. Enables thesis-era H2/H3 lead-lag panel in int_mss_lead_lag.
      OA-ablation (#261): also carries status_score_improved / dynamism_score_improved /
      disinvestment_score_improved from int_poi_status_dynamism_improved_pre2021 (NOT
      NULL here anymore, unlike before #261 -- see that model's header for the
      tier-weight review).

      Branch C — Hamburg 'current' (annual editions 2013-2025, #40 H1 integration slice,
      ADR-0014): int_hamburg_sozialmonitoring_index (outcome, numeric-mapped D1/D2) +
      int_poi_status_dynamism (POI, filtered city_code='HH') + int_ewr_socioeco_hamburg
      (D4, two-grain-reconciled 3-indicator composite -- see that model's header for the
      ADR-0014 open-question-#5 methodology). city_code='HH' throughout.

      ADR-0008 architectural fix: the pre-R-A1 model averaged predictors and outcomes into
      a single gentrification_score (no theoretical grounding). R-A1 separates the dimensions:
        D1 = status_index (1=hoch … 4=sehr_niedrig) — social STATUS outcome
        D2 = dynamik_index (1=positiv, 2=stabil, 3=negativ) — social DIRECTION outcome
        D3 = status_score / dynamism_score (C5-corrected POI z-scores) — commercial PREDICTOR
        D4 = ewr_composite (5-indicator z-score mean) — demographic BASELINE COVARIATE

      D1 POLARITY: 1=hoch (low deprivation) … 4=sehr_niedrig (most deprived). INVERSE numeric
      vs 2018 thesis status_summe but SAME deprivation gradient. See SQL model for full note.

      Z-SCORE CROSS-VINTAGE NOTE (binding): lor_pre2021 and lor_2021 z-scores are computed
      within their respective PLR populations and are NOT directly comparable. Cross-vintage
      comparison is prohibited. int_mss_lead_lag enforces within-vintage lag via area_vintage.

      D4 BASELINE DISCIPLINE: D4 enters ONLY as a cross-sectional LEVEL. D4 changes are
      near-tautological outcome proxies (Döring & Ulbricht 2016) and are EXCLUDED.

      Uninhabited PLRs (gesamtindex IS NULL): retained with is_uninhabited=true but MUST be
      excluded from all regression, lead-lag, and metric computation (§7.1; R-A3 C3).

      legacy_gentrification_score: the pre-R-A1 formula kept for 2018 baseline comparison only.
      NOT for new analysis.

      Grain: (city_code, area_code, area_vintage, snapshot_year) per MSS edition.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - snapshot_year
          config:
            where: "area_code is not null"
      # Data-presence gate (docs/lessons/local-first-data-presence.md): the
      # re-grounded panel is empty whenever MSS/POI/EWR are missing on a machine.
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). 'BER' (Berlin branches A/B) or 'HH' (Hamburg branch C, #40).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: >
          MSS/Sozialmonitoring edition year. Berlin: biennial (2013, 2015, 2017, 2019, 2021,
          2023, 2025). Hamburg: annual (2013-2025, ADR-0014 Pillar 2 cadence note).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded).
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          Berlin: LOR boundary vintage from stg_berlin_mss, 'lor_pre2021' (edition ≤2019)
          or 'lor_2021' (edition ≥2021). Hamburg: 'current' (single live-WFS statistisches-
          Gebiete edition, ADR-0014 Pillar 1 -- no historical vintage crosswalk yet).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: total_poi_count
        description: Total POI count for this PLR in this year (D3 density; C5 source).
      - name: share_yoy_change
        description: >
          C5 normalized: year-over-year change in PLR POI share (D3 dynamism face; §2.4).
          NULL for the first year per PLR/vintage.
      - name: status_score
        description: >
          D3 predictor: z-score of total_poi_count relative to all PLRs for that year.
          POI density face; PREDICTOR not outcome (R-A1; ADR-0008).
      - name: dynamism_score
        description: >
          D3 predictor: C5-corrected z-score of share_yoy_change. Commercial succession signal.
          PREDICTOR not outcome. C5 geo-DS sign-off: PASS (docs/epic-c/C5-geo-signoff.md).
      - name: status_index
        description: >
          D1 outcome: MSS Social Status ordinal class. 1=hoch (high status, low deprivation) …
          4=sehr_niedrig (lowest status, most deprived). NULL = uninhabited PLR.
          POLARITY: INVERSE numeric vs 2018 thesis status_summe; same deprivation gradient.
          Treat as ORDINAL — never metric-average (R-A3 C2; index-definition.md §3).
        data_tests:

          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
              config:
                where: "status_index is not null"
      - name: dynamik_index
        description: >
          D2 outcome: MSS Dynamik (social change direction) ordinal class.
          1=positiv (improving), 2=stabil, 3=negativ (worsening). NULL = uninhabited PLR.
          Already vulnerability-positive in numeric order (3=worsening=most vulnerable).
          Mapped from WFS di_n {1,3,5} → {1,2,3} in stg_berlin_mss.
        data_tests:

          - accepted_values:
              arguments:
                values: [1, 2, 3]
              config:
                where: "dynamik_index is not null"
      - name: gesamtindex
        description: >
          MSS 12-group composite code (tens digit=status, units digit=Dynamik WFS code {1,3,5}).
          Valid codes: {11,13,15,21,23,25,31,33,35,41,43,45}. NULL = uninhabited PLR.
          Do NOT treat as a 12-level metric ordinal (index-definition.md §1.7).
      - name: mss_edition
        description: >
          MSS publication year (biennial: 2013, 2015, 2017, 2019, 2021, 2023, 2025).
          Identical to snapshot_year in this model; retained for explicit temporal alignment.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: is_uninhabited
        description: >
          True if this PLR is uninhabited (gesamtindex IS NULL in MSS; WFS sentinel −9999 → null).
          Uninhabited PLRs MUST be excluded from all regression, lead-lag, and metric computation
          (index-definition.md §7.1; R-A3 C3). Retained here for completeness (row count reporting).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: typology_stage
        description: >
          Typology stage derived from the D1×D2 MSS Status × Dynamik matrix (ADR-0008;
          index-definition.md §1.5). One of: 'stable-established', 'pre-gentrification',
          'pioneer-signal', 'active-gentrification', 'consolidation-pressure',
          'improving-vulnerable'. NULL for uninhabited PLRs.
          PLR-level aggregate — not an individual/building-level statement (G-2 guardrail).
          D-2 sign guard: upgrading stages require non-negativ Dynamik (dynamik_index IN (1,2))
          as a necessary condition; dynamik_index=3 can NEVER yield an upgrading stage.
        data_tests:

          - accepted_values:
              arguments:
                values:
                  - stable-established
                  - pre-gentrification
                  - pioneer-signal
                  - active-gentrification
                  - consolidation-pressure
                  - improving-vulnerable
              config:
                where: "typology_stage is not null"
      - name: ewr_composite
        description: >
          D4 baseline covariate: mean of 5 EWR indicator z-scores. Higher = more
          socio-economically vulnerable population. All inputs are vulnerability-positive.
          Enters the model ONLY as a cross-sectional LEVEL (§4.3, binding).
          NULL when any key indicator is suppressed or absent.
      - name: foreigners_share
        description: D4 component (foreigners share; vulnerability-positive baseline level).
      - name: age_under18_share
        description: D4 component (share of residents under 18; vulnerability-positive baseline).
      - name: migration_background_share
        description: >
          D4 component: share with migration background (vulnerability-positive; ≥2017 only
          due to Mikrozensus definition break — do not compare pre/post-2017; §4.4).
      - name: mean_age_years
        description: D4 component (mean age in years; vulnerability-positive; negation removed PR #89).
      - name: residence_duration_5y_share
        description: >
          D4 component: share resident ≤5 years (vulnerability-positive; high tenure = settled
          pre-gentrification population per Döring & Ulbricht 2016).
      - name: residents_total
        description: Total residents in this PLR for this year (from EWR; for population weighting).
      - name: legacy_gentrification_score
        description: >
          Pre-R-A1 formula kept for 2018 baseline comparison ONLY.
          = (status_score + dynamism_score - ewr_composite) / 3.0
          This formula averaged predictors and outcomes with no theoretical grounding.
          DO NOT use for new analysis. Refer to D1/D2 columns for outcome analysis
          and D3 columns for predictor analysis (R-A1; ADR-0008).
      - name: status_score_improved
        description: >
          OA-B.3 (#172) / OA-ablation (#261): "improved" D3 PREDICTOR -- z-score
          of the causality-first tier-weighted amenity-OA composite
          (int_poi_status_dynamism_improved for lor_2021 rows;
          int_poi_status_dynamism_improved_pre2021 for lor_pre2021 rows, #261),
          Vacancy domain excluded (ADR-0017 D-2). Berlin lor_2021 AND
          lor_pre2021 rows; NULL for the Hamburg branch only. Each vintage's
          z-scores are normalised WITHIN that vintage's own PLR population --
          NOT cross-vintage comparable (542 vs 448 PLRs). NEVER blended with
          the faithful status_score above (ADR-0017 D3/D4 methodology_variant
          rule).
      - name: dynamism_score_improved
        description: >
          OA-B.3 (#172) / OA-ablation (#261): "improved" D3 PREDICTOR -- z-score
          of the YoY change in the tier-weighted amenity-OA composite's city
          share (C5-equivalent normalization). Berlin lor_2021 AND lor_pre2021
          rows (#261); NULL for Hamburg. NEVER blended with the faithful
          dynamism_score above.
      - name: disinvestment_score_improved
        description: >
          OA-B.3 (#172) / OA-ablation (#261): z-score of the Vacancy-domain
          weighted stock -- the theorised OPPOSITE-POLE disinvestment/rent-gap
          marker (Smith 1979; ADR-0017 D-2). Kept SEPARATE from
          status/dynamism_score_improved -- never summed into one composite.
          Berlin lor_2021 AND lor_pre2021 rows (#261); NULL for Hamburg.
          NULL/undefined in the earliest lor_pre2021 years (2008-2011, near-zero
          Vacancy-domain OSM coverage) -- known, accepted limitation.
      - name: brw_trend
        description: >
          D3-brw-wire (#273): PREDICTOR/lead-side (ADR-0008) BRW change/
          rent-gap-realisation signal, threaded from int_berlin_brw_trend
          (#263). Change-positive polarity: high = land value rose faster
          than the citywide PLR average that year = upgrading pressure
          actively being realised (Smith 1979) -- OPPOSITE convention from
          the vulnerability-positive D1/D2/D4 columns above; NEVER pooled
          unsigned into a vulnerability composite. Berlin lor_2021 rows only
          (int_berlin_brw_trend's own grain constraint); NULL for
          lor_pre2021 and Hamburg branches. Not a measured rent or
          displacement outcome -- read jointly with low-status/low-Wohnlage
          context (D3-brw-trend-domain-signoff D5), never alone as a
          displacement-risk score.
      - name: brw_yoy_pct_change
        description: >
          D3-brw-wire (#273): raw (non-z-scored) year-over-year percentage
          change in brw_weighted_avg_eur_m2, threaded alongside brw_trend
          for consumers wanting the unstandardized magnitude. Same polarity/
          scope caveats as brw_trend above.
      - name: displacement_subindex
        description: >
          D5-wire (#258): PREDICTOR/lead-side (ADR-0008) displacement/
          affordability composite, threaded from
          int_berlin_displacement_subindex. Partial-availability mean of
          whichever of {turnover_proxy, rent_pressure_proxy} is available
          for that year -- NULL only when both are null (a verified coverage
          finding in that model's header shows the two inputs have zero
          overlapping lor_2021 years today, so a strict both-required rule
          would be permanently empty; see displacement_subindex_is_partial).
          Pressure-positive polarity: high = more long-tenure-resident
          turnover and/or above-median rent + transfer-dependency pressure --
          consistent orientation with the vulnerability-positive D1/D2/D4
          columns, but a PREDICTOR not an outcome (never blended with
          status_index/dynamik_index/ewr_composite). Berlin lor_2021 rows
          only (int_berlin_displacement_subindex's own scope constraint);
          NULL for lor_pre2021 and Hamburg branches. Not a measured
          displacement outcome -- read jointly with
          under_milieuschutz/milieuschutz_overlap_frac and low-status
          context (D5-wire-domain-signoff.md), never alone as a
          displacement-risk score.
      - name: displacement_subindex_is_partial
        description: >
          D5-wire (#258): TRUE when displacement_subindex was fed by only
          one of {turnover_proxy, rent_pressure_proxy} rather than both (see
          int_berlin_displacement_subindex.is_partial_availability). NULL
          when displacement_subindex itself is NULL. Berlin lor_2021 rows
          only; NULL for lor_pre2021 and Hamburg branches.
      - name: under_milieuschutz
        description: >
          D5-wire (#258): DISCLOSURE-ONLY, threaded from
          int_berlin_displacement_subindex / int_berlin_milieuschutz_plr_flag.
          TRUE if any part of this PLR is under a current Sec. 172 BauGB
          Milieuschutz designation. TIME-INVARIANT (the WFS exposes only the
          current designation set, ADR-0019 Open Question #2) -- the same
          value repeats for every snapshot_year of a given PLR. NEVER folded
          into displacement_subindex above (would fabricate temporal signal
          that does not exist in the source; see model header). Berlin
          lor_2021 rows only; NULL for lor_pre2021 and Hamburg branches.
      - name: milieuschutz_overlap_frac
        description: >
          D5-wire (#258): DISCLOSURE-ONLY, threaded alongside
          under_milieuschutz. Fraction of the PLR's area covered by a
          Milieuschutz designation ([0,1]), NULL when under_milieuschutz is
          false. Same time-invariance caveat as under_milieuschutz above.

  - name: int_gentrification_ts_unified_2021
    description: >
      R-A8b (#260) -- DRAFT / PENDING FRESH GEO-DS + DOMAIN SIGN-OFF (R-C1), iteration 2. NOT
      yet consumed by any downstream model. Builds a single continuous (city_code='BER',
      area_code=plr_id_2021, snapshot_year) outcome panel across all 7 MSS editions
      (2013-2025) by remapping the lor_pre2021 editions onto lor_2021 PLRs via a
      POPULATION-weighted dominant crosswalk (int_berlin_lor_crosswalk_dominant_pop_2021,
      revised per both reviewers' iteration-1 concerns), sourcing status/dynamik/typology
      directly from stg_berlin_mss (not the POI-inner-joined int_gentrification_ts, which
      silently dropped the 2013 edition in iteration 1). See model header for the full
      revision history, R-C2 grounding, and the concerns still open for downstream/public
      consumption (domain C-1 seam-aware trajectory handling; clustering remains out of
      scope).

      Grain: (city_code, area_code [lor_2021], snapshot_year).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - snapshot_year
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER' (Berlin-only source panel).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: area_code
        description: >
          lor_2021 PLR area code (8-digit, zero-padded). All rows -- including remapped
          lor_pre2021-origin editions -- are keyed to the lor_2021 scheme.
        data_tests:

          - not_null
      - name: snapshot_year
        description: MSS edition year (2013, 2015, 2017, 2019, 2021, 2023, 2025).
        data_tests:

          - not_null
      - name: status_index
        description: >
          D1 social-status ordinal (1=hoch...4=sehr_niedrig), sourced directly from
          stg_berlin_mss -- passed through unchanged (lor_2021 editions) or copied from the
          population-dominant-crosswalk-matched pre-2021 PLR (lor_pre2021-origin editions).
          NULL for uninhabited PLRs.
      - name: dynamik_index
        description: D2 social-direction ordinal (1=positiv, 2=stabil, 3=negativ). Same remap semantics as status_index.
      - name: typology_stage
        description: >
          Six-stage D1xD2 typology label, computed via the shared
          transform/macros/typology_stage.sql macro. Same remap semantics as status_index.
      - name: is_uninhabited
        description: True when the source MSS edition has gesamtindex IS NULL for this PLR/year.
      - name: remap_method
        description: "'passthrough' (lor_2021-native) or 'dominant_pop_crosswalk' (lor_pre2021-origin, population-weighted remap)."
        data_tests:

          - accepted_values:
              arguments:
                values: ["passthrough", "dominant_pop_crosswalk"]
      - name: is_bridged
        description: >
          Domain sign-off C-2/C-3 (pseudo-replication disclosure): true for remapped
          lor_pre2021-origin rows (a "borrowed" value from the dominant-population-matched
          pre-2021 PLR, not a native lor_2021 measurement). Public per-PLR content MUST NOT
          present a bridged row as neighbourhood-specific measured history without this flag.
      - name: population_dominance_frac
        description: >
          For is_bridged rows: what share of the target 2021 PLR's estimated 2019-baseline
          population the dominant pre-2021 source actually represents ([0,1]; exposed as a
          diagnostic, no materiality threshold applied here -- domain C-2's "low-confidence
          remap" signal, on a population basis). 1.0 for passthrough (non-bridged) rows.
      - name: n_lor2021_plrs_sharing_this_source
        description: >
          For is_bridged rows: how many lor_2021 PLRs (including this one) share the same
          dominant pre-2021 source PLR -- domain sign-off's pseudo-replication count (up to 6
          observed). NULL for passthrough (non-bridged) rows.
  - name: int_berlin_milieuschutz_event_panel
    description: >
      A10-P2 (#259) -- DRAFT / PENDING FRESH GEO-DS + DOMAIN SIGN-OFF (R-C1), header-fix
      revision. NOT yet consumed by any analysis script. Mechanical treatment/control panel
      assembly for a future difference-in-differences / event-study on Milieuschutz
      designation (#80 Part 2, re-opened): joins the MSS outcome series (sourced directly
      from stg_berlin_mss, applying #260's C2 lesson proactively -- this model never joins
      to int_gentrification_ts or any POI-derived table) to
      int_berlin_milieuschutz_plr_flag's designation status per PLR, computing event time
      (years since designation) for treated PLRs. Does NOT run any DiD/event-study
      regression, choose a control-matching strategy, or apply spatial controls. CENTRAL
      DOMAIN CONCERN (see model header for full detail): Milieuschutz designation is an
      ENDOGENOUS policy response to observed/anticipated upgrading pressure, not an
      exogenous shock -- the textbook selection-on-outcome confounder for DiD (B1 domain
      sign-off §b; #80 finding W3). The naive never-treated control pool is NOT DEFENSIBLE
      UNMATCHED. Designations span 1999-2026 (verified), so pre-window designations are
      "always-treated" and must be excluded from both cohort and control roles. All of
      these bind the future estimation ticket's own dual gate, not this panel-construction
      step.

      Grain: (city_code, area_code, area_vintage, snapshot_year).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - snapshot_year
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER' (Milieuschutz is a Berlin-only ADR-0019 source).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: area_code
        description: PLR area code, within its area_vintage's coordinate scheme.
        data_tests:

          - not_null
      - name: area_vintage
        description: "'lor_pre2021' or 'lor_2021' -- both directly from stg_berlin_mss, not unified via the still-gated #260 crosswalk (see model header)."
        data_tests:

          - not_null
      - name: snapshot_year
        description: MSS edition year.
      - name: under_milieuschutz
        description: Boolean treatment flag, from int_berlin_milieuschutz_plr_flag (current-designation-state, ST_Intersects any overlap).
        data_tests:

          - not_null
      - name: designation_year
        description: Year extracted from earliest_in_force_date; NULL for never-treated (control) PLRs.
      - name: event_time_years
        description: snapshot_year minus designation_year, for treated PLR-years only; NULL for control PLR-years or where designation_year is unavailable.
      - name: is_post_designation
        description: True/false for treated PLR-years (snapshot_year >= designation_year); NULL for control PLR-years (never a 0/1 -- controls are never "post").
  - name: int_ewr_lead_lag
    description: >
      #114: EWR-based annual lead-lag panel for same-era H2/H3 thesis comparison.

      The E1 regressions test H2/H3 against the MSS 2021–2025 panel, but the 2018 thesis
      used EWR data at the 2014→2016 snapshot gap. This model provides the same-era,
      same-source comparison: annual EWR composite pairs at k=1, 2, and 4 year lags.

      Key difference from int_mss_lead_lag: ewr_composite is a metric z-score mean so
      delta_ewr is a valid arithmetic delta (OLS + Spearman both permitted), unlike the
      MSS ordinal status_index where metric differencing is prohibited (index-definition.md §3.3).

      Coverage: 2008–2020 (full composite 2014–2020; partial 3-indicator composite 2008–2013 via B9b).
      Vintage: lor_2021 throughout (pre-2021 EWR years crosswalked via int_berlin_ewr_plr2021).
      Thesis comparison window: k=2 (2014→2016) matches the thesis lead-lag gap exactly.

      Grain: one row per (area_code, area_vintage, year_t, lag_k).
      lag_k ∈ {1, 2, 4} — annual steps.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - year_t
              - lag_k
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "year_tk = year_t + lag_k"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "year_t >= 2008 AND year_t <= 2020"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "year_tk <= 2024"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(delta_ewr - (ewr_composite_tk - ewr_composite_t)) < 1e-10"
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER'.
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (8-digit, zero-padded, lor_2021 vintage).
        data_tests:

          - not_null
      - name: area_vintage
        description: LOR boundary vintage. Always 'lor_2021' (all EWR years crosswalked).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_2021"]
      - name: year_t
        description: Base year of the lead-lag pair.
        data_tests:

          - not_null
      - name: lag_k
        description: Lag in annual steps. One of 1, 2, or 4.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 4]
      - name: year_tk
        description: Outcome year (year_t + lag_k).
        data_tests:

          - not_null
      - name: ewr_composite_t
        description: EWR composite z-score at base year. Non-null by construction.
        data_tests:

          - not_null
      - name: ewr_composite_tk
        description: EWR composite z-score at outcome year. Non-null by construction.
        data_tests:

          - not_null
      - name: delta_ewr
        description: >
          Metric delta of ewr_composite (ewr_composite_tk - ewr_composite_t).
          Positive = population became MORE socio-economically vulnerable (status worsened).
          Negative = population became LESS vulnerable (status improved, gentrification).
          Valid for OLS and Spearman (z-score arithmetic difference).
        data_tests:

          - not_null
      - name: delta_ewr_t
        description: >
          Annual change in ewr_composite at base year vs prior year
          (ewr_composite_t - ewr_composite_{t-1}). Used as the H3b predictor side.
          NULL for the earliest available year per PLR.
      - name: residents_total_t
        description: Total residents at base year (uninhabited guard — always > 0).
        data_tests:

          - not_null
      - name: is_partial_composite_t
        description: >
          TRUE when the base year uses the 3-indicator partial composite (year_t <= 2013).
          Pre-2014 EWR lacks foreigners_share and migration_background_share (B9b).
      - name: is_partial_composite_tk
        description: >
          TRUE when the outcome year uses the 3-indicator partial composite (year_tk <= 2013).
      - name: any_endpoint_partial
        description: >
          TRUE if either the base or outcome year uses the partial composite.
          MUST be filtered to FALSE for any pooled H2/H3 regression -- partial and full
          composites are not cross-era comparable (see B9-domain-signoff.md).

  - name: int_mss_lead_lag
    description: >
      R-A1 lead-lag validation model (#64): primary analysis table for the thesis's temporal
      order finding. Tests whether POI commercial activity at t predicts MSS social status
      change at t+k (H3a, rejected in thesis) or vice versa (H3b, confirmed in thesis).

      Theory: Dangschat (1988) double invasion-succession cycle — social cycle LEADS commercial
      cycle. H3b confirmed / H3a rejected in thesis (p. 91, p. 55–56).

      Grain: one row per (city_code, area_code, area_vintage, edition_t, lag_k).
      lag_k ∈ {1, 2, 3} — MSS edition steps (each = 2 years; MSS is biennial).

      Exclusions applied:
        - is_uninhabited = true PLRs excluded from both base and lagged row (§7.1).
        - Cross-vintage deltas blocked: area_vintage must match between base and lagged row.
        - Only rows where the lagged outcome (status_index_tk) exists are retained.

      D4 discipline: ewr_composite_t is the ONLY D4 column (level at time t as baseline
      covariate). No D4 delta columns — D4 changes are near-tautological outcome proxies.

      C5 correction: dynamism_score (C5-corrected) is used throughout, never raw count deltas.

      Berlin-only scope (#125): filtered to city_code='BER' -- the biennial
      "lag_k * 2" edition-step hardcode is Berlin-MSS-specific and is not valid for
      Hamburg's annual Sozialmonitoring cadence (ADR-0014). See SQL header for the
      methodology question flagged for the geo-DS + domain-expert gate.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - edition_t
              - lag_k
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delta_status_ordinal between -3 and 3"
          config:
            where: "delta_status_ordinal is not null"
      # Data-presence gate (docs/lessons/local-first-data-presence.md):
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER'.
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (8-digit, zero-padded).
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          LOR boundary vintage. 'lor_pre2021' (editions ≤2019) or 'lor_2021' (editions ≥2021).
          Both base and lagged row must share the same vintage (vintage guard, binding).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]
      - name: edition_t
        description: Base MSS edition year (time t; the predictor side).
        data_tests:

          - not_null
      - name: lag_k
        description: >
          MSS edition offset (1, 2, or 3 steps; each step = 2 years).
          edition_tk = edition_t + lag_k * 2.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: edition_tk
        description: Outcome MSS edition year (time t+k; edition_t + lag_k * 2).
        data_tests:

          - not_null
      - name: status_index_t
        description: >
          D1 MSS social status at time t (ordinal 1–4; 1=hoch best, 4=sehr_niedrig worst).
          Predictor side for H3a; baseline for H3b.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: dynamik_index_t
        description: >
          D2 MSS Dynamik at time t (ordinal 1–3; 1=positiv, 2=stabil, 3=negativ).
          Encodes the 2-year status change direction as a ready-made Δstatus proxy (thesis p. 97).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: typology_stage_t
        description: Typology stage at time t (from D1×D2 matrix; index-definition.md §1.5).
      - name: status_index_tk
        description: >
          D1 MSS social status at time t+k (outcome for H3a; ordinal 1–4).
          Only present rows where this exists (inner join on lag).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: dynamik_index_tk
        description: D2 MSS Dynamik at time t+k (outcome direction; ordinal 1–3).
        data_tests:

          - accepted_values:
              arguments:
                values: [1, 2, 3]
              config:
                where: "dynamik_index_tk is not null"
      - name: delta_status_ordinal
        description: >
          status_index_tk - status_index_t. ORDINAL transition; do NOT treat as metric.
          Positive = status worsened (more deprived). Negative = status improved (less deprived).
          Range: -3 to +3 (bounded by the 4-class ordinal scale).
          D1 POLARITY: lower numeric = higher status = LESS deprived (INVERSE of thesis status_summe).
      - name: status_transition
        description: >
          Ordinal transition direction: 'improved' (status_index fell), 'stable' (unchanged),
          'worsened' (status_index rose). For use in ordered-logit / ordinal regression (§3.2).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["improved", "stable", "worsened"]
      - name: dynamism_score_t
        description: >
          D3 C5-corrected dynamism score at time t (z-score of share_yoy_change).
          Commercial succession signal; PREDICTOR for H3a (amenity at t → status at t+k).
      - name: delta_dynamism_t
        description: >
          Change in D3 dynamism_score at t vs t-1 (within-vintage LAG).
          Predictor for H3b: Δamenity_{t} vs Δstatus_{t+k} (§2.2; both sides must be deltas).
          C5-corrected; NULL for first MSS edition in vintage.
      - name: dynamism_score_tk
        description: >
          D3 C5-corrected dynamism score at time t+k.
          Outcome for H3b: Δstatus_{t} → Δamenity_{t+k} (Dangschat social-leads-commercial).
      - name: ewr_composite_t
        description: >
          D4 baseline vulnerability covariate at time t (cross-sectional LEVEL only; §4.3).
          Higher = more socio-economically vulnerable. NO D4 delta columns in this model.
      - name: is_pre2021_vintage
        description: >
          True if area_vintage = 'lor_pre2021' (the 447-PLR series; thesis universe; longest
          MSS time series). Epic B headline analysis uses this series (index-definition.md §6.2).

  - name: int_hamburg_lead_lag
    description: >
      H-C3 (#160): mirror-image of int_mss_lead_lag for Hamburg -- independently
      re-tests whether POI commercial activity at t predicts Sozialmonitoring status
      change at t+k (H3a) or vice versa (H3b) on Hamburg's ANNUAL series. Does NOT
      assume the Berlin thesis's H3b-dominance finding replicates.

      ANNUAL-CADENCE REDESIGN (binding; ADR-0014; H1-geo-signoff.md Condition 2; #160):
      edition_tk = edition_t + lag_k * 1 (lag_k in {1,2,3} => 1/2/3 real years), NOT
      Berlin's `lag_k * 2` (2/4/6 real years). Same edition-step range as Berlin
      (1,2,3) for structural comparability, but a DIFFERENT real-time horizon --
      Hamburg lag_k=1 is a 1-year gap, Berlin lag_k=1 is a 2-year gap. Cross-city
      lag_k comparison must be read as "same step count, different real-year window",
      never as "same real-time horizon".

      Theory: Dangschat (1988) double invasion-succession cycle -- social cycle LEADS
      commercial cycle in Berlin's thesis (p. 91, p. 55-56). Whether this replicates on
      Hamburg is the open methodology question this model's grain enables
      analysis/e5_hamburg_lead_lag.py to test; results are reported honestly, whichever
      direction they turn out to be.

      Grain: one row per (city_code, area_code, area_vintage, edition_t, lag_k).
      city_code is always 'HH'; area_vintage is always 'current' (single Hamburg
      geometry edition, ADR-0014 Pillar 1).

      Exclusions applied (mirrors int_mss_lead_lag structurally; both are
      structural no-ops for Hamburg's data shape today, see SQL header):
        - is_uninhabited = true rows excluded (no-op: Hamburg has no such rows by
          construction, int_gentrification_ts Branch C).
        - Cross-vintage deltas blocked: area_vintage must match between base and
          lagged row (no-op: Hamburg has a single vintage today).
        - Only rows where the lagged outcome (status_index_tk) exists are retained.

      D4 discipline: ewr_composite_t is the ONLY D4 column (level at time t as
      baseline covariate). No D4 delta columns -- same rule as Berlin's model.

      C5 correction: dynamism_score (C5-corrected, independently re-validated on
      Hamburg's own OSM coverage-growth curve, H-C1 #158,
      docs/epic-h/158-hc1-geo-signoff.md) is used throughout, never raw count deltas.

      stadtteil_code (#129, binding acceptance criterion): carried on every row,
      joined from int_ewr_socioeco_hamburg_disagg's own Gebiet->Stadtteil crosswalk
      (unchanged method, new passthrough column). Required so
      analysis/e5_hamburg_lead_lag.py can cluster standard errors at Stadtteil grain
      for any regression using ewr_composite_t (D4) as a covariate, per
      H1-geo-signoff.md Condition 2 (D4's effective N is Stadtteil count, ~104-105,
      not Gebiet count, ~941-945 -- a change-of-support problem, Gotway & Young 2002).

      Hamburg-only scope, purely additive (mirror of int_mss_lead_lag's Berlin-only
      scope, #125): filtered to city_code='HH'; int_mss_lead_lag.sql (Berlin) is
      untouched. Does NOT widen any published mart's `accepted_values` beyond
      `["BER"]` (#158/#159 precedent) -- feeds only analysis/e5_hamburg_lead_lag.py.

      Graceful degradation: returns zero rows when int_gentrification_ts has no
      Hamburg rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - edition_t
              - lag_k
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delta_status_ordinal between -3 and 3"
          config:
            where: "delta_status_ordinal is not null"
      # Data-presence gate (docs/lessons/local-first-data-presence.md):
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'HH'.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["HH"]
      - name: area_code
        description: statistisches-Gebiet area code (subarea_l2 grain).
        data_tests:

          - not_null
      - name: area_vintage
        description: Always 'current' (single Hamburg geometry edition, ADR-0014 Pillar 1).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["current"]
      - name: edition_t
        description: Base Sozialmonitoring edition year (time t; the predictor side).
        data_tests:

          - not_null
      - name: lag_k
        description: >
          Sozialmonitoring edition offset (1, 2, or 3 steps; each step = 1 year,
          ANNUAL cadence -- NOT Berlin's 2-year step, see model description).
          edition_tk = edition_t + lag_k * 1.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: edition_tk
        description: Outcome Sozialmonitoring edition year (t+k; edition_t + lag_k * 1).
        data_tests:

          - not_null
      - name: status_index_t
        description: >
          D1 Sozialmonitoring social status at time t (ordinal 1-4; 1=hoch best,
          4=sehr niedrig worst -- same scale/polarity as Berlin's MSS status_index).
          Predictor side for H3a; baseline for H3b.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: dynamik_index_t
        description: >
          D2 Sozialmonitoring Dynamik at time t (ordinal 1-3; 1=positiv, 2=stabil,
          3=negativ). CAVEAT (ADR-0014 Pillar 2): computed over a 3-year window in
          Hamburg vs Berlin's 2-year window -- category comparable, magnitude is not.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: typology_stage_t
        description: Typology stage at time t (from D1xD2 matrix; index-definition.md §1.5).
      - name: status_index_tk
        description: >
          D1 social status at time t+k (outcome for H3a; ordinal 1-4). Only present
          for rows where this exists (inner join on lag).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: dynamik_index_tk
        description: D2 Dynamik at time t+k (outcome direction; ordinal 1-3).
        data_tests:

          - accepted_values:
              arguments:
                values: [1, 2, 3]
              config:
                where: "dynamik_index_tk is not null"
      - name: delta_status_ordinal
        description: >
          status_index_tk - status_index_t. ORDINAL transition; do NOT treat as metric.
          Positive = status worsened (more deprived). Negative = status improved (less
          deprived). Range: -3 to +3 (bounded by the 4-class ordinal scale).
      - name: status_transition
        description: >
          Ordinal transition direction: 'improved' (status_index fell), 'stable'
          (unchanged), 'worsened' (status_index rose).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["improved", "stable", "worsened"]
      - name: dynamism_score_t
        description: >
          D3 C5-corrected dynamism score at time t (z-score of share_yoy_change).
          Commercial succession signal; PREDICTOR for H3a (amenity at t -> status at
          t+k).
      - name: delta_dynamism_t
        description: >
          Change in D3 dynamism_score at t vs t-1 (within-vintage LAG, 1-year gap --
          annual cadence). Predictor for H3b. C5-corrected; NULL for first
          Sozialmonitoring edition available for that Gebiet.
      - name: dynamism_score_tk
        description: >
          D3 C5-corrected dynamism score at time t+k. Outcome for H3b.
      - name: ewr_composite_t
        description: >
          D4 baseline vulnerability covariate at time t (cross-sectional LEVEL only;
          3-indicator Hamburg composite, §4.3-equivalent). Higher = more
          socio-economically vulnerable. NO D4 delta columns in this model.
      - name: stadtteil_code
        description: >
          Stadtteil-grain SE-clustering key (#129, H1-geo-signoff.md Condition 2,
          binding). NULL where the Gebiet has no crosswalk match (legitimate
          data-coverage gap, see int_ewr_socioeco_hamburg_disagg). Any regression
          using ewr_composite_t as a covariate MUST cluster standard errors on this
          column.

  - name: int_berlin_lor_crosswalk_dominant_2021
    description: >
      QA-7b (#205): dominant (max-weight) pre-2021 <-> 2021 PLR crosswalk, extracted from the
      inline `xw_dominant` CTE previously embedded in analysis/e1_regressions.py's
      load_ewr_lead_lag_data. Used to bridge lor_2021 EWR lead-lag rows (int_ewr_lead_lag) to
      lor_pre2021 POI-count rows (int_poi_features_pivot, years < 2021) via a single
      representative pre-2021 PLR per lor_2021 PLR -- not an areal-weighted apportionment (see
      int_berlin_ewr_plr2021 for that; POI counts are area-level integers that cannot be validly
      split across multiple pre-2021 PLRs the way EWR shares/counts can).

      Pseudo-replication caveat (R-C2 grounding): ~78 pre-2021 PLRs are the dominant match for
      2+ lor_2021 PLRs (up to 6 each) -- ~35% of lor_2021 PLRs share their bridged poi_count with
      at least one neighbour. Consumers (e1_regressions.py H2/H3 EWR comparison) must treat
      results as directional evidence, not independent-observation p-values.

      Grain: one row per plr_id_2021 (all 542 lor_2021 PLRs resolve to exactly one dominant
      pre-2021 PLR).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plr_id_2021
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER' (Berlin-specific LOR crosswalk).
        data_tests:

          - not_null
      - name: plr_id_2021
        description: PLR area code in the LOR 2021 reform scheme (8-digit string, zero-padded).
        data_tests:

          - not_null
          - unique
      - name: plr_id_pre2021
        description: >
          The dominant (largest-overlap-share) pre-2021 PLR area code for this plr_id_2021.
        data_tests:

          - not_null
      - name: dominant_weight
        description: >
          The crosswalk weight (share of the pre-2021 PLR's area falling in this plr_id_2021)
          for the selected dominant row. Not an apportionment factor here -- informational only
          (records how confident the "dominant" pick is; low values indicate a close second
          candidate).
        data_tests:

          - not_null

  - name: int_berlin_lor_crosswalk_dominant_pop_2021
    description: >
      R-A8b (#260) fix: POPULATION-weighted dominant pre-2021 <-> 2021 PLR crosswalk, built in
      response to the geo-DS and gentrification-domain-expert sign-offs on
      int_gentrification_ts_unified_2021.sql -- both concluded that for a population-derived
      MSS classification, the representative pre-2021 source PLR should be selected by
      estimated POPULATION contribution (residents_total * area_weight, the same
      extensive-apportionment idiom int_berlin_ewr_plr2021 uses for population counts), not by
      land area (as the sibling int_berlin_lor_crosswalk_dominant_2021 does for its own,
      separate POI-count-bridging use case -- NOT modified here, to avoid an unreviewed
      behaviour change to that model's existing consumer, analysis/e1_regressions.py).
      Population baseline: 2019 (int_ewr_socioeco_pre2021, last pre-reform EWR edition).
      Deterministic tie-break: ORDER BY estimated_population_contribution DESC, plr_id_pre2021.

      Also carries the pseudo-replication disclosure columns the domain sign-off required
      (n_lor2021_plrs_sharing_this_source) and a population_dominance_frac diagnostic.

      Grain: one row per plr_id_2021 (all 542 lor_2021 PLRs resolve to exactly one dominant
      pre-2021 PLR by estimated population contribution).
    meta:
      dbt_meta_owner: data-engineer
      status: draft_pending_methodology_signoff
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plr_id_2021
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER' (Berlin-specific LOR crosswalk).
        data_tests:

          - not_null
      - name: plr_id_2021
        description: PLR area code in the LOR 2021 reform scheme (8-digit string, zero-padded).
        data_tests:

          - not_null
          - unique
      - name: plr_id_pre2021
        description: The population-dominant pre-2021 PLR area code for this plr_id_2021.
        data_tests:

          - not_null
      - name: area_weight
        description: The underlying geometric crosswalk weight (informational; not the selection criterion here).
      - name: reverse_weight
        description: The underlying geometric reverse-crosswalk weight (informational; not the selection criterion here).
      - name: pre2021_plr_residents_total_2019
        description: 2019 EWR residents_total for the dominant pre-2021 PLR (population baseline).
      - name: dominant_population_weight
        description: estimated_population_contribution for the selected dominant source (residents_total_2019 * area_weight).
      - name: population_dominance_frac
        description: >
          What share of the target 2021 PLR's total estimated 2019-baseline population the
          dominant source represents ([0,1]). Diagnostic only, no threshold applied here.
        data_tests:

          - not_null
      - name: n_lor2021_plrs_sharing_this_source
        description: >
          How many lor_2021 PLRs (including this one) share the same dominant pre-2021 source
          PLR -- domain sign-off's pseudo-replication disclosure count.
        data_tests:

          - not_null
  - name: int_berlin_brw_plr
    description: >
      D3 (#29): Area-weighted spatial join of BRW land value zones → LOR 2021 PLR boundaries.
      Thesis §3.4: land value as structural rent-gap indicator.

      Method: ST_Intersects(brw_geom, plr_geom) as join predicate; weight = ST_Area(intersection)
      (the raw overlap area, not normalised); brw_weighted_avg_eur_m2 = SUM(value_eur_per_m2 *
      intersection_area_m2) / SUM(intersection_area_m2) — intensive-variable formula per geo-DS.
      Residential zones only: nutzung LIKE 'W%' (Wohngebiet variants WA, WR, WB, WS, etc.).
      Sliver guard: drop when overlap area < 1 m² AND fraction < 0.5% (AND semantics, geo cond 3).

      Always uses lor_2021 PLR geometries for temporal consistency across the 2017–2024 BRW series.
      snapshot_year derived from YEAR(brw.reference_date).

      Graceful degradation: returns zero rows when stg_berlin_bodenrichtwert or stg_berlin_lor
      return zero rows (no parquets ingested yet). Build passes before data is downloaded.

      Source: stg_berlin_bodenrichtwert + stg_berlin_lor. CRS: EPSG:25833 throughout.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "brw_weighted_avg_eur_m2 > 0"
          config:
            where: "brw_weighted_avg_eur_m2 is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "brw_residential_coverage_frac <= 1.05"
          config:
            where: "brw_residential_coverage_frac is not null"
            severity: warn
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). Normalised to 'BER' by this model
          (stg_berlin_bodenrichtwert emits 'berlin'; normalised here for dim_city FK compatibility).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER"]
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: BRW reference year (integer, derived from YEAR(reference_date); 2017–2024).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code in LOR 2021 scheme (8-digit, zero-padded). FK -> stg_berlin_lor.
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          LOR geometry vintage. Always 'lor_2021' (only lor_2021 PLR geometries are joined
          to provide a stable spatial reference across the full 2017–2024 BRW series).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_2021"]
              config:
                where: "area_code is not null"
      - name: brw_weighted_avg_eur_m2
        description: >
          Area-weighted mean Bodenrichtwert (EUR/m²) for this PLR in this year.
          Formula: SUM(value_eur_per_m2 * overlap_area) / SUM(overlap_area) — intensive
          variable formula (Openshaw 1984; mirrors int_berlin_ewr_plr2021 note).
          Residential zones only (nutzung LIKE 'W%'; BauNVO Wohngebiet variants).
          NULL if no residential BRW zones overlap this PLR for this year (pure park/water/
          industrial/airport PLR). Never 0 — zero EUR/m² is a false statement (geo cond 4).
      - name: n_brw_zones
        description: >
          Count of distinct residential BRW zones contributing to this PLR's weighted mean.
          Always >= 1 when brw_weighted_avg_eur_m2 is not null.
      - name: brw_residential_coverage_frac
        description: >
          Fraction of the PLR area covered by residential (nutzung LIKE 'W%') BRW zones:
          SUM(intersection_area_m2) / ST_Area(plr_geom) per PLR.
          Expected range: (0, 1]. Values > 1.0 indicate topological artefacts post-makevalid
          — flag in QA; do not treat > 1.0 as valid coverage. A warn-severity test guards this.
          NULL when no W% BRW zones overlap this PLR (pure park/water/industrial).
          Consumers: use to identify where the BRW signal is thin or absent. Zero-residential
          PLRs yield NULL brw_weighted_avg_eur_m2 and NULL here — transparent, not silently 0.
          (geo condition 4; index-definition §7 "exclude, don't zero-impute").

  - name: int_berlin_brw_trend
    description: >
      D3-brw-change (#263): explicit, separately-polarised BRW *change* signal
      (brw_yoy/brw_trend), distinct from the BRW *level* (int_berlin_brw_plr).
      Follow-up to D3 geo-signoff condition 14 / D3 domain-signoff point D5,
      which both pre-approved this exact construction and deferred it here.

      Method: explicit year_t/year_t-1 self-join on int_berlin_brw_plr (not
      LAG(), so a real gap in the back-series yields omission rather than a
      silently-wrong multi-year delta). brw_yoy_pct_change = pct change in
      brw_weighted_avg_eur_m2; brw_trend = per-(city_code, snapshot_year)
      z-score of brw_yoy_pct_change across PLRs (NULLIF(stddev_pop,0) guard).

      Polarity (Smith 1979 rent-gap realisation): HIGH brw_trend = land value
      rose faster than the citywide PLR average that year = upgrading pressure
      being actively realised. Change-positive, NOT vulnerability-positive --
      belongs on the predictor/lead side of the index (ADR-0008), never folded
      into the D3 level dimension or an unsigned vulnerability composite.

      Back-series depth: 2017-2024 (int_berlin_brw_plr), so brw_yoy/brw_trend
      populate for snapshot_year 2018-2024 (2017 has no year_t-1 predecessor).

      Zero consumers as of this model -- same staged-slice pattern as
      int_berlin_rent_pressure_proxy/int_berlin_turnover_proxy/the Milieuschutz
      flag; wiring into int_gentrification_ts is scoped to its own follow-up
      integration ticket (mirrors #258 D5-wire).

      See docs/methodology/D3-brw-trend-geo-signoff.md and
      docs/methodology/D3-brw-trend-domain-signoff.md.

      Source: int_berlin_brw_plr.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - snapshot_year
    columns:
      - name: city_code
        description: City identifier (ADR-0005), normalised to 'BER' (inherited from int_berlin_brw_plr).
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code in LOR 2021 scheme (matches int_berlin_brw_plr).
        data_tests:

          - not_null
      - name: area_vintage
        description: LOR geometry vintage. Always 'lor_2021' (inherited from int_berlin_brw_plr).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_2021"]
      - name: snapshot_year
        description: >
          BRW reference year_t (the later of the two years differenced). Ranges
          2018-2024 (2017 is the first available year and has no predecessor).
        data_tests:

          - not_null
      - name: brw_weighted_avg_eur_m2
        description: BRW level at year_t, carried through from int_berlin_brw_plr.
      - name: brw_weighted_avg_eur_m2_prev
        description: BRW level at year_t-1 (matched via explicit self-join, not LAG()).
      - name: brw_residential_coverage_frac
        description: Residential BRW coverage fraction at year_t, carried through from int_berlin_brw_plr.
      - name: brw_yoy_delta_eur_m2
        description: brw_weighted_avg_eur_m2(t) - brw_weighted_avg_eur_m2(t-1), raw EUR/m² delta.
      - name: brw_yoy_pct_change
        description: >
          brw_yoy_delta_eur_m2 / brw_weighted_avg_eur_m2_prev. Percentage form used as the
          z-scoring input so PLRs with very different absolute price levels are compared on
          a scale-free basis before standardising.
      - name: brw_trend
        description: >
          Per-(city_code, snapshot_year) z-score of brw_yoy_pct_change across PLRs. HIGH
          (positive) = land value rose faster than the citywide PLR average that year --
          rent-gap realisation / upgrading-pressure signal (Smith 1979). Change-positive,
          NOT vulnerability-positive; predictor/lead side only (ADR-0008); never folded into
          the D3 level dimension. Not a measured rent or displacement outcome -- read jointly
          with low-status/low-Wohnlage context, per D3 domain sign-off.

  - name: int_berlin_wohnlage_plr
    description: >
      D3 (#29): Wohnlage residential quality tier composition per PLR per WFS edition year.
      Thesis §3.4: Wohnlage residential quality tier composition per PLR — Mietspiegel basis.

      Method: ST_Within(wohnlage_point, plr_polygon) — point-in-polygon, same predicate as
      int_osm_poi_plr (geo-DS approved C3 method). Vintage alignment mirrors int_osm_poi_plr:
      vintage <= 2020 → lor_pre2021 geometries; vintage >= 2021 → lor_2021 geometries.
      pct_wohnlage = n_addresses / SUM(n_addresses) OVER (PARTITION BY vintage, area_code, area_vintage).

      Graceful degradation: returns zero rows when stg_berlin_wohnlage or stg_berlin_lor
      return zero rows (no parquets ingested yet). Build passes before data is downloaded.

      Source: stg_berlin_wohnlage + stg_berlin_lor. CRS: EPSG:25833 throughout.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - vintage
              - area_code
              - area_vintage
              - wohnlage
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "pct_wohnlage between 0 and 1"
          config:
            where: "pct_wohnlage is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). Normalised to 'BER' by this model
          (stg_berlin_wohnlage emits 'berlin'; normalised here for dim_city FK compatibility).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER"]
              config:
                where: "area_code is not null"
      - name: vintage
        description: "WFS edition year (integer: 2017, 2019, 2021, 2023, 2026)."
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: "PLR area code. Vintage-specific (8-digit, zero-padded): lor_pre2021 or lor_2021 codes."
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          LOR geometry vintage used for the spatial join.
          'lor_pre2021' for vintage <= 2020 (448 PLRs); 'lor_2021' for vintage >= 2021 (542 PLRs).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]
              config:
                where: "area_code is not null"
      - name: wohnlage
        description: >
          Wohnlage residential quality tier (from WFS wol attribute).
          Values include 'einfach', 'mittel', 'gut' and their combinations.
          The exact tier vocabulary changes slightly across WFS vintages.
        data_tests:

          - not_null
      - name: n_addresses
        description: Count of Wohnlage-classified addresses in this PLR for this tier and vintage.
      - name: pct_wohnlage
        description: >
          Share of addresses in this Wohnlage tier within this PLR for this vintage year.
          pct_wohnlage = n_addresses / SUM(n_addresses) OVER (PARTITION BY vintage, area_code, area_vintage).
          Sums to 1.0 within each (vintage, area_code, area_vintage) group.
          Ranges from 0 to 1 inclusive.
      - name: wohnlage_low_n
        description: >
          Flag: TRUE when the PLR-vintage has fewer than 10 total Wohnlage address points
          (sum of n_addresses across all tiers for this PLR-vintage).
          Composition is computed but the share is statistically unstable with < 10 points.
          Downstream consumers (mart_price_rent_dimension) NULL the derived wohnlage_score
          and estimated rent for low-N PLR-vintages. Never zero-filled (geo condition 7).
          Low-N PLRs largely coincide with the BRW-NULL/uninhabited set — QA cross-check.

  - name: int_price_rent_wohnlage_mietspiegel
    description: >
      QA-6b (#204): extracted from mart_price_rent_dimension.sql -- merges Wohnlage
      tier composition (Signal 2) with the modelled Mietspiegel rent estimate at a
      fixed representative dwelling profile (Signal 3; 60-90 sqm, 1950-1964 construction
      year -- geo condition 9). Pure mechanical extraction, no logic change; see
      mart_price_rent_dimension.sql header for the full R-C2 citations and geo/domain
      sign-off references (docs/epic-d/d3-price-rent-geo-signoff.md,
      d3-price-rent-domain-signoff.md).

      Vintage matching (geo condition 8): joins each Wohnlage vintage (2017, 2019,
      2021, 2023, 2026) to the nearest Mietspiegel vintage <= the Wohnlage year (all
      current Wohnlage vintages have an exact Mietspiegel match).

      wohnlage_score and est_rent_* are NULL when wohnlage_low_n = TRUE (< 10 address
      points; geo condition 7).

      Source: int_berlin_wohnlage_plr + stg_berlin_mietspiegel.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005), normalised to 'BER'.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Wohnlage WFS edition year (2017, 2019, 2021, 2023, 2026).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (vintage-specific scheme).
        data_tests:

          - not_null
      - name: area_vintage
        description: LOR geometry vintage ('lor_pre2021' or 'lor_2021').
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]
              config:
                where: "area_code is not null"
      - name: pct_einfach
        description: Share of Wohnlage addresses in the 'einfach' (simple) tier for this PLR-vintage.
      - name: pct_mittel
        description: Share of Wohnlage addresses in the 'mittel' (medium) tier for this PLR-vintage.
      - name: pct_gut
        description: Share of Wohnlage addresses in the 'gut' (good) tier for this PLR-vintage.
      - name: total_n_addresses
        description: Total Wohnlage address points across all tiers for this PLR-vintage.
      - name: wohnlage_low_n
        description: >
          Flag: TRUE when total_n_addresses < 10 (unstable composition). wohnlage_score
          and est_rent_* are NULL when this is TRUE (geo condition 7).
      - name: wohnlage_score
        description: >
          Ordinal-mean approximation: pct_einfach*1 + pct_mittel*2 + pct_gut*3.
          Tiers are ordered but NOT equidistant -- this is an approximation, not an
          interval measure. NULL when wohnlage_low_n = TRUE.
      - name: est_rent_mid
        description: >
          Modelled/estimated net cold rent (EUR) at the fixed reference dwelling
          profile (60-90 sqm, 1950-1964 construction year) -- NOT observed rent paid
          (domain D6). Bestandsmiete/ortsübliche Vergleichsmiete basis (Holm 2010):
          lagging, conservative proxy (domain D7). NULL when wohnlage_low_n = TRUE.
      - name: est_rent_low
        description: Low estimate of the modelled rent range; same profile/caveats as est_rent_mid.
      - name: est_rent_high
        description: High estimate of the modelled rent range; same profile/caveats as est_rent_mid.
      - name: mietspiegel_vintage_used
        description: >
          The Mietspiegel vintage year actually matched to this Wohnlage vintage
          (nearest-<= rule, geo condition 8) -- audit trail for the vintage match.

  - name: int_berlin_rent_pressure_proxy
    description: >
      #70 [B1] / ADR-0019 Decision 2: affordability / rent-pressure proxy --
      combines modelled Mietspiegel rent level (relative to the citywide/PLR
      median, per-year z-score) with the MSS transferbezug_anteil transfer-receipt
      share (ability-to-pay-stress proxy, already vulnerability-positive per the
      R-A4/#67 geo-signoff) into an equal-weight mean-of-z-scores composite. NOT a
      rent-to-income ratio (no PLR-grain income series exists; ADR-0007 gap;
      ADR-0019 Alternative C rejected that approach under R-C2 grounding).

      Coverage limitation: as actually ingested, transferbezug_anteil is non-null
      for MSS editions 2015, 2017, 2023, 2025 and NULL for editions 2019, 2021
      (narrower suspension window than R-A4/#67's "<=2021" characterization --
      verified directly against stg_berlin_mss_indicators). rent_pressure_proxy
      is therefore populated for Wohnlage snapshot_year in (2017, 2023, 2026) and
      NULL for snapshot_year in (2019, 2021) by construction. z_rent_rel alone is
      populated for all snapshot years.

      Zero consumers as of this model -- not yet wired into any mart or the
      governed gentrification_index (ADR-0019 explicitly defers that integration
      to a later, separately-gated slice). See
      docs/methodology/B1-rent-pressure-geo-signoff.md and
      docs/methodology/B1-rent-pressure-domain-signoff.md.

      Source: int_price_rent_wohnlage_mietspiegel + stg_berlin_mss_indicators.
      Follow-up now tracked: #258 (D5-wire).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005), normalised to 'BER'.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Wohnlage WFS edition year (2017, 2019, 2021, 2023, 2026).
      - name: area_code
        description: PLR identifier (matches stg_berlin_lor / int_price_rent_wohnlage_mietspiegel).
      - name: area_vintage
        description: LOR boundary vintage ('lor_pre2021' or 'lor_2021').
      - name: est_rent_mid
        description: >
          Modelled mid rent estimate carried through from
          int_price_rent_wohnlage_mietspiegel (Signal 3 input to z_rent_rel).
          NULL when the source is NULL (wohnlage_low_n).
      - name: transferbezug_anteil
        description: >
          MSS transfer-receipt (SGB II/XII) share for the matched edition
          (ability-to-pay-stress input to z_transfer_stress). NULL for matched
          editions 2019 and 2021 (see model header coverage-limitation note).
      - name: transfer_stress_mss_edition
        description: >
          The MSS edition actually matched to this Wohnlage snapshot_year
          (nearest-<= rule, mirrors geo condition 8) -- audit trail for the match.
      - name: z_rent_rel
        description: >
          Per-snapshot_year z-score of est_rent_mid across PLRs (higher = rent
          further above that year's citywide median). Populated for all
          snapshot years where est_rent_mid is non-null.
      - name: z_transfer_stress
        description: >
          Per-snapshot_year z-score of transferbezug_anteil across PLRs (higher =
          more transfer-dependent residents; vulnerability-positive, no sign flip
          -- R-A4/#67 Finding d). NULL for snapshot_year in (2019, 2021); see
          model header coverage-limitation note.
      - name: rent_pressure_proxy
        description: >
          mean(z_rent_rel, z_transfer_stress) -- affordability-stress composite
          (ADR-0019 Decision 2). NULL when either input z-score is NULL (no
          imputation across the transferbezug suspension gap). High = above-median
          modelled rent combined with an above-median transfer-dependent
          population share (rent risen/already high where residents can least
          absorb it) -- an affordability-stress signal, not a measured
          displacement event and not a rent-to-income ratio.

  - name: int_berlin_turnover_proxy
    description: >
      #70 [B1], third slice: turnover / Wohndauer (residence-duration) proxy.
      Year-over-year change in residence_duration_5y_share (EWR DAU5), negated per
      the thesis sign convention (indicator-semantics.md 65-66: falling long-tenure
      share = turnover-positive), then per-(city_code, reference_year) z-scored
      across PLRs. A single-indicator change score (not a multi-indicator
      composite) -- complements the static vulnerability level already consumed by
      int_ewr_socioeco's composite. Explicit year_t/year_t-1 self-join (not LAG())
      so a real gap in the annual EWR panel yields NULL rather than a
      silently-wrong multi-year delta. Uninhabited-PLR guard applied (residents_total
      IS NULL or = 0 excluded).

      Zero consumers as of this model -- not yet wired into any mart or the
      governed gentrification_index (same staged-slice pattern as
      int_berlin_rent_pressure_proxy). See
      docs/methodology/B1-turnover-geo-signoff.md and
      docs/methodology/B1-turnover-domain-signoff.md.

      Known gap (#197): residence_duration_5y_share is entirely NULL for
      reference_year 2024/2025 as ingested (upstream EWR CSV parse failures), so
      turnover_proxy is NULL for reference_year=2025 by honest NULL propagation,
      not imputation.

      Source: int_ewr_socioeco.
      Follow-up now tracked: #258 (D5-wire).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - reference_year
    columns:
      - name: city_code
        description: City identifier (ADR-0005), normalised to 'BER'.
        data_tests:

          - not_null
      - name: area_code
        description: PLR identifier (matches int_ewr_socioeco).
      - name: area_vintage
        description: LOR boundary vintage (lor_2021 throughout, inherited from int_ewr_socioeco).
      - name: reference_year
        description: EWR reference year (year_t; the later of the two years differenced).
      - name: residence_duration_5y_share
        description: DAU5 share at year_t, carried through from int_ewr_socioeco.
      - name: residence_duration_5y_share_prev
        description: DAU5 share at year_t-1 (matched via explicit self-join, not LAG()).
      - name: turnover_raw
        description: >
          -1 * (residence_duration_5y_share - residence_duration_5y_share_prev) --
          thesis sign convention; positive = long-tenure share fell (turnover signal).
      - name: turnover_proxy
        description: >
          Per-(city_code, reference_year) z-score of turnover_raw across PLRs
          (NULLIF(stddev_pop,0) degenerate-year guard). High = long-tenure
          residents leaving faster than being replaced by other long-tenure
          residents relative to other PLRs that year -- a turnover/displacement
          signal, not a measured displacement event.
      - name: any_endpoint_partial
        description: >
          TRUE when either year_t or year_t-1 falls in the pre-2014 partial-EWR-composite
          era (B9b). residence_duration_5y_share itself is present in both eras, so this
          flag is informational (cross-era caution carried through, not enforced) rather
          than a null-producing condition.

  - name: int_berlin_milieuschutz_plr_flag
    description: >
      #70 [B1], fourth slice (first integration slice): spatially resolves
      stg_berlin_milieuschutz (current-state Sec. 172 Abs. 1 Nr. 2 BauGB
      designated-area polygons) onto the PLR grain via ST_Intersects (not
      ST_Within -- Milieuschutz boundaries do not align with PLR boundaries;
      see docs/methodology/B1-milieuschutz-geo-signoff.md), covering both LOR
      vintages independently. Produces a disclosure-only binary flag +
      overlap fraction; deliberately NOT blended with rent_pressure_proxy or
      turnover_proxy (three different, honestly-incompatible time grains --
      see model header) and NOT wired into the contract-enforced
      gentrification_index mart. Intended as the "parallel published layer"
      satisfying #70's acceptance-criteria fallback option.

      Current-state only: the WFS exposes only the current designation set
      (no per-year edition endpoint), so this is not a time-series panel --
      earliest_in_force_date is carried through for a coarse before/after cut
      only.

      See docs/methodology/B1-milieuschutz-geo-signoff.md and
      docs/methodology/B1-milieuschutz-domain-signoff.md.

      Source: stg_berlin_milieuschutz + stg_berlin_lor.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
    columns:
      - name: city_code
        description: City identifier (ADR-0005), normalised to 'BER'.
        data_tests:

          - not_null
      - name: area_code
        description: PLR identifier (matches stg_berlin_lor).
      - name: area_vintage
        description: LOR boundary vintage (lor_pre2021 or lor_2021).
      - name: under_milieuschutz
        description: >
          TRUE when the PLR spatially intersects at least one current
          Milieuschutz (soziale Erhaltungsverordnung) designation. A policy
          marker of displacement risk the city already recognizes, not a
          measured displacement outcome -- PLRs without the flag are not
          thereby "safe from displacement," only "not (yet) formally
          protected" (ADR-0019 Consequences).
        data_tests:

          - not_null
      - name: milieuschutz_designation_count
        description: Count of distinct Milieuschutz designations overlapping this PLR (0 if none).
      - name: milieuschutz_area_codes
        description: >
          Comma-separated list of overlapping Milieuschutz area_codes
          (schluessel, e.g. "EM0105"), NULL when under_milieuschutz is FALSE.
      - name: earliest_in_force_date
        description: >
          Earliest in_force_date among the PLR's overlapping designations, if
          any -- a coarse "protected since at least this date" marker, NOT a
          reconstructed status panel (see model header).
      - name: milieuschutz_overlap_frac
        description: >
          Sum of intersection area across all overlapping designations,
          divided by the PLR's own area, clipped to [0,1]. 0 when
          under_milieuschutz is FALSE. Lets a consumer distinguish
          marginal-boundary-touch from near-total-coverage without this
          model imposing a materiality threshold itself.

  - name: int_berlin_displacement_subindex
    description: >
      #258 (D5-wire): builds the ADR-0008 D5 displacement/affordability
      predictor from the three proxies staged under #70 [B1] --
      int_berlin_turnover_proxy, int_berlin_rent_pressure_proxy,
      int_berlin_milieuschutz_plr_flag -- giving each a real consumer.

      COVERAGE FINDING (verified, not assumed): turnover_proxy (annual EWR
      panel) and rent_pressure_proxy (irregular Wohnlage WFS editions) have
      ZERO overlapping lor_2021 years today -- turnover_proxy only has rows
      for 2009-2020 (EWR ingestion gap #197 leaves 2021+ empty/NULL),
      rent_pressure_proxy's lor_2021 rows only exist for 2023 and 2026. A
      strict all-or-nothing composite would therefore be PERMANENTLY EMPTY
      given the data as ingested. displacement_subindex is instead a
      PARTIAL-AVAILABILITY mean of whichever of {turnover_proxy,
      rent_pressure_proxy} is non-null (NULL only when both are null) --
      n_components_available / is_partial_availability disclose which.
      This averages only signals that ARE present, never imputes a missing
      one.

      Milieuschutz is still NOT folded into this numeric composite -- its
      own model explicitly states it does not reconstruct a status panel
      across years (WFS exposes only the current designation set, ADR-0019
      Open Question #2); blending a time-invariant flag into an annual
      composite would fabricate temporal signal that does not exist in the
      source. under_milieuschutz / milieuschutz_overlap_frac are instead
      carried through as separate DISCLOSURE-ONLY, time-invariant columns.

      rent_pressure_proxy alignment: matched via nearest-<=-vintage (most
      recent Wohnlage snapshot_year known as of the spine year) -- the same
      "nearest edition <= year" pattern int_berlin_rent_pressure_proxy
      itself already uses (geo condition 8 precedent), not a new alignment
      rule invented for this ticket. turnover_proxy is matched by EXACT
      reference_year (already annual).

      Grain: UNION of every year either proxy covers (not just
      turnover_proxy's own years -- see coverage finding above). Berlin
      lor_2021 rows only (both source proxies are lor_2021-only as
      ingested), same scope constraint as int_berlin_brw_trend
      (D3-brw-wire, #273).

      Consumed by int_gentrification_ts as a new PREDICTOR/lead-side field
      (ADR-0008), Branch A (lor_2021) only. NOT wired into the
      contract-enforced gentrification_index mart (a separate, larger
      contract-change decision).

      See docs/methodology/D5-wire-geo-signoff.md and
      docs/methodology/D5-wire-domain-signoff.md.

      Source: int_berlin_turnover_proxy + int_berlin_rent_pressure_proxy +
      int_berlin_milieuschutz_plr_flag.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - reference_year
      # Guards against the design regressing back to the permanently-empty
      # strict composite (see header coverage finding) -- at least some rows
      # must carry a non-null displacement_subindex given today's real data.
      - assert_not_empty:
          config:
            severity: error
    columns:
      - name: city_code
        description: City identifier (ADR-0005), normalised to 'BER'.
        data_tests:

          - not_null
      - name: area_code
        description: PLR identifier (matches int_ewr_socioeco / int_berlin_turnover_proxy).
      - name: area_vintage
        description: LOR boundary vintage (lor_2021 throughout -- both source proxies are lor_2021-only).
      - name: reference_year
        description: >
          The UNION spine year -- either an EWR reference_year
          (int_berlin_turnover_proxy) or a Wohnlage snapshot_year
          (int_berlin_rent_pressure_proxy), whichever contributed this row
          (see model header coverage finding).
      - name: turnover_proxy
        description: Passthrough from int_berlin_turnover_proxy (see that model). NULL if this spine year has no turnover_proxy row.
      - name: rent_pressure_proxy
        description: >
          Passthrough from int_berlin_rent_pressure_proxy, matched to this
          spine year via nearest-<=-vintage on snapshot_year (see model
          header). NULL when no Wohnlage snapshot_year <= this year exists
          yet, or when the underlying rent_pressure_proxy itself is NULL
          (see that model's own coverage-limitation note).
      - name: matched_rent_pressure_snapshot_year
        description: >
          The Wohnlage snapshot_year actually matched to this spine year
          (nearest-<= rule) -- audit trail for the match.
      - name: displacement_subindex
        description: >
          Partial-availability mean of whichever of {turnover_proxy,
          rent_pressure_proxy} is non-null -- NULL only when BOTH are null
          (see model header for why a strict all-or-nothing rule would be
          permanently empty given today's real coverage). Higher = higher
          displacement/affordability pressure from whichever signal(s) are
          available.
      - name: n_components_available
        description: 0, 1, or 2 -- how many of {turnover_proxy, rent_pressure_proxy} fed displacement_subindex for this row.
      - name: is_partial_availability
        description: TRUE when exactly one of the two components is available (n_components_available = 1) -- lets a consumer filter to full-coverage rows only if desired.
      - name: any_endpoint_partial
        description: Passthrough from int_berlin_turnover_proxy (cross-era pooling caution). NULL when no turnover_proxy row exists for this spine year.
      - name: under_milieuschutz
        description: >
          DISCLOSURE-ONLY, passthrough from int_berlin_milieuschutz_plr_flag.
          TIME-INVARIANT -- the same value repeats for every reference_year
          of a given PLR (see model header). Defaults to FALSE when no
          Milieuschutz row exists for this (city_code, area_code,
          area_vintage). NEVER folded into displacement_subindex above.
      - name: milieuschutz_overlap_frac
        description: >
          DISCLOSURE-ONLY, passthrough from int_berlin_milieuschutz_plr_flag.
          Same time-invariance caveat as under_milieuschutz above. NULL when
          no Milieuschutz row exists for this PLR.
      - name: earliest_in_force_date
        description: Passthrough from int_berlin_milieuschutz_plr_flag (see that model).

  - name: int_price_rent_brw_wohnlage_combined
    description: >
      QA-6b (#204): extracted from mart_price_rent_dimension.sql -- aligns the BRW
      land-value series (Signal 1, yearly 2017-2024, from int_berlin_brw_plr) with
      the Wohnlage+modelled-rent series (Signals 2+3, from
      int_price_rent_wohnlage_mietspiegel, biennial 2017/2019/2021/2023/2026) via
      nearest-<= vintage matching, then UNIONs in Wohnlage-only rows for vintages with
      no BRW companion (e.g. 2026). Pure mechanical extraction, no logic change; see
      mart_price_rent_dimension.sql header for the full R-C2 citations and geo/domain
      sign-off references.

      Output grain: one row per (city_code, snapshot_year, area_code, area_vintage) --
      this is the mart's final published grain; mart_price_rent_dimension.sql adds
      only the winsorized normalization (z-score/rank/percentile) on top.

      Source: int_berlin_brw_plr + int_price_rent_wohnlage_mietspiegel.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005), normalised to 'BER'.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: >
          BRW reference year (2017-2024) when a BRW row exists; otherwise the
          Wohnlage-only vintage year (e.g. 2026).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (lor_2021 scheme -- see int_berlin_brw_plr header).
        data_tests:

          - not_null
      - name: area_vintage
        description: LOR geometry vintage. Always 'lor_2021' (inherited from int_berlin_brw_plr).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: brw_weighted_avg_eur_m2
        description: >
          Area-weighted mean Bodenrichtwert (EUR/m2); see int_berlin_brw_plr. NULL for
          Wohnlage-only rows (no BRW companion for that year).
      - name: n_brw_zones
        description: Count of contributing BRW zones; see int_berlin_brw_plr. NULL for Wohnlage-only rows.
      - name: brw_residential_coverage_frac
        description: Residential BRW coverage fraction; see int_berlin_brw_plr. NULL for Wohnlage-only rows.
      - name: pct_einfach
        description: Wohnlage 'einfach' tier share, matched via nearest-<= vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: pct_mittel
        description: Wohnlage 'mittel' tier share, matched via nearest-<= vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: pct_gut
        description: Wohnlage 'gut' tier share, matched via nearest-<= vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: total_n_addresses
        description: Total Wohnlage address points for the matched vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: wohnlage_low_n
        description: Low-N flag for the matched Wohnlage vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: wohnlage_score
        description: Ordinal-mean Wohnlage score for the matched vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: est_rent_mid
        description: Modelled rent estimate (mid) for the matched vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: est_rent_low
        description: Modelled rent estimate (low) for the matched vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: est_rent_high
        description: Modelled rent estimate (high) for the matched vintage; see int_price_rent_wohnlage_mietspiegel.
      - name: mietspiegel_vintage_used
        description: Mietspiegel vintage matched within int_price_rent_wohnlage_mietspiegel; passthrough audit trail.
      - name: wohnlage_vintage_matched
        description: >
          The Wohnlage vintage year matched to this BRW snapshot_year (nearest-<= rule).
          For Wohnlage-only rows, equals snapshot_year itself.

  - name: int_osm_poi_plr_weighted
    description: >
      A6 (#69): Distance-weighted PLR POI counts — Gaussian kernel variant.
      Applies a mass-conserving Gaussian decay kernel (spatial-methods.md §1-§2) to
      spread each POI's count across all PLRs within bandwidth b (default 500 m).

      Kernel: w_ij = exp(-d_ij² / (2·b²)) for d_ij ≤ b (else 0); d_ij = ST_Distance
      from POI point to PLR ST_PointOnSurface in EPSG:25833 (spatial-methods.md §3).
      Mass conservation: ŵ_ij = w_ij / Σ_i w_ij (spatial-methods.md §2).

      Bandwidth b = 500 m default (dbt var 'poi_kernel_bandwidth_m'); per-city parameter,
      never hard-coded (ADR-0005). MAUP sweep uses 250 m / 750 m variants via analysis/a6_maup.py.
      OA (#166) sweeps 500 m / 1000 m / 1500 m with a 1000 m headline (spatial-methods.md §11.2).

      Mass-leakage guard (spatial-methods.md §11.3; ADR-0017 D5 C-1): a POI whose home PLR
      is large/low-density (Tempelhofer Feld, Grunewald) can be > b from every PLR's
      representative point and match zero rows via ST_DWithin. Such POIs are fall-back
      assigned to their hard home PLR (`hard_area_code`) at weight 1, so no POI mass is
      silently dropped and Σ_a weighted_count per level equals the hard-count city total
      per level (enforced by test_c1_oa_weighted_mass_conservation_invariance.sql).

      Output: one row per (city_code, snapshot_year, area_code, area_vintage, poi_category_h,
      poi_type_h, weight_variant) with weighted_count (fractional; sum = standard count
      city-wide); weight_variant discriminator (e.g. 'gaussian_500m'). Feeds the same share pipeline as int_poi_features_pivot
      for the distance-weighted dynamism_score used by Gi* hotspot analysis (spatial-methods.md §6),
      and (#166) int_poi_offering_advantage's weighted OA variant.

      CRS: EPSG:25833 throughout (ADR-0010 Amendment 3; spatial-methods.md §3).
      Graceful degradation: zero-row typed stub when OSM/LOR data absent.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - poi_category_h
              - poi_type_h
              - weight_variant
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "weighted_count >= 0"
          config:
            where: "area_code is not null and weighted_count is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot (integer, 2008-2026).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded). Vintage-specific.
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          LOR scheme vintage: 'lor_pre2021' (snapshot_year <= 2020) or
          'lor_2021' (snapshot_year >= 2021).
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]
              config:
                where: "area_code is not null"
      - name: poi_domain_h
        description: Harmonized POI domain (from int_osm_poi_harmonized).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: poi_category_h
        description: Harmonized POI category (from int_osm_poi_harmonized).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: poi_type_h
        description: Harmonized POI type (from int_osm_poi_harmonized).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: weighted_count
        description: >
          Distance-weighted fractional POI count for this PLR, year, and category.
          Sum of ŵ_ij (normalized Gaussian kernel weights) over all POIs j of this
          category reaching PLR i within bandwidth b. City-wide sum equals total POI
          count (mass-conserving; spatial-methods.md §2).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: contributing_poi_count
        description: >
          Integer count of POIs contributing to this PLR's weighted_count (i.e. POIs
          within bandwidth b). Always >= 1 when weighted_count > 0.
      - name: weight_variant
        description: >
          Kernel variant discriminator for MAUP sensitivity comparison (spatial-methods.md §7).
          Default: 'gaussian_500m' (b=500 m). Sweep variants: 'gaussian_250m', 'gaussian_750m'.
          Compare against 'standard' (hard point-in-polygon from int_osm_poi_plr).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"

  - name: int_poi_offering_advantage
    description: >
      OA-A.2 (#166, ADR-0017): Offering Advantage (OA) -- 3-level nested location
      quotient (LQ) for POI stock at domain, category, and type taxonomy leaves,
      computed for BOTH weight_variant values (hard 'standard' + Gaussian-weighted),
      faithful Run 1 only (thesis pp. 55-56, 91; reference/system/70_oa_helper.sql,
      71_oa.sql; spatial-methods.md §11; ADR-0017 D1-D5).

      OA(level, a) = (level_a / parent_a) / (level_city / parent_city) -- domain's
      parent is the all-domains grand total; category's AND type's parent is their
      shared domain total (neither nests under category). OA = 1 means represented
      at the city-wide compositional rate; > 1 over-represented; < 1 under-represented
      (standard LQ, Isard 1960; Miller/Gibson/Wright 1991).

      Grain: one row per taxonomy leaf actually observed (city_code, snapshot_year,
      area_code, area_vintage, poi_domain_h, poi_category_h, poi_type_h,
      weight_variant, methodology_variant); every row is 'faithful' today
      (methodology_variant enumerated now so OA-B.1..B.4 (#170-173) append
      'improved' rows without a grain migration -- ADR-0017 D4).

      Sparse representation (documented Epic B directional divergence, not a
      defect): a taxonomy leaf with zero POIs in a PLR-year produces no row here,
      unlike the thesis's zero-filled wide pivot -- see model SQL header for the
      golden-comparison implication (OA-A.3 #167).

      C-1 invariance (ADR-0017 D5, BLOCKING): weighted-variant city-wide totals per
      level must equal the hard-count city-wide totals per level exactly, guaranteed
      by int_osm_poi_plr_weighted's mass-leakage guard and enforced by the singular
      test test_c1_oa_weighted_mass_conservation_invariance.sql.

      Interpretation (domain-expert D-1/D-2, ADR-0017 D5): OA is a DESCRIPTIVE
      early-gentrification indicator, not a causal displacement predictor, and is a
      multi-signed bundle (do not sum raw oa_* across types into one score --
      Vacancy-domain OA is a disinvestment marker, the opposite pole from
      amenity-domain OA).

      Graceful degradation: zero rows when fct_poi_development and/or
      int_osm_poi_plr_weighted have no rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - poi_domain_h
              - poi_category_h
              - poi_type_h
              - weight_variant
              - methodology_variant
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded). Vintage-specific.
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          Spatial-join vintage. 'lor_pre2021'/'lor_2021' for Berlin LOR; 'current'
          for Hamburg statistische Gebiete (this model unions all cities via
          fct_poi_development, not Berlin-only).
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: poi_domain_h
        description: Harmonized POI domain (from seed_poi_mapping.csv via fct_poi_development).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: poi_category_h
        description: Harmonized POI category.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: poi_type_h
        description: Harmonized POI type.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: weight_variant
        description: >
          'standard' (hard point-in-polygon count) or the Gaussian-weighted
          kernel variant carried through from int_osm_poi_plr_weighted (e.g.
          'gaussian_1000m', the OA headline bandwidth -- spatial-methods.md §11.2).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: methodology_variant
        description: >
          ADR-0017 D4 structural invariant. This ticket populates 'faithful' only;
          'improved' rows are appended by OA-B.1..B.4 (#170-173), never blended.
        data_tests:

          - accepted_values:
              arguments:
                values: ["faithful", "improved"]
              config:
                where: "area_code is not null"
      - name: type_stock_local
        description: t_a -- this row's own taxonomy-leaf stock within its PLR.
      - name: type_stock_city
        description: t_city -- city-wide stock for this exact (domain, category, type) triple.
      - name: category_stock_local
        description: c_a -- category total within this PLR (sum over types in this category).
      - name: category_stock_city
        description: c_city -- city-wide category total.
      - name: domain_stock_local
        description: >
          D_a -- domain total within this PLR; shared parent base for both
          category-level and type-level OA (ADR-0017 D1).
      - name: domain_stock_city
        description: D_city -- city-wide domain total.
      - name: all_domains_stock_local
        description: Σ_d d_a -- all-domains grand total within this PLR (domain-level parent base).
      - name: all_domains_stock_city
        description: Σ_d d_city -- all-domains grand total city-wide.
      - name: oa_domain
        description: >
          Domain-level location quotient: (domain_stock_local / all_domains_stock_local)
          / (domain_stock_city / all_domains_stock_city). NULL when a denominator
          is zero (parent-share division, spatial-methods.md §11.1).
        data_tests:

          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "area_code is not null and oa_domain is not null"
      - name: oa_category
        description: >
          Category-level LQ against the shared parent domain (not the
          all-domains total; ADR-0017 D1). NULL when a denominator is zero.
        data_tests:

          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "area_code is not null and oa_category is not null"
      - name: oa_type
        description: >
          Type-level LQ against the shared parent domain (NOT category;
          ADR-0017 D1). NULL when a denominator is zero.
        data_tests:

          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "area_code is not null and oa_type is not null"
      - name: oa_domain_min_base_flag
        description: >
          #274 (ADR-0017 D5 D-3 discharge, advisory): true when
          all_domains_stock_local (this PLR-year's TOTAL poi count across every
          domain) is below the `oa_min_poi_base_n` dbt var (default 10) -- the
          compositional-LQ small-denominator instability the domain sign-off
          names ("a single POI can swing a type's local share"). Constant
          across every domain/category/type row of the same (city_code,
          snapshot_year, area_code, area_vintage, weight_variant) -- this is a
          PLR-year-level "thinly-mapped" property, not domain-specific. See
          model header for the threshold derivation and the poi-map page's use
          of this flag to suppress oa_domain in flagged PLRs.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: oa_category_min_base_flag
        description: >
          #274 (ADR-0017 D5 D-3 discharge, advisory): true when
          domain_stock_local (this row's parent DOMAIN's own local total
          within the PLR -- oa_category's actual denominator, ADR-0017 D1) is
          below `oa_min_poi_base_n` (default 10).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: oa_type_min_base_flag
        description: >
          #274 (ADR-0017 D5 D-3 discharge, advisory): true when
          domain_stock_local (the parent DOMAIN's local total within the PLR
          -- oa_type's actual denominator too, ADR-0017 D1: type nests under
          domain, not category) is below `oa_min_poi_base_n` (default 10).
          Identical value to oa_category_min_base_flag on the same row by
          construction (both level's denominator is domain_stock_local).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"

  - name: int_poi_offering_advantage_methods
    description: >
      OA-D3/OA-D3b (#240/#280, ADR-0024): calculation-method columns for
      Offering Advantage -- nine methods (nested_lq, global_lq, log_lq,
      share_diff, shrunk_lq, raw_share, zscore_slq, density, percapita) x
      three taxonomy levels domain/category/type = 27 value columns.
      Methods 1-7 are pure functions of int_poi_offering_advantage's
      already-computed, already-tested stock columns -- no new join, no new
      tool. Methods 8-9 (density, percapita, this slice) join a NEW
      denominator (ST_Area-derived area_km2; EWR residents_total) and are
      NOT location quotients -- an absolute provision/centrality reading,
      never blended/legend-shared with the LQ family (OA-D0 domain sign-off
      Condition C). **Getis-Ord Gi\* remains DEFERRED**, pending a
      system-architect/ADR-0025 ruling on the esda tooling boundary (OA-D0
      geo sign-off C9) -- see model SQL header for the full split rationale.

      Grain: identical to int_poi_offering_advantage (one row per taxonomy
      leaf x weight_variant x methodology_variant) -- new columns only, no
      new grain discriminator (ADR-0024 "methods as columns"). density's
      area_km2 and percapita's residents_total are joined at a coarser grain
      (city_code/area_code/area_vintage[/snapshot_year]) and broadcast across
      every leaf row for that area (C2 broadcast-once).

      C7 (geo sign-off, BLOCKING, never-blend): every column is a function of
      exactly one method against one stock pair; no combined/averaged score
      is computed or exposed.

      Graceful degradation: zero rows when int_poi_offering_advantage has no
      rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - poi_domain_h
              - poi_category_h
              - poi_type_h
              - weight_variant
              - methodology_variant
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). #281: canonicalized at this model's own
          output boundary (join_city_code reused as city_code) -- unlike its
          upstream source int_poi_offering_advantage, which still carries
          legacy lowercase 'berlin' rows by design, this model's output is
          canonical-only.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded). Vintage-specific.
      - name: area_vintage
        description: Spatial-join vintage, carried through from int_poi_offering_advantage.
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: poi_domain_h
        description: Harmonized POI domain.
      - name: poi_category_h
        description: Harmonized POI category.
      - name: poi_type_h
        description: Harmonized POI type.
      - name: weight_variant
        description: >
          'standard' or a Gaussian-weighted kernel variant, carried through
          unchanged.
      - name: methodology_variant
        description: ADR-0017 D4 structural invariant ('faithful' today).
        data_tests:

          - accepted_values:
              arguments:
                values: ["faithful", "improved"]
              config:
                where: "area_code is not null"
      - name: oa_domain_nested_lq
        description: Domain-level nested (parent-relative) LQ -- identical to int_poi_offering_advantage.oa_domain.
      - name: oa_category_nested_lq
        description: Category-level nested LQ -- identical to int_poi_offering_advantage.oa_category.
      - name: oa_type_nested_lq
        description: Type-level nested LQ -- identical to int_poi_offering_advantage.oa_type.
      - name: oa_domain_global_lq
        description: >
          Domain-level global (city-relative) LQ -- algebraically identical
          to oa_domain_nested_lq by construction (a domain's own parent is
          already the all-domains grand total); see model header note 2.
      - name: oa_category_global_lq
        description: Category-level LQ against the all-domains grand total (not the parent domain).
      - name: oa_type_global_lq
        description: Type-level LQ against the all-domains grand total (not the parent domain).
      - name: oa_domain_log_lq
        description: ln(oa_domain_nested_lq) -- log-centred at 0.
      - name: oa_category_log_lq
        description: ln(oa_category_nested_lq) -- log-centred at 0.
      - name: oa_type_log_lq
        description: ln(oa_type_nested_lq) -- log-centred at 0.
      - name: oa_domain_share_diff
        description: >
          Domain local_share minus city_share (percentage-point difference,
          NOT a ratio -- C7 never-blend with the LQ-family columns).
      - name: oa_category_share_diff
        description: Category local_share minus city_share (parent-relative bases, pp difference).
      - name: oa_type_share_diff
        description: Type local_share minus city_share (parent-relative bases, pp difference).
      - name: oa_domain_shrunk_lq
        description: >
          Empirical-Bayes/Laplace-shrunk domain LQ (prior weight k =
          oa_min_poi_base_n; Efron & Morris 1975; Agresti 2013 Sec 3.3).
      - name: oa_category_shrunk_lq
        description: Empirical-Bayes/Laplace-shrunk category LQ.
      - name: oa_type_shrunk_lq
        description: Empirical-Bayes/Laplace-shrunk type LQ.
      - name: oa_domain_raw_share
        description: >
          Raw within-group domain share (proportion, no city normalization).
          Expected to fail the D5 completeness-contamination gate (OA-D0 geo
          sign-off C3) -- not temporally safe.
      - name: oa_category_raw_share
        description: Raw within-group category share (proportion, no city normalization).
      - name: oa_type_raw_share
        description: Raw within-group type share (proportion, no city normalization).
      - name: oa_domain_zscore_slq
        description: >
          OA-D3b (#280): binomial-significance z-score of the domain LQ
          (Isserman 1977; Wilson 1927 normal approximation) -- expected =
          local_base*city_share, variance = local_base*city_share*(1-city_share),
          z = (observed-expected)/sqrt(variance). NULL when variance <= 0.
      - name: oa_category_zscore_slq
        description: Binomial-significance z-score of the category LQ (same construction as oa_domain_zscore_slq, category-relative base).
      - name: oa_type_zscore_slq
        description: Binomial-significance z-score of the type LQ (same construction as oa_domain_zscore_slq, type-relative base).
      - name: oa_domain_density
        description: >
          OA-D3b (#280): domain_stock_local / area_km2 (ST_Area, native
          metric CRS, PLR grain only) -- POIs per km2, an absolute
          provision reading, NOT a location quotient (OA-D0 domain
          sign-off Condition C). NULL where no area_km2 join match.
      - name: oa_category_density
        description: Category-level density (same construction as oa_domain_density, category stock numerator).
      - name: oa_type_density
        description: Type-level density (same construction as oa_domain_density, type stock numerator).
      - name: oa_domain_percapita
        description: >
          OA-D3b (#280): domain_stock_local / EWR residents_total * 1000
          (POIs per 1,000 residents), joined on an EXACT snapshot_year =
          EWR reference_year match (OA-D0 geo sign-off C10 -- no
          nearest-year fallback, no imputation) -- NULL where no exact-year
          match exists. Absolute provision reading, NOT a location
          quotient; population denominator is endogenous to displacement
          (OA-D0 domain sign-off Condition C) -- caveat travels with every
          downstream consumer.
      - name: oa_category_percapita
        description: Category-level per-capita (same construction as oa_domain_percapita, category stock numerator).
      - name: oa_type_percapita
        description: Type-level per-capita (same construction as oa_domain_percapita, type stock numerator).

  - name: int_poi_within_group_dominance
    description: >
      OA-D4 (#240, ADR-0024): within-group offering-dominance model -- HHI,
      top-share, Shannon entropy, Pielou evenness, and a signed top_child +
      offering_tier, computed ONLY over a curated five-group allow-list
      (gastronomy_category, gastronomy_restaurant_cuisine, retail_category,
      entertainment_category, wellness_curated) per OA-D0 domain sign-off
      Condition A -- see seed_oa_dominance_groups.csv and the model SQL
      header for the full allow-list rationale and confirmed exclusions
      (Vacancy, infrastructure domains, Tourism, Hipster/Coworking).

      Grain: one row per (city_code, snapshot_year, area_code, area_vintage,
      weight_variant, dominance_group) -- a GROUP-level grain, distinct from
      OA's taxonomy-leaf grain, since dominance is a property of the group.

      Ethics gate (OA-D0 domain sign-off Condition B, mandatory, all four
      clauses -- see model SQL header): (B.1) descriptive diversity index,
      no antitrust/market-power reading; (B.2) sign-blind HHI/top_share must
      always be read paired with top_child + top_child_offering_tier, never
      bare; (B.3) is_public_safe = false for gastronomy_restaurant_cuisine --
      cuisine-typed Restaurant dominance is an ethnic-stigma vector and MUST
      be filtered out of any public, displacement-adjacent surface; (B.4)
      is_thin_base flags (never drops) low-count cells -- descriptive-not-
      causal, anti-erasure (Haklay 2010).

      Graceful degradation: zero rows when int_poi_offering_advantage has no
      rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - weight_variant
              - dominance_group
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). #281: canonicalized in the base CTE --
          unlike its upstream source int_poi_offering_advantage, which still
          carries legacy lowercase 'berlin' rows by design, this model's
          output is canonical-only.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
      - name: area_code
        description: PLR area code (8-digit, zero-padded). Vintage-specific.
      - name: area_vintage
        description: Spatial-join vintage, carried through from int_poi_offering_advantage.
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: weight_variant
        description: "'standard' or a Gaussian-weighted kernel variant, carried through unchanged."
      - name: dominance_group
        description: >
          One of the five curated allow-list groups (see model description).
          NOT an open-ended domain/category label -- governed by
          seed_oa_dominance_groups.csv.
        data_tests:

          - accepted_values:
              arguments:
                values:
                  [
                    "gastronomy_category",
                    "gastronomy_restaurant_cuisine",
                    "retail_category",
                    "entertainment_category",
                    "wellness_curated",
                  ]
              config:
                where: "area_code is not null"
      - name: is_public_safe
        description: >
          FALSE only for gastronomy_restaurant_cuisine (OA-D0 domain
          sign-off Condition B.3 anti-stigma clause). Any consumer rendering
          a dominance figure on a public, displacement-adjacent surface MUST
          filter is_public_safe = true first.
      - name: group_stock_local
        description: Sum of child_stock across all present (positive-stock) children in this group cell.
      - name: n_children
        description: Count of present (positive-stock) children contributing to this group cell.
      - name: hhi
        description: >
          Herfindahl-Hirschman concentration index, sum(share_i^2), range
          [1/n_children, 1]. Descriptive diversity index only (Condition
          B.1) -- never publish without top_child/top_child_offering_tier
          (Condition B.2).
        data_tests:

          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1.0000001 }
              config:
                where: "area_code is not null"
      - name: top_share
        description: Largest single child's share of the group (max share_i).
        data_tests:

          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1.0000001 }
              config:
                where: "area_code is not null"
      - name: entropy
        description: Shannon entropy of the within-group share distribution, range [0, ln(n_children)].
      - name: evenness
        description: >
          Pielou evenness (entropy / ln(n_children)), range [0,1]. NULL when
          n_children <= 1 (undefined, not zero/error -- see model SQL
          header).
      - name: top_child
        description: The child_label (category or type name) with the largest share in this group cell.
      - name: top_child_level
        description: "'category' or 'type' -- the taxonomy grain of top_child."
      - name: top_child_offering_tier
        description: >
          top_child's offering_tier from seed_poi_offering_relevance.csv
          (Condition B.2 mandatory signed pairing). May be NULL if the
          taxonomy leaf has no matching relevance-seed row.
      - name: top_child_offering_weight
        description: top_child's offering_weight from seed_poi_offering_relevance.csv (same pairing as top_child_offering_tier).
      - name: is_thin_base
        description: >
          TRUE when group_stock_local < greatest(10, 5 * n_children) --
          dominance-specific min-parent-base gate (stricter than OA's flat
          oa_min_poi_base_n floor). Flags, never drops (Condition B.4
          anti-erasure).

  - name: int_poi_offering_advantage_arealevel
    description: >
      OA-D2 (#240, ADR-0024): area_level roll-up of int_poi_offering_advantage's
      faithful nested-LQ (domain/category/type). OA-D8 (#240) generalized
      this model from Berlin-only to city-agnostic (ADR-0005) -- it now
      rolls up Berlin (plr/bzr/pgr/bezirk) AND Hamburg (subarea_l2/
      subarea_l1/district, via OA-D1b's resolved parent edges) through the
      same code path -- see model SQL header for the full generalization
      mechanism (dim_city.oa_leaf_area_level + dim_area_hierarchy edges,
      no more `city_code = 'BER'`/substr() literal).

      Rolls up each city's leaf-grain stock via dim_area_hierarchy's
      resolved parent edges (Berlin: LOR RAUMID prefix nesting; Hamburg:
      OA-D1b's Gebiet->Stadtteil spatial crosswalk + WFS Stadtteil->Bezirk)
      per OA-D0 geo-DS sign-off Condition C1 (the only roll-up option that
      provably preserves the C-1 mass-conservation invariant -- re-kernelling
      per level would break it). City-wide totals are broadcast unchanged
      from int_poi_offering_advantage rather than re-windowed over the
      unioned multi-level rows (Condition C2 -- the specific guard against an
      I15-class overcount at 4x scale).

      Grain: one row per (city_code, snapshot_year, area_level, area_code,
      area_vintage, poi_domain_h, poi_category_h, poi_type_h, weight_variant,
      methodology_variant). area_level in ('plr', 'bzr', 'pgr', 'bezirk')
      for Berlin, ('subarea_l2', 'subarea_l1', 'district') for Hamburg; each
      city's leaf-level rows (dim_city.oa_leaf_area_level) are a 1:1
      pass-through of int_poi_offering_advantage.

      Bezirk rows are numeric-only in this model (Condition C8's ST_Union
      dissolved geometry lives in dim_area_geometry.sql, D6); Hamburg's
      levels already have their own WFS polygons (no dissolve needed).

      C-1b invariance (geo sign-off Condition C6, BLOCKING): local stock
      summed over all areas at a level must equal that level's city-wide
      total, AND the city-wide total must be identical across every
      area_level value FOR A GIVEN CITY -- enforced by
      test_c1b_oa_arealevel_mass_conservation_invariance.sql, which groups
      by city_code and so validates Berlin and Hamburg independently.

      Deferred to later D-spine tickets (see model SQL header): D3
      calculation-method columns, C3 completeness-contamination gate and C5
      MAUP rank-stability check (D5 comparison study). Any consumer
      publishing a coarse-level figure MUST carry the domain sign-off's
      binding Condition D ecological-fallacy / headline-scale framing (Berlin:
      BZR headline, Bezirk context-only; Hamburg, OA-D8: subarea_l1/Stadtteil
      headline, district/Bezirk context-only, argued independently per the
      OA-D1b domain sign-off forward condition 1) -- not enforced by this
      model itself, see mart_poi_oa_arealevel.sql.

      Graceful degradation: zero rows when int_poi_offering_advantage has no
      rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_level
              - area_code
              - area_vintage
              - poi_domain_h
              - poi_category_h
              - poi_type_h
              - weight_variant
              - methodology_variant
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005). 'BER' (Berlin) or 'HH' (Hamburg, OA-D8, #240).
        data_tests:

          - accepted_values:
              arguments:
                values: ["BER", "HH"]
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_level
        description: >
          Spatial roll-up level. Each city's own leaf level (dim_city.
          oa_leaf_area_level: 'plr' for Berlin, 'subarea_l2' for Hamburg) is
          the pass-through finest grain; 'bzr'/'pgr'/'bezirk' (Berlin) and
          'subarea_l1'/'district' (Hamburg, OA-D8) are roll-ups via
          dim_area_hierarchy's resolved parent edges (see model SQL header).
        data_tests:

          - accepted_values:
              arguments:
                values:
                  ["plr", "bzr", "pgr", "bezirk", "subarea_l2", "subarea_l1", "district"]
              config:
                where: "area_code is not null"
      - name: area_code
        description: >
          Area code at this row's area_level (8-digit PLR, 6-digit BZR,
          4-digit PGR, or 2-digit Bezirk prefix for Berlin; native Gebiet/
          Stadtteil/Bezirk id for Hamburg). Vintage-specific.
        data_tests:

          - not_null:
              config:
                where: "snapshot_year is not null"
      - name: area_vintage
        description: >
          Spatial-join vintage. 'lor_pre2021'/'lor_2021' for Berlin;
          'current' for Hamburg (OA-D8, single WFS edition, ADR-0014).
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: poi_domain_h
        description: Harmonized POI domain.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: poi_category_h
        description: Harmonized POI category.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: poi_type_h
        description: Harmonized POI type.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: weight_variant
        description: >
          'standard' or a Gaussian-weighted kernel variant, carried through
          from int_poi_offering_advantage.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: methodology_variant
        description: ADR-0017 D4 structural invariant, carried through from int_poi_offering_advantage.
        data_tests:

          - accepted_values:
              arguments:
                values: ["faithful", "improved"]
              config:
                where: "area_code is not null"
      - name: type_stock_local
        description: Rolled-up (prefix-summed for bzr/pgr/bezirk; pass-through for plr) taxonomy-leaf stock within this area_level's area.
      - name: type_stock_city
        description: City-wide stock, broadcast unchanged from int_poi_offering_advantage (identical across every area_level -- C-1b assertion 2).
      - name: category_stock_local
        description: Rolled-up category total within this area_level's area.
      - name: category_stock_city
        description: City-wide category total, broadcast unchanged.
      - name: domain_stock_local
        description: Rolled-up domain total within this area_level's area.
      - name: domain_stock_city
        description: City-wide domain total, broadcast unchanged.
      - name: all_domains_stock_local
        description: Rolled-up all-domains grand total within this area_level's area.
      - name: all_domains_stock_city
        description: City-wide all-domains grand total, broadcast unchanged.
      - name: oa_domain
        description: Domain-level LQ at this area_level, same formula as int_poi_offering_advantage.oa_domain (ADR-0017 D1).
        data_tests:

          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "area_code is not null and oa_domain is not null"
      - name: oa_category
        description: Category-level LQ at this area_level, same formula as int_poi_offering_advantage.oa_category.
        data_tests:

          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "area_code is not null and oa_category is not null"
      - name: oa_type
        description: Type-level LQ at this area_level, same formula as int_poi_offering_advantage.oa_type.
        data_tests:

          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "area_code is not null and oa_type is not null"
      - name: oa_domain_min_base_flag
        description: >
          D-3 min-base flag (#274 discharge) re-evaluated against this
          area_level's own rolled-up all_domains_stock_local -- see model SQL
          header. Coarser levels naturally flag less often (OA-D0 geo
          sign-off Condition C4, "resolution-vs-stability dial").
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: oa_category_min_base_flag
        description: D-3 min-base flag re-evaluated against this area_level's own rolled-up domain_stock_local.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: oa_type_min_base_flag
        description: D-3 min-base flag re-evaluated against this area_level's own rolled-up domain_stock_local (identical to oa_category_min_base_flag by construction).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"

  - name: int_mss_bzr_aggregate
    description: >
      B10 (#120): BZR (Bezirksregion) and Bezirk spatial aggregation of MSS, EWR, and POI
      data. Rolls up PLR-level data from int_gentrification_ts to BZR (~138-143 units) and
      Bezirk (~12 units) using population-weighted means.

      BZR code = first 6 chars of 8-digit PLR area_code.
      Bezirk code = first 2 chars of 8-digit PLR area_code ('01'-'12').

      For lor_pre2021, BZR codes (6 chars) match the 2018 thesis BZR raum_ids exactly
      (all 137 thesis BZR codes verified 2026-06-30).

      Status_index and dynamik_index: population-weighted mean rounded to nearest ordinal.
      POI counts: summed across constituent PLRs (extensive).
      EWR composites and shares: population-weighted averages (intensive).
      Typology: derived from aggregated status_index x dynamik_index (D1xD2 matrix, ADR-0008).

      Output grain: (city_code, area_code, area_vintage, area_level, snapshot_year).
      area_level: 'bzr' or 'bezirk'.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
              - area_vintage
              - snapshot_year
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER'.
        data_tests:

          - not_null
      - name: area_level
        description: Area level. Values 'bzr' or 'bezirk'.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["bzr", "bezirk"]
      - name: area_code
        description: Area code — 6-char BZR code or 2-char Bezirk code.
        data_tests:

          - not_null
      - name: area_vintage
        description: LOR boundary vintage ('lor_pre2021' or 'lor_2021').
        data_tests:

          - not_null
      - name: snapshot_year
        description: MSS edition year (2013, 2015, 2017, 2019, 2021, 2023, 2025).
        data_tests:

          - not_null
      - name: status_index
        description: >
          Population-weighted mean of constituent PLR status_index values, rounded to
          nearest ordinal (1=hoch/best … 4=sehr_niedrig/worst). Clamped to [1, 4].
          INVERSE numeric vs 2018 thesis status_summe (same deprivation gradient).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: dynamik_index
        description: >
          Population-weighted mean of constituent PLR dynamik_index values, rounded to
          nearest ordinal (1=positiv/improving … 3=negativ/worsening). Clamped to [1, 3].
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: n_plr
        description: Number of constituent PLRs contributing to this rollup.
        data_tests:

          - not_null
      - name: typology_stage
        description: >
          Indicative coarsened typology — derived from floored mean-of-ordinals status/dynamik.
          NOT the official Senate BZR typology. For MAUP diagnostic use only; must not be fed
          into gentrification_index mart or published as per-area verdicts (B10 domain sign-off Condition 4).

  - name: int_ewr_demographics_wide
    description: >
      #243 (I19): pivots int_berlin_ewr_plr2021 (long format, ALL 13
      seed_ewr_indicator_meta indicators) to wide format, one row per
      (city_code, area_code, area_vintage, reference_year), PLR grain.
      Display-only re-pivot -- separate from int_ewr_socioeco (the R-C1
      gated index-input pivot of only 5+3 indicators) -- makes no change
      to any index weight/normalization. Feeds mart_area_demographics.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - reference_year
    columns:
      - name: city_code
        description: City identifier; always 'BER' (source is Berlin-only EWR).
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (LOR 2021 scheme, 8-digit).
        data_tests:

          - not_null
      - name: reference_year
        description: Calendar year of the 31-Dec EWR snapshot.
        data_tests:

          - not_null
      - name: residents_total
        description: Total registered residents per PLR (EWR indicator residents_total).
      - name: any_indicator_suppressed
        description: >
          TRUE if any pivoted indicator for this area/year was suppressed at
          source (propagated, not silently zeroed).
        data_tests:

          - not_null
