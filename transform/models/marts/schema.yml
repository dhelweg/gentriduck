version: 2

models:
  - name: gentrification_index
    description: >
      Governed gentrification index mart (ADR-0004). One row per
      (city_code, area_level, area_code, period_yyyymm, variant).
      This is the core output of the Gentriduck warehouse; its schema
      is governed by ADR-0004 and stable -- changes require a deliberate
      contract edit.

      Current state (Epic B baseline): sourced from the 2018 thesis goldens
      via int_thesis_2018_area_index. When Epic B3/C re-computes the index
      from fresh OSM/EWR inputs, the upstream intermediate model is updated
      and this mart rebuilds without schema changes.

      All class labels use English values (translated at the staging boundary).
      Label polarity note: status_class 'low' = low deprivation / wealthier area;
      dynamism_class 'negative' = high gentrification pressure. See B5-findings-check.md.

      Index definition reference: docs/adr/0004-data-governance-and-index-definition.md

      Berlin-only scope (#125): city_code accepted_values is ["BER"] -- Hamburg rows
      exist upstream in int_gentrification_ts (H1 #40, ADR-0014) but are explicitly
      filtered out of this published mart pending the gate decision described in the
      SQL header (H1 sign-offs scoped their PASS to pipeline wiring only).
    meta:
      dbt_meta_owner: data-engineer
      governed_definition: ADR-0004
    config:
      contract:
        enforced: true
    columns:
      - name: city_code
        description: City identifier (FK -> dim_city). ADR-0005 seam.
        data_type: varchar
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_code
      - name: area_level
        description: Area level identifier from the conformed taxonomy.
        data_type: varchar
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["bezirk", "bzr", "plr"]
      - name: area_code
        description: Area code. Part of the natural key.
        data_type: varchar
        data_tests:

          - not_null
      - name: area_name
        description: Area name (German proper noun; Berlin place names).
        data_type: varchar
        data_tests:

          - not_null
      - name: period_yyyymm
        description: Reporting period as string YYYYMM (e.g. '201612').
        data_type: varchar
        data_tests:

          - not_null
      - name: variant
        description: >
          Index variant. 'standard' uses non-distance-weighted POI features;
          'distance_weighted' uses POI inverse-distance weighting;
          'live_data' uses the C4 time-series pipeline (OSM + EWR, all years);
          'improved' (OA-B.3 #172; extended to lor_pre2021 by OA-ablation #261)
          carries the causality-first tier-weighted OA predictor
          (int_poi_status_dynamism_improved for Berlin lor_2021 rows,
          int_poi_status_dynamism_improved_pre2021 for Berlin lor_pre2021 rows)
          -- a separate, never-blended methodology_variant from 'live_data'
          (ADR-0017 D3/D4). Still Berlin-only; still NOT computed for Hamburg
          (seed_poi_offering_relevance is not validated for Hamburg's
          taxonomy).
        data_type: varchar
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["standard", "distance_weighted", "live_data", "improved"]
      - name: population
        description: Area population (Einwohner) at the reporting period.
        data_type: double
      - name: status_index
        description: >
          R-A1 update (#64): for live_data variant, now carries D1 MSS Social Status ordinal
          (cast to DOUBLE: 1.0=hoch/best … 4.0=sehr_niedrig/worst; NULL=uninhabited PLR).
          For thesis variants (standard/distance_weighted): z-score of POI-based status features
          (original 2018 definition unchanged).
          For 'improved' (OA-B.3 #172): status_score_improved, a z-score of the
          tier-weighted amenity-OA composite (NOT the MSS ordinal -- this
          variant swaps in the curated POI PREDICTOR, the D1 social-status
          OUTCOME is not recomputed here; see int_gentrification_ts /
          int_poi_status_dynamism_improved for the full construct). NOT
          comparable in scale to the live_data ordinal.
          POLARITY of live_data values: INVERSE numeric vs 2018 thesis status_summe; same
          deprivation gradient. Cross-variant comparison requires explicit D1 flip (index §5).
        data_type: double
      - name: status_class
        description: >
          R-A1 update (#64): for live_data variant, now carries the typology stage name from
          the D1×D2 MSS Status × Dynamik matrix (ADR-0008; index-definition.md §1.5).
          Values: 'stable-established', 'pre-gentrification', 'pioneer-signal',
          'active-gentrification', 'consolidation-pressure', 'improving-vulnerable'.
          NULL for uninhabited PLRs (is_uninhabited=true).
          For thesis variants: original projected status class (three values; unchanged).
          For 'improved' (OA-B.3 #172): always NULL -- this variant carries a
          continuous predictor score (status_index above), not an MSS-derived
          typology stage (no outcome recomputation here).
          PLR-level aggregate; not an individual/building-level statement (G-2 guardrail;
          ecological-inference disclaimer: index-definition.md §1.2).
        data_type: varchar
      - name: status_class_bi
        description: >
          Binary projected status class (high/medium/low English labels). For thesis variants:
          original projected status class (unchanged). For live_data (G4 #138): a deterministic
          4-class-to-3-bucket grouping of the D1 Status ordinal (1=hoch->high, 2=mittel->medium,
          3=niedrig & 4=sehr_niedrig->low; ADR-0008 D1 binding, index-definition-domain-draft.md
          D1xD2 stage table). NULL for uninhabited PLRs.
        data_type: varchar
        data_tests:

          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
              config:
                where: "status_class_bi is not null"
      - name: dynamism_index
        description: >
          R-A1 update (#64): for live_data variant, now carries D2 MSS Dynamik ordinal
          (cast to DOUBLE: 1.0=positiv/improving … 3.0=negativ/worsening; NULL=uninhabited PLR).
          For thesis variants (standard/distance_weighted): z-score of POI-based dynamism features.
          For 'improved' (OA-B.3 #172): dynamism_score_improved, a z-score of the
          tier-weighted amenity-OA composite's YoY share change (curated POI
          PREDICTOR only, not a recomputed D2 outcome). NOT comparable in scale
          to the live_data ordinal.
          D2 is already vulnerability-positive in numeric order (3=worsening=most vulnerable).
        data_type: double
      - name: dynamism_class
        description: >
          Projected dynamism class (three values; positive/neutral/negative).
          Polarity note: 'negative' = high gentrification pressure / above-average POI churn
          (thesis variants) or MSS Dynamik worsening (live_data). 'positive' = low gentrification
          pressure / below-average POI churn (thesis) or MSS Dynamik improving (live_data).
          For live_data (G4 #138): direct relabel of the D2 Dynamik ordinal
          (1=positiv->positive, 2=stabil->neutral, 3=negativ->negative; ADR-0008 D2 binding).
          See B5-findings-check.md for the thesis-variant explanation.
        data_type: varchar
      - name: dynamism_class_bi
        description: >
          Binary projected dynamism class (positive/neutral/negative English labels). For
          live_data (G4 #138): identical relabel of the D2 Dynamik ordinal as dynamism_class
          (no second MSS Dynamik projection exists to distinguish them, unlike the thesis
          variants' two distinct classification passes). NULL for uninhabited PLRs.
        data_type: varchar
        data_tests:

          - accepted_values:
              arguments:
                values: ["positive", "neutral", "negative"]
              config:
                where: "dynamism_class_bi is not null"
      - name: own_idx_class
        description: Own index class (3 buckets; socio-economic EWR-based index; positive/neutral/negative).
        data_type: varchar
      - name: own_idx_class_bi
        description: Binary own index class (positive/neutral/negative English labels).
        data_type: varchar
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
              - period_yyyymm
              - variant


  - name: fct_gentrification_change
    description: >
      C4 mart: per-PLR per-year gentrification change metrics.
      R-A1 update (#64): adds D1/D2 MSS outcome columns (status_index, dynamik_index,
      typology_stage) and ordinal status transition (status_index_prev, status_transition).

      Output grain: (city_code, area_code, area_vintage, snapshot_year).
      LAG computations are within (city_code, area_code, area_vintage) to avoid
      cross-vintage comparisons at the 2021 LOR boundary.
      Uninhabited PLRs (is_uninhabited=true) are retained; status/transition columns NULL.

      gentrification_score (legacy): the pre-R-A1 formula kept for 2018 baseline comparison.
      = (status_score + dynamism_score - ewr_composite) / 3.0. NOT for new analysis.
      Use status_index / dynamik_index / typology_stage for outcome analysis (R-A1; ADR-0008).

      C5 update (2026-06-19): dynamism_score is z-score of share_yoy_change (PLR POI share
      delta; C5 OSM completeness-bias correction). See docs/epic-c/C5-geo-signoff.md.

      Berlin-only scope (#125): explicitly filtered to city_code='BER' in the SQL
      (see model header) -- Hamburg rows exist upstream in int_gentrification_ts
      (H1 #40, ADR-0014) but are staged out of this mart pending the gate decision.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
              - snapshot_year
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER' (#125 staging filter; see model header).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: snapshot_year
        description: >
          MSS edition year (biennial: 2013, 2015, 2017, 2019, 2021, 2023, 2025).
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (8-digit, zero-padded).
        data_tests:

          - not_null
      - name: area_vintage
        description: LOR vintage ('lor_pre2021' or 'lor_2021').
        data_tests:

          - not_null
      - name: mss_edition
        description: MSS publication year (same as snapshot_year; retained for explicit tracking).
      - name: total_poi_count
        description: Total POI count for this PLR in this year (D3 density predictor).
      - name: share_yoy_change
        description: >
          C5 normalized: year-over-year change in PLR POI share (D3 dynamism face).
          NULL for first year of each vintage. Positive = PLR gained share relative to Berlin.
      - name: status_score
        description: >
          D3 predictor: z-score of total_poi_count (POI density face). NOT a social outcome.
      - name: dynamism_score
        description: >
          D3 predictor: C5-corrected z-score of share_yoy_change. Commercial succession signal.
          NOT a social outcome. C5 geo-DS sign-off: PASS (docs/epic-c/C5-geo-signoff.md).
      - name: ewr_composite
        description: D4 baseline covariate (mean of 5 EWR z-scores; higher = more vulnerable).
      - name: foreigners_share
        description: D4 component (foreigners share; vulnerability-positive baseline level).
      - name: migration_background_share
        description: D4 component (migration background share; vulnerability-positive; ≥2017 only).
      - name: mean_age_years
        description: D4 component (mean age; vulnerability-positive; negation removed PR #89).
      - name: residence_duration_5y_share
        description: D4 component (≤5yr tenure share; vulnerability-positive; Döring-Ulbricht 2016).
      - name: residents_total
        description: Total residents for population weighting (from EWR).
      - name: status_index
        description: >
          D1 outcome: MSS social status ordinal (1=hoch/best … 4=sehr_niedrig/worst).
          NULL = uninhabited PLR. INVERSE numeric vs 2018 thesis; same deprivation gradient.
          Treat as ORDINAL; never metric-average (R-A3 C2; index-definition.md §3).
      - name: dynamik_index
        description: >
          D2 outcome: MSS Dynamik (1=positiv/improving, 2=stabil, 3=negativ/worsening).
          NULL = uninhabited PLR. Already vulnerability-positive in numeric order.
      - name: typology_stage
        description: >
          Typology stage from D1×D2 matrix (ADR-0008; index-definition.md §1.5).
          NULL = uninhabited PLR. One of: 'stable-established', 'pre-gentrification',
          'pioneer-signal', 'active-gentrification', 'consolidation-pressure', 'improving-vulnerable'.
          PLR-level aggregate; not an individual/building-level statement (G-2 guardrail).
      - name: is_uninhabited
        description: True if PLR is uninhabited (gesamtindex IS NULL in MSS; §7.1).
      - name: gesamtindex
        description: MSS 12-group composite code. NULL = uninhabited PLR.
      - name: status_index_prev
        description: >
          D1 status_index at the prior MSS edition (LAG within area + vintage).
          NULL for the first edition in each vintage or uninhabited PLR.
          Used to compute status_transition.
      - name: status_transition
        description: >
          Ordinal status transition: 'improved' (status_index fell = less deprived),
          'stable' (unchanged), 'worsened' (status_index rose = more deprived).
          NULL for first edition in vintage or when either status_index is NULL.
          D1 POLARITY: lower numeric = higher status. 'improved' = status numerically decreased.
          Use ordered logit for regression (R-A3 C2; §3.2); never treat delta as metric.
        data_tests:

          - accepted_values:
              arguments:
                values: ["improved", "stable", "worsened"]
              config:
                where: "status_transition is not null"
      - name: gentrification_score
        description: >
          LEGACY formula alias (pre-R-A1): = (status_score + dynamism_score - ewr_composite) / 3.0.
          Kept for 2018 baseline comparison ONLY. NOT for new analysis.
          Use status_index / dynamik_index / typology_stage for outcome analysis (R-A1; ADR-0008).
      - name: gentrification_score_prev
        description: gentrification_score (legacy) from the prior edition. NULL for first edition.
      - name: gentrification_delta
        description: gentrification_score minus gentrification_score_prev (legacy; for 2018 comparison).
      - name: rank_current
        description: Rank of this PLR by legacy gentrification_score within city x year (1=highest).
      - name: rank_prev
        description: Legacy rank from the prior edition. NULL for first edition.
      - name: rank_change
        description: rank_prev minus rank_current (positive means improved rank; legacy metric).

  - name: fct_poi_development
    description: >
      C3-fact -- POI development fact table. Aggregates OSM POI counts per
      (city_code, snapshot_year, area_code, area_vintage, poi_domain_h, poi_category_h,
      poi_type_h) at PLR grain. Source: int_osm_poi_plr (C3 spatial join) and
      int_osm_poi_hamburg. Excludes rows where area_code IS NULL (POIs outside PLR
      boundaries). One row per unique combination of the seven grouping dimensions;
      poi_count is the count of POIs in that cell. Materialised as table (aggregation
      over spatial join result).

      OA-A.1 (#165, ADR-0017 D1): poi_domain_h and poi_type_h were added to the grain
      alongside the pre-existing poi_category_h -- a strictly additive re-plumb of
      columns int_osm_poi_plr / int_osm_poi_hamburg already carried but this model
      previously dropped. Not R-C1 methodology-bearing: poi_type_h functionally
      determines (poi_domain_h, poi_category_h) in seed_poi_mapping.csv (every
      harmonized type maps to exactly one domain/category pair), so grouping by all
      three together is the natural finest-grain aggregation, not a new
      indicator/weighting/normalization choice. Category-grain consumers
      (int_poi_features_pivot) remain correct: summing poi_count filtered by
      poi_category_h over the finer rows reproduces the pre-#165 category totals.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: city_code
        description: >
          Canonical city identifier (ADR-0005; matches dim_city.city_code). Berlin's
          legacy lowercase 'berlin' OSM-ingestion convention (#140) is normalised to
          'BER' at aggregation time in this model.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (8-digit, zero-padded). Never NULL (NULL rows excluded upstream).
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          Spatial-join vintage. 'lor_pre2021'/'lor_2021' for Berlin LOR; 'current'
          for Hamburg statistische Gebiete (single live-WFS edition, ADR-0014
          Pillar 1 — no historical vintage crosswalk yet).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
      - name: poi_domain_h
        description: >
          OA-A.1 #165: harmonized POI domain (top level of the 3-level taxonomy;
          ADR-0017 D1's domain-level OA term). COALESCE(canonical_poi_domain,
          poi_domain) from int_osm_poi_harmonized, carried through int_osm_poi_plr /
          int_osm_poi_hamburg. Values are drawn from seed_poi_mapping.domain (13
          distinct values); a small number of drift-canonical values from
          seed_poi_canonical_category may also appear (see int_osm_poi_harmonized) --
          the relationships test below is `severity: warn`, not `error`, for this
          reason.
        data_tests:

          - not_null
          - relationships:
              arguments:
                to: ref('seed_poi_mapping')
                field: domain
              config:
                severity: warn
      - name: poi_category_h
        description: Harmonized POI category (mid level of the 3-level taxonomy).
        data_tests:

          - not_null
      - name: poi_type_h
        description: >
          OA-A.1 #165: harmonized POI type (finest level of the 3-level taxonomy;
          ADR-0017 D1's type-level OA term). Values are drawn from
          seed_poi_mapping.type (163 distinct values); same drift-canonical caveat as
          poi_domain_h applies, hence `severity: warn`.
        data_tests:

          - not_null
          - relationships:
              arguments:
                to: ref('seed_poi_mapping')
                field: type
              config:
                severity: warn
      - name: poi_count
        description: >
          Count of POIs in this (city, year, area, vintage, domain, category, type)
          cell.
        data_tests:

          - not_null
      - name: source_attribution
        description: CC BY attribution string (ODbL -- OpenStreetMap contributors).
        data_tests:

          - not_null
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - poi_domain_h
              - poi_category_h
              - poi_type_h
          config:
            where: "area_code is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "poi_count > 0"


  - name: fct_gentrification_trajectory
    description: >
      R-A8 (#78): Longitudinal trajectory & stage model (2013–2025).
      Classifies each PLR's social-status trajectory across the full MSS time series
      (editions: 2013, 2015, 2017, 2019, 2021, 2023, 2025) into one of five trajectory
      types aligned with Dangschat's (1988) double invasion-succession cycle.

      Output grain: (city_code, area_code, area_vintage) — one trajectory summary per
      PLR per LOR vintage. Inhabited PLRs only (is_uninhabited=false).

      LOR vintage handling: trajectories are computed within EACH VINTAGE SEPARATELY
      to avoid cross-vintage boundary errors at the 2021 LOR reform.
        - lor_pre2021: editions 2013, 2015, 2017, 2019 (up to 4 observations)
        - lor_2021: editions 2021, 2023, 2025 (up to 3 observations)

      Trajectory types (Dangschat 1988; Döring & Ulbricht 2016):
        stable-established    — low deprivation throughout the panel
        persistently-deprived — high deprivation throughout the panel
        improving             — status_index decreased by ≥1 step (less deprived over time)
        declining             — status_index increased by ≥1 step (more deprived over time)
        mixed                 — no clear dominant trend or insufficient observations

      Method citation: Dangschat (1988) double invasion-succession cycle;
      thesis §3.2 (Gentrifizierung als Prozess); ADR-0008 (R-A7 #77) D1 outcome.

      Berlin-only scope (#125): explicitly filtered to city_code='BER' in the SQL
      (see model header) -- Hamburg rows exist upstream in int_gentrification_ts
      (H1 #40, ADR-0014) but are staged out of this mart pending the gate decision
      (Berlin-calibrated trajectory thresholds not yet reviewed against Hamburg's
      annual cadence).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_code
              - area_vintage
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER' (#125 staging filter; see model header).
        data_type: varchar
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: area_code
        description: PLR area code (LOR 2021 or pre-2021 vintage).
        data_type: varchar
        data_tests:

          - not_null
      - name: area_vintage
        description: LOR vintage identifier ('lor_pre2021' or 'lor_2021').
        data_type: varchar
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]
      - name: n_editions
        description: Number of MSS editions available for this PLR within this vintage.
        data_type: bigint
        data_tests:

          - not_null
      - name: first_edition
        description: First MSS edition year in this PLR's trajectory (within vintage).
        data_type: bigint
      - name: last_edition
        description: Last MSS edition year in this PLR's trajectory (within vintage).
        data_type: bigint
      - name: status_index_first
        description: D1 status_index at the first edition within this vintage.
        data_type: double
      - name: status_index_last
        description: D1 status_index at the last edition within this vintage.
        data_type: double
      - name: status_index_min
        description: Minimum D1 status_index across editions (best status = 1).
        data_type: double
      - name: status_index_max
        description: Maximum D1 status_index across editions (worst status = 4).
        data_type: double
      - name: status_index_mean
        description: Mean D1 status_index across editions (vulnerability-positive; higher = more deprived).
        data_type: double
      - name: status_delta
        description: >
          Change in D1 status_index from first to last edition within this vintage.
          Positive = worsened (more deprived); negative = improved (less deprived).
          Zero = stable across the panel. Only meaningful if n_editions > 1.
        data_type: double
      - name: status_range
        description: Within-panel range of status_index (max - min). Measures trajectory volatility.
        data_type: double
      - name: trajectory_type
        description: >
          Trajectory classification (R-A8; Dangschat 1988 framework).
          'stable-established'    — low deprivation throughout
          'persistently-deprived' — high deprivation throughout
          'improving'             — materially less deprived over time
          'declining'             — materially more deprived over time
          'mixed'                 — no clear dominant trend or < 2 editions
        data_type: varchar
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values:
                  - stable-established
                  - persistently-deprived
                  - improving
                  - declining
                  - mixed
      - name: dominant_stage
        description: Most frequent typology_stage (D1×D2 matrix) across editions within this vintage.
        data_type: varchar
      - name: n_editions_improving_stage
        description: Count of editions where the typology_stage is an improving-type stage.
        data_type: bigint
      - name: n_editions_sehr_niedrig
        description: Count of editions where status_index = 4 (sehr_niedrig = most deprived).
        data_type: bigint
      - name: n_editions_hoch
        description: Count of editions where status_index = 1 (hoch = least deprived).
        data_type: bigint
      - name: trajectory_confidence
        description: >
          Confidence level for the trajectory classification.
          'high'   — n_editions >= 3 and non-mixed trajectory
          'medium' — n_editions == 2 and non-mixed trajectory
          'low'    — mixed trajectory type or n_editions <= 1
        data_type: varchar
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: is_persistently_vulnerable
        description: >
          True if the mean D1 status_index across editions >= 3.0 (predominantly
          niedrig or sehr_niedrig deprivation levels throughout the panel).
          Useful for cross-validation against R-B2 hotspot labels.
        data_type: boolean
        data_tests:

          - not_null
      - name: is_persistently_affluent
        description: >
          True if the mean D1 status_index across editions <= 1.5 (predominantly
          hoch deprivation level throughout the panel).
          Useful for cross-validation against R-B2 coldspot labels.
        data_type: boolean
        data_tests:

          - not_null

  - name: mart_price_rent_dimension
    description: >
      D3 (#29): Price/rent dimension mart — structural LEVEL context for each PLR
      per vintage year. Combines three signals:
        (1) BRW area-weighted land value (from int_berlin_brw_plr)
        (2) Wohnlage tier composition (from int_berlin_wohnlage_plr, pivoted)
        (3) Modelled Mietspiegel rent estimate (Wohnlage-composition-weighted over a
            fixed reference dwelling profile: 60–90 m², 1950–1964 construction year)

      STRUCTURAL LEVEL, NOT DYNAMIC SIGNAL (geo condition 14, domain D2, ADR-0008):
      All signals here are BASELINE/CONTEXT COVARIATES (D4-levels pattern,
      index-definition §4.6). They must NOT be blended into the MSS Status×Dynamik
      typology — that would reproduce the ADR-0008 legacy-averaging error.

      BRW polarity (ambiguous, domain D2): high land value = price-surface / consolidation
      CONTEXT COVARIATE — ambiguous between historic wealth, completed gentrification, and
      active pressure. Sign-flip required if pooled into vulnerability composite.
      DISPLACEMENT-RISK language attaches only to BRW CHANGE (brw_trend), not the level.

      Wohnlage polarity (domain D3): high pct_einfach = vulnerability/headroom PRECONDITION.
      High wohnlage_score = desirable = consolidated = LOW residual headroom; sign-flip for
      vulnerability composite. The Aufwertung OUTCOME is declining einfach share over vintages
      (built separately as a change indicator).

      Modelled rent (domain D6, D7): "modelled/estimated net cold rent at a fixed reference
      dwelling profile — NOT observed rent paid." Bestandsmiete/ortsübliche Vergleichsmiete
      (Holm 2010); lagging, conservative; understates leading-edge displacement pressure.

      Normalization: winsorized (1%/99%) z-scores per (city_code, snapshot_year) over
      non-NULL, non-low-n PLRs. Rank/percentile of BRW value added (rank is the headline
      for heavy-tailed land values; z-score secondary). OECD/JRC (2008) common polarity.

      Ecological fallacy guardrail (domain D10, G-2): PLR-LEVEL aggregates only.
      BRW is coarser than PLR (1,621 zones, area-interpolated) — NOT parcel precision.
      Inferring an individual's rent/land-value/displacement from a PLR value is fallacious.

      Milieuschutz/counter-misuse framing (domain D12): frame toward identifying quarters
      that may warrant displacement protection (Holm 2010, Bernt 2016). NOT an investment
      surface. Low land value + vulnerable population = flag for PROTECTION, not invitation.

      R-C2 citations: Smith (1979) rent gap; Blasius & Dangschat (1990) Aufwertung;
      Holm (2010) / Bernt (2016) Milieuschutz; Openshaw (1984) MAUP; OECD/JRC (2008).
      Sign-offs: docs/epic-d/d3-price-rent-geo-signoff.md,
                 docs/epic-d/d3-price-rent-domain-signoff.md.

      Graceful degradation: returns zero rows when intermediate models return zero rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). Always 'BER' — normalised by int_berlin_brw_plr and
          int_berlin_wohnlage_plr (staging layers emit 'berlin'; normalised for dim_city FK).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER"]
              config:
                where: "area_code is not null"
      - name: snapshot_year
        description: >
          Price/rent dimension vintage year (integer).
          For BRW-only rows: derived from YEAR(brw.reference_date), 2017–2024.
          For Wohnlage-only rows (e.g. 2026): Wohnlage WFS edition year.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded). LOR 2021 scheme for BRW; vintage-specific for Wohnlage.
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          LOR boundary vintage. 'lor_2021' for BRW rows (always lor_2021 in int_berlin_brw_plr).
          'lor_pre2021' or 'lor_2021' for Wohnlage rows (vintage-specific join).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]
              config:
                where: "area_code is not null"
      - name: brw_weighted_avg_eur_m2
        description: >
          Area-weighted mean Bodenrichtwert (EUR/m²) for residential BRW zones overlapping
          this PLR. NULL for non-residential/uninhabited PLRs (pure park/water/airport).
          POLARITY: ambiguous context covariate (domain D2). High = price-surface/consolidation.
          Sign-flip required for vulnerability composite. NOT a vulnerability score.
          BRW LEVEL ≠ rent gap (Smith 1979) — the rent gap is a difference, not a level (domain D1).
      - name: n_brw_zones
        description: Count of distinct residential BRW zones contributing to brw_weighted_avg_eur_m2.
      - name: brw_residential_coverage_frac
        description: >
          Fraction of the PLR area covered by residential BRW zones (0–1).
          NULL when no W% BRW zones overlap this PLR. Use to identify thin-signal PLRs.
      - name: pct_einfach
        description: >
          Share of Wohnlage-classified addresses in the 'einfach' (simple/basic) tier for
          this PLR-vintage. 0.0 if this tier is absent; NULL if no Wohnlage data available.
          POLARITY: vulnerability-positive (high pct_einfach = more upgrading headroom;
          inner-city precondition for gentrification per Blasius & Dangschat 1990; domain D3).
      - name: pct_mittel
        description: Share of addresses in the 'mittel' (medium) Wohnlage tier. 0.0 if absent.
      - name: pct_gut
        description: Share of addresses in the 'gut' (good/desirable) Wohnlage tier. 0.0 if absent.
      - name: wohnlage_n_addresses
        description: Total count of Wohnlage-classified address points in this PLR-vintage across all tiers.
      - name: wohnlage_low_n
        description: >
          TRUE when this PLR-vintage has fewer than 10 total Wohnlage address points.
          When TRUE: wohnlage_score, est_rent_mid/low/high, wohnlage_zscore, est_rent_zscore
          are all NULL (unstable composition; geo condition 7).
      - name: wohnlage_score
        description: >
          Ordinal-mean approximation of Wohnlage quality per PLR:
          pct_einfach * 1 + pct_mittel * 2 + pct_gut * 3.
          Range: [1.0, 3.0]. LABELLED AS ORDINAL-MEAN APPROXIMATION — the three tiers are
          ordered but not equidistant; do not treat as interval-scaled in regression without noting.
          NULL when wohnlage_low_n = TRUE.
          POLARITY: high score = more desirable = consolidated = LOW residual headroom.
          Sign-flip required for vulnerability composite (for vulnerability framing, use pct_einfach).
      - name: est_rent_mid
        description: >
          Modelled/estimated net cold rent (EUR/m²/month) at the fixed reference dwelling profile:
          size = 60–90 m², construction year = 1950–1964, standard equipment (mit SH/Bad/IWC).
          Formula: pct_einfach * ms_einfach_mid + pct_mittel * ms_mittel_mid + pct_gut * ms_gut_mid
          using the Mietspiegel rent_mid values for the nearest-<= vintage.
          "modelled/estimated net cold rent at a fixed reference dwelling profile — NOT observed
           rent paid." (domain D6; Mietspiegel ortsübliche Vergleichsmiete; Holm 2010.)
          Bestandsmiete/lagging bias: conservative, understates leading-edge rent pressure (domain D7).
          NULL when wohnlage_low_n = TRUE (geo condition 7).
          POLARITY: affordability-negative (high = less affordable; Bestandsmiete-lagging).
      - name: est_rent_low
        description: >
          Composition-weighted lower bound (3/4-Spanne) of Mietspiegel reference rent.
          Same formula and fixed profile as est_rent_mid, using rent_low.
          NULL when wohnlage_low_n = TRUE.
      - name: est_rent_high
        description: >
          Composition-weighted upper bound (3/4-Spanne) of Mietspiegel reference rent.
          Same formula and fixed profile as est_rent_mid, using rent_high.
          NULL when wohnlage_low_n = TRUE.
      - name: mietspiegel_vintage_used
        description: >
          Mietspiegel edition year used for the modelled rent estimate.
          Nearest-<= match to the Wohnlage vintage year (geo condition 8).
          Approximation disclosure (domain D13): 2026 Wohnlage uses 2026 Mietspiegel
          (stands in for the 2025 MSS panel edition; disclose on G2).
      - name: wohnlage_vintage_matched
        description: >
          The Wohnlage vintage year that was joined to this BRW snapshot_year.
          Nearest-<= Wohnlage vintage for the BRW year. NULL for BRW years before the
          first available Wohnlage vintage. Same as snapshot_year for Wohnlage-only rows.
      - name: brw_zscore
        description: >
          Winsorized (1%/99%) z-score of brw_weighted_avg_eur_m2 per (city_code, snapshot_year),
          computed over non-NULL, non-low-n PLRs only.
          POLARITY: ambiguous (see brw_weighted_avg_eur_m2). Sign-flip if pooled into vulnerability.
          NULL when brw_weighted_avg_eur_m2 is NULL or normalization moments unavailable.
          (geo condition 13; OECD/JRC 2008)
      - name: wohnlage_zscore
        description: >
          Winsorized (1%/99%) z-score of wohnlage_score per (city_code, snapshot_year),
          computed over non-NULL, non-low-n PLRs only.
          POLARITY: high = desirable = consolidated = LOW vulnerability headroom.
          Sign-flip required for vulnerability composite; use pct_einfach for vuln framing.
          NULL when wohnlage_score is NULL or normalization moments unavailable.
          (geo condition 13; OECD/JRC 2008)
      - name: est_rent_zscore
        description: >
          Winsorized (1%/99%) z-score of est_rent_mid per (city_code, snapshot_year),
          computed over non-NULL, non-low-n PLRs only.
          POLARITY: affordability-negative (high = less affordable = more pressure).
          NULL when est_rent_mid is NULL or normalization moments unavailable.
          (geo condition 13; OECD/JRC 2008)
      - name: brw_rank
        description: >
          Rank of this PLR by brw_weighted_avg_eur_m2 within (city_code, snapshot_year),
          ascending (1 = lowest land value; higher rank = higher land value).
          NULL PLRs sorted last. Headline display metric for heavy-tailed land values (G2 page)
          because rank is outlier-insensitive (a few super-prime PLRs skew the z-score).
          (geo condition 13)
      - name: brw_percentile
        description: >
          PERCENT_RANK of brw_weighted_avg_eur_m2 within (city_code, snapshot_year),
          ascending. Range [0, 1]; 0 = lowest, 1 = highest land value.
          NULL PLRs sorted last.
          (geo condition 13)

  - name: mart_price_rent_dimension_pre2021
    description: >
      D1d-followup (#136): re-keys mart_price_rent_dimension's intensive covariates from
      the lor_2021 PLR scheme onto lor_pre2021 area codes, using seed_lor_crosswalk_
      2006_to_2021's existing forward `weight` column (which already sums to 1.0 per
      plr_id_pre2021 -- the correct areal-weighted-average operator for this direction;
      no new spatial derivation needed, see model header). Joinable to the governed
      gentrification_index / area-detail page (lor_pre2021, period 201612).

      NULL-aware weighted average (index-definition §7): numerator/denominator both
      restricted to 2021 PLRs where the covariate is non-NULL, so partially
      non-residential/low-n footprints discount rather than zero-fill the estimate.
      *_coverage_frac reports the retained weight mass (0-1); low coverage flags a
      thin/uncertain re-keyed estimate.

      SCOPE: covariate LEVELS only (BRW, Wohnlage composition/score, modelled rent).
      Winsorized z-scores/ranks are NOT recomputed at this grain (out of scope; see
      model header). Same polarity/framing caveats as mart_price_rent_dimension apply
      (structural LEVEL, not dynamic signal; ecological fallacy guardrail; Milieuschutz
      counter-misuse framing) -- this mart is a re-projection, not a new signal.

      Sign-off: docs/epic-d/D1d-followup-geo-signoff.md (Verdict: PASS).
      Graceful degradation: zero rows when mart_price_rent_dimension or the crosswalk
      seed return zero rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Always 'BER'.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: snapshot_year
        description: Price/rent dimension vintage year (integer), carried through from mart_price_rent_dimension.
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (8-digit, zero-padded) in the lor_pre2021 scheme.
        data_tests:

          - not_null
      - name: area_vintage
        description: Always 'lor_pre2021' -- the re-keyed output grain.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021"]
      - name: brw_weighted_avg_eur_m2
        description: >
          NULL-aware weighted average of mart_price_rent_dimension.brw_weighted_avg_eur_m2
          across contributing lor_2021 PLRs, using the crosswalk `weight` column.
          Same polarity caveat as the source mart (ambiguous context covariate; sign-flip
          for vulnerability composites).
      - name: brw_coverage_frac
        description: >
          Fraction of this pre2021 PLR's crosswalk weight mass for which a non-NULL
          brw_weighted_avg_eur_m2 was available (0-1). Low values flag a thin re-keyed
          estimate (footprint mostly on non-residential lor_2021 PLRs).
      - name: pct_einfach
        description: NULL-aware weighted average of pct_einfach across contributing lor_2021 PLRs.
      - name: pct_mittel
        description: NULL-aware weighted average of pct_mittel across contributing lor_2021 PLRs.
      - name: pct_gut
        description: NULL-aware weighted average of pct_gut across contributing lor_2021 PLRs.
      - name: wohnlage_n_addresses_apportioned
        description: >
          Weight-apportioned Wohnlage address count (extensive-style apportionment:
          SUM(weight * total_n_addresses)). Used only to derive wohnlage_low_n at this grain.
      - name: wohnlage_low_n
        description: >
          TRUE when the weight-apportioned address count is below 10, or every
          contributing lor_2021 PLR was itself low_n. Mirrors mart_price_rent_dimension
          geo condition 7 at the re-keyed grain.
      - name: wohnlage_score
        description: >
          NULL-aware weighted average of wohnlage_score across contributing lor_2021
          PLRs. Same ordinal-mean-approximation caveat as the source mart.
      - name: wohnlage_coverage_frac
        description: Fraction of crosswalk weight mass for which a non-NULL wohnlage_score was available (0-1).
      - name: est_rent_mid
        description: >
          NULL-aware weighted average of mart_price_rent_dimension.est_rent_mid across
          contributing lor_2021 PLRs. Same modelled/estimated-rent caveats as the source mart.
      - name: est_rent_low
        description: NULL-aware weighted average of est_rent_low across contributing lor_2021 PLRs.
      - name: est_rent_high
        description: NULL-aware weighted average of est_rent_high across contributing lor_2021 PLRs.
      - name: est_rent_coverage_frac
        description: Fraction of crosswalk weight mass for which a non-NULL est_rent_mid was available (0-1).
      - name: mietspiegel_vintage_used
        description: Mietspiegel edition year used, carried through (MAX across contributing lor_2021 PLRs; typically uniform per snapshot_year).
      - name: wohnlage_vintage_matched
        description: Wohnlage vintage matched, carried through (MAX across contributing lor_2021 PLRs; typically uniform per snapshot_year).

  - name: dim_area_geometry
    description: >
      G1c (#132) prep: area polygon geometries for the conformed area dimension
      (ADR-0005), reprojected to WGS84 GeoJSON for client-side web mapping.
      PLUMBING model -- exposes staging-layer WKB geometry (previously not
      reachable from the marts layer that F2/#34 exports to parquet) in a
      web-consumable projection. No new spatial method or aggregation;
      not on the R-C1 methodology-bearing model list.

      Grain: one row per (city_code, area_level, area_code, area_vintage).
      Sources: stg_berlin_lor (plr), stg_berlin_lor_bzr (bzr), stg_berlin_lor_pgr
      (pgr, added #242 I18), stg_hamburg_geo (district/subarea_l1/subarea_l2),
      stg_berlin_ortsteil (ortsteil, added #269 I-ortsteile, area_vintage='current'),
      berlin_bezirk (bezirk, added OA-D6 #240 -- DERIVED via ST_Union dissolve
      of stg_berlin_lor's own PLR polygons, not a new WFS source; area_name is
      NULL for these rows, no Bezirk-name seed/source exists yet).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
              - area_vintage
    columns:
      - name: city_code
        description: City identifier (FK -> dim_city). ADR-0005 seam.
        data_type: varchar
        data_tests:

          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_code
      - name: area_level
        description: Area level identifier from the conformed taxonomy.
        data_type: varchar
        data_tests:

          - not_null
      - name: area_code
        description: Area code. Part of the natural key.
        data_type: varchar
        data_tests:

          - not_null
      - name: area_name
        description: Area name (WFS UTF-8 source; see dim_area's dedup pattern).
        data_type: varchar
      - name: area_vintage
        description: >
          Geometry vintage discriminator (e.g. 'lor_pre2021', 'lor_2021',
          'current' for Hamburg). Kept ungrouped -- consumers pick the
          vintage matching the period they display.
        data_type: varchar
        data_tests:

          - not_null
      - name: geometry_geojson
        description: >
          GeoJSON `geometry` object (not a full Feature) in WGS84 (EPSG:4326),
          reprojected from the native CRS per dim_city.native_crs_epsg via
          ST_Transform(..., always_xy := true), mirroring int_osm_poi_plr's
          native-CRS<->WGS84 convention. Text (JSON-encoded), not parsed.
        data_type: varchar

  - name: mart_poi_offering_advantage
    description: >
      #208 (split from #207, maintainer-requested): surfaces the already-computed,
      already-signed-off POI Offering Advantage (OA) location-quotient values
      (int_poi_offering_advantage, ADR-0017/0018) plus per-area POI density through
      a mart, so the site can query them (Evidence pages bundle gentriduck_marts.*
      only). Not methodology-bearing -- pure pass-through/join, no new
      indicator/weight/normalization.

      Grain: one row per (city_code, snapshot_year, area_code, area_vintage,
      weight_variant, methodology_variant, poi_domain_h, poi_category_h,
      poi_type_h) -- identical to int_poi_offering_advantage's own grain.
      poi_count / poi_density_per_km2 are joined in from fct_poi_development at
      the same taxonomy leaf; area_km2 from ST_Area in each city's native
      (metres-based) CRS.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - poi_domain_h
              - poi_category_h
              - poi_type_h
              - weight_variant
              - methodology_variant
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). #281: canonicalized at this mart's own
          `oa` CTE (QA-4 legacy-lowercase normalisation) -- output is
          canonical-only.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (Berlin) / subarea_l2 code (Hamburg). Vintage-specific.
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          Spatial-join vintage. 'lor_pre2021'/'lor_2021' for Berlin LOR; 'current'
          for Hamburg statistische Gebiete.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
      - name: weight_variant
        description: >
          'standard' (hard point-in-polygon count) or 'gaussian_<bandwidth>'
          (mass-conserving kernel-weighted count). See int_poi_offering_advantage
          for the C-1 mass-conservation invariance this depends on.
        data_tests:

          - not_null
      - name: methodology_variant
        description: >
          'faithful' (Run 1, thesis-fidelity, all types, no curation; ADR-0017 D3).
          The causal-tier curated 'improved' variant (OA-B.1..B.4, #170-173) will
          append rows here without a grain migration once built.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["faithful", "improved"]
      - name: poi_domain_h
        description: Harmonized POI domain (top level of the 3-level taxonomy).
        data_tests:

          - not_null
      - name: poi_category_h
        description: Harmonized POI category (mid level of the 3-level taxonomy).
        data_tests:

          - not_null
      - name: poi_type_h
        description: Harmonized POI type (finest level of the 3-level taxonomy).
        data_tests:

          - not_null
      - name: oa_domain
        description: >
          Domain-level Offering Advantage (location quotient). 1.0 = represented
          at the city-wide compositional rate; >1 over-represented; <1
          under-represented. See int_poi_offering_advantage for the formula and
          the D-1/D-2 interpretation guardrails (descriptive, not causal;
          multi-signed bundle -- never sum across domains).
      - name: oa_category
        description: Category-level Offering Advantage, parent-relative to its domain.
      - name: oa_type
        description: Type-level Offering Advantage, parent-relative to its domain.
      - name: oa_domain_min_base_flag
        description: >
          #274 (ADR-0017 D5 D-3 discharge): true when this PLR-year's total
          POI count across every domain is below the minimum-POI-base
          threshold (`oa_min_poi_base_n` dbt var, default 10) -- flags
          thinly-mapped PLR-years where the compositional LQ is unstable. See
          int_poi_offering_advantage for the full derivation.
        data_tests:

          - not_null
      - name: oa_category_min_base_flag
        description: >
          #274 (ADR-0017 D5 D-3 discharge): true when this row's parent
          domain's own local POI total within the PLR is below
          `oa_min_poi_base_n` -- oa_category's actual denominator.
        data_tests:

          - not_null
      - name: oa_type_min_base_flag
        description: >
          #274 (ADR-0017 D5 D-3 discharge): true when this row's parent
          domain's own local POI total within the PLR is below
          `oa_min_poi_base_n` -- oa_type's actual denominator too (type nests
          under domain, not category; ADR-0017 D1).
        data_tests:

          - not_null
      - name: poi_count
        description: >
          Count of POIs in this (city, year, area, vintage, domain, category,
          type) cell, from fct_poi_development (unweighted hard count). NULL
          for a small share (~5%) of 'gaussian_*' weight_variant rows: the
          Gaussian kernel can spread weighted mass into a PLR/leaf with zero
          hard-count POIs of that exact type (kernel smoothing crosses PLR
          boundaries; fct_poi_development is point-in-polygon only), so that
          leaf has no fct_poi_development row to join. area_km2 is unaffected
          (area-keyed, not leaf-keyed).
      - name: area_km2
        description: >
          Area of the (city_code, area_code, area_vintage) polygon in km^2,
          computed via ST_Area in the city's native (metres-based) CRS
          (dim_city.native_crs_epsg) before any WGS84 reprojection.
      - name: poi_density_per_km2
        description: >
          poi_count / area_km2 for this taxonomy leaf (e.g. "Gastronomy POIs per
          km2"). NULL when area_km2 is NULL or zero.
  - name: mart_poi_offering_advantage_map
    description: >
      #210 (perf follow-up to #208/#209): slim, domain-grain companion to
      mart_poi_offering_advantage built for the /poi-map page's reactive
      query -- Evidence.dev ships the full referenced source table to the
      client for any reactive query, so shipping leaf-grain rows to answer a
      domain-grain question was the actual driver of that page's ~14MB
      bundle. Pure re-aggregation of an already-signed-off mart (SUM of an
      unweighted count + a location quotient proven constant within a
      domain) -- not methodology-bearing, not on the R-C1 gated-file list.

      Grain: one row per (city_code, snapshot_year, area_code, area_vintage,
      weight_variant, methodology_variant, poi_domain_h) -- a
      (poi_category_h, poi_type_h)-collapsed subset of
      mart_poi_offering_advantage's grain.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - poi_domain_h
              - weight_variant
              - methodology_variant
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005).
        data_tests:

          - not_null
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (Berlin) / subarea_l2 code (Hamburg). Vintage-specific.
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          Spatial-join vintage. 'lor_pre2021'/'lor_2021' for Berlin LOR; 'current'
          for Hamburg statistische Gebiete.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
      - name: weight_variant
        description: >
          'standard' (hard point-in-polygon count) or 'gaussian_<bandwidth>'
          (mass-conserving kernel-weighted count).
        data_tests:

          - not_null
      - name: methodology_variant
        description: "'faithful' or 'improved' (see mart_poi_offering_advantage)."
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["faithful", "improved"]
      - name: poi_domain_h
        description: Harmonized POI domain (top level of the 3-level taxonomy).
        data_tests:

          - not_null
      - name: oa_domain
        description: >
          Domain-level Offering Advantage (location quotient), carried through
          unchanged from mart_poi_offering_advantage (constant within this
          group by construction -- see model header).
      - name: oa_domain_min_base_flag
        description: >
          #274 (ADR-0017 D5 D-3 discharge): true when this PLR-year's total
          POI count across every domain is below the minimum-POI-base
          threshold (`oa_min_poi_base_n` dbt var, default 10) -- a
          PLR-year-level "thinly-mapped" property, constant across every
          domain of the same PLR-year (see model header). The /berlin/poi-map
          page suppresses oa_domain to NULL on this flag before display.
        data_tests:

          - not_null
      - name: poi_count
        description: >
          SUM(poi_count) across this domain's (poi_category_h, poi_type_h)
          leaves -- the domain-level POI count, from mart_poi_offering_advantage.
      - name: area_km2
        description: >
          Area of the (city_code, area_code, area_vintage) polygon in km^2,
          carried through unchanged (area-keyed, not leaf-keyed, so identical
          across leaves being collapsed).
      - name: poi_density_per_km2
        description: >
          SUM(poi_count) / area_km2 for this domain (e.g. "all Gastronomy
          POIs per km2") -- recomputed at domain grain, not an average of
          leaf-level densities. NULL when area_km2 is NULL or zero.

  - name: mart_area_demographics
    description: >
      #243 (I19): display mart of EWR descriptive indicators (Einwohner, age
      structure, composition, residence duration) at PLR grain and rolled up
      to BZR/PGR/Bezirk (I18 geo-hierarchy levels). Display-only -- no index
      weight/normalization change; foreigners_share/migration_background_share
      framing gated by domain-expert sign-off (I19-domain-signoff.md, PASS).
      Rollup rule (extensive=sum, intensive=summed-numerator recompute)
      geo-DS approved (I19-geo-signoff.md, PASS), reusing int_mss_bzr_aggregate's
      precedent. Berlin only; Hamburg parity deferred to after H3 (#237).

      #269 (I-ortsteile): extended with an 'ortsteil' level. Same rollup rule;
      constituent-PLR membership comes from the DOMINANT PLR->Ortsteil
      area-overlap crosswalk (int_berlin_plr_ortsteil_overlap.sql,
      is_dominant_ortsteil), not a code-prefix substr() -- Ortsteil does not
      nest into PLR (see dim_area_hierarchy.sql). 'ortsteil' rows are always
      area_vintage='lor_2021' (the crosswalk's scope).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
              - area_vintage
              - reference_year
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Currently 'BER' only.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: area_level
        description: Geo-hierarchy level (I18/I-ortsteile) -- plr, bzr, pgr, bezirk, or ortsteil.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["plr", "bzr", "pgr", "bezirk", "ortsteil"]
      - name: area_code
        description: LOR area code at this level's own grain (8/6/4/2-digit).
        data_tests:

          - not_null
      - name: reference_year
        description: Calendar year of the 31-Dec EWR snapshot.
        data_tests:

          - not_null
      - name: residents_total
        description: >
          Total registered residents. PLR: EWR indicator value. Rolled-up
          levels: SUM of constituent PLR values (extensive indicator).
      - name: foreigners_share
        description: >
          Share of foreign nationals. Rolled-up levels: recomputed from
          summed numerators (population-weighted), never averaged.
          Small-area-grain publication framing gated by domain-expert
          sign-off (I19-domain-signoff.md).
      - name: migration_background_share
        description: >
          Share of residents with migration background. Same rollup rule and
          domain-expert framing gate as foreigners_share. Methodologically
          stable only from 2017 (Mikrozensus reform, cf. int_ewr_socioeco).
      - name: n_plr
        description: Number of constituent PLRs contributing to this row (1 for area_level='plr').
        data_tests:

          - not_null
      - name: any_indicator_suppressed
        description: >
          TRUE if this area/year (or, for rollups, any constituent PLR) had a
          suppressed source cell -- degrade gracefully, don't silently zero.
        data_tests:

          - not_null

  - name: mart_area_amenities
    description: >
      #252 (I20 slice 1): display-only mart of everyday-infrastructure counts
      (schools, kindergartens, doctors, dentists, pharmacies, supermarkets,
      playgrounds, transit stops) and a dominant-gastro-cuisine breakdown, at
      PLR grain and rolled up to BZR/PGR/Bezirk (I18 geo-hierarchy levels).
      Not on the R-C1 gated-file list -- reads int_osm_poi_plr read-only, no
      index weight/normalization change. "Interestingness" thresholds (n >=
      floor before showing a dominant cuisine) and bench-class category
      suppression are a web/curation-layer concern (I20 slice 2/3, #253/#254),
      not modeled here. Berlin only; Hamburg parity deferred, same as I19.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
              - area_vintage
              - snapshot_year
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005), normalized via canonical_city_code()
          from int_osm_poi_plr's legacy lowercase 'berlin'. Currently 'BER' only.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: area_level
        description: Geo-hierarchy level (I18) -- plr, bzr, pgr, or bezirk.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["plr", "bzr", "pgr", "bezirk"]
      - name: area_code
        description: LOR area code at this level's own grain (8/6/4/2-digit).
        data_tests:

          - not_null
      - name: snapshot_year
        description: OSM snapshot year (matches int_osm_poi_plr's snapshot_year).
        data_tests:

          - not_null
      - name: gastro_poi_count
        description: Total Gastronomy-domain POIs (restaurants/cafes/fast food) in this area/year.
      - name: gastro_poi_with_cuisine_count
        description: >
          Subset of gastro_poi_count that also carry an OSM `cuisine` tag.
          Denominator for dominant_cuisine_share. Only non-zero for snapshot
          years re-extracted after I20 (#252) added cuisine capture -- older
          years correctly show 0/NULL here, not a fabricated value.
      - name: dominant_cuisine
        description: >
          Most common raw OSM `cuisine` value among this area/year's gastro
          POIs that carry the tag. NULL if gastro_poi_with_cuisine_count = 0.
          Curation-rules threshold (I20 slice 2, #253) decides whether the web
          layer actually displays this for a given n.
      - name: dominant_cuisine_share
        description: >
          dominant_cuisine_count / gastro_poi_with_cuisine_count. NULL-safe
          (nullif denominator).

  - name: mart_mss_area_aggregate
    description: >
      #249 (I18-web-b): thin display mart exposing int_mss_bzr_aggregate (B10,
      #120) at BZR/Bezirk grain to the web layer. Pure pass-through/rename --
      no new aggregation formula (already geo-DS approved under B10, #120).
      This ticket's own geo-DS pass (I249-web-b-geo-signoff.md) covers DISPLAY
      fitness (confidence framing, boundary-mismatch caveat) of publishing this
      classification on public profile pages, not the formula itself. Domain-
      expert sign-off (I249-web-b-domain-signoff.md) covers lay-reader wording
      of an approximated status/Dynamik figure at this grain. Berlin only.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_level
              - area_code
              - area_vintage
              - reference_year
    columns:
      - name: city_code
        description: City identifier (ADR-0005). Currently 'BER' only.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: area_level
        description: Geo-hierarchy level -- bzr or bezirk (this mart never carries plr rows).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["bzr", "bezirk"]
      - name: area_code
        description: LOR area code at this level's own grain (6-digit BZR / 2-digit Bezirk).
        data_tests:

          - not_null
      - name: reference_year
        description: Snapshot year this MSS/EWR/POI rollup represents (renamed from snapshot_year).
        data_tests:

          - not_null
      - name: status_index
        description: >
          Population-weighted-mean-of-ordinals approximation of MSS status
          index (1-4) at BZR/Bezirk grain. DIFFERS from the Senate's own
          re-z-score-then-reclassify method -- see int_mss_bzr_aggregate.sql
          header and I249-web-b-geo-signoff.md for the confidence framing this
          caveat requires wherever this column is rendered.
      - name: dynamik_index
        description: >
          Population-weighted-mean-of-ordinals approximation of MSS Dynamik
          index (1-3) at BZR/Bezirk grain. Same approximation caveat as
          status_index.
      - name: typology_stage
        description: >
          Indicative D1xD2 typology stage derived from the aggregated
          status_index/dynamik_index. NOT the official Senate BZR typology --
          MAUP diagnostic / directional display only.
      - name: n_plr
        description: Number of constituent PLRs contributing to this row.
        data_tests:

          - not_null

  - name: mart_ortsteil_plr_crosswalk
    description: >
      #269 (I-ortsteile): thin display mart exposing
      int_berlin_plr_ortsteil_overlap to the web layer -- pure pass-through,
      no new computation (see model header for the full method). Lets an
      Ortsteil profile page join gentrification_index PLR rows to their
      dominant Ortsteil assignment (filter is_dominant_ortsteil) to build a
      constituent-PLR ("children") table, the Ortsteil-grain equivalent of
      the substr(area_code, 1, N) trick BZR/PGR/Bezirk pages use.
      GATE: the underlying area-overlap crosswalk + dominant-assignment
      method is methodology-adjacent (geo-DS sign-off required per the #269
      ticket gate) -- gated at int_berlin_plr_ortsteil_overlap.sql, not
      re-decided here.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plr_area_code
              - ortsteil_area_code
    columns:
      - name: city_code
        description: City identifier; always 'BER'.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: plr_area_code
        description: 8-digit lor_2021 PLR code.
        data_tests:

          - not_null
      - name: ortsteil_area_code
        description: 4-digit Ortsteil code.
        data_tests:

          - not_null
      - name: ortsteil_area_name
        description: Ortsteil name, denormalized for convenience.
      - name: bezirk_code
        description: 2-digit Bezirk code the Ortsteil belongs to, denormalized for convenience.
      - name: plr_area_m2
        description: PLR polygon area (m^2), EPSG:25833.
      - name: overlap_area_m2
        description: Intersection area (m^2) between this PLR and this Ortsteil.
      - name: overlap_frac_of_plr
        description: overlap_area_m2 / plr_area_m2 -- the crosswalk weight.
      - name: is_dominant_ortsteil
        description: >
          TRUE for the single largest-overlap-share Ortsteil per PLR -- the
          assignment used by mart_area_demographics's ortsteil level and
          mart_ortsteil_plr_stage_mix.
        data_tests:

          - not_null
      - name: n_ortsteil_overlaps
        description: >
          Count of non-trivial Ortsteile this PLR overlaps. >1 means a
          straddling PLR (82 of 542 lor_2021 PLRs, 15.1%, per
          int_berlin_plr_ortsteil_overlap.sql's empirical count).

  - name: mart_ortsteil_plr_stage_mix
    description: >
      #269 (I-ortsteile): child-PLR typology-STAGE DISTRIBUTION per Ortsteil,
      e.g. "6 of 9 PLRs in this Ortsteil are in stage X" -- a descriptive
      rollup, deliberately NOT a re-scored index at Ortsteil grain (matching
      I18's "no re-scored index at coarser-than-PLR grain" decision, #247;
      reaffirmed for BZR/PGR/Bezirk by #267 declining a coarse-index ticket --
      same reasoning applies here). Ortsteil-grain equivalent of the inline
      stage_mix query every BZR/PGR/Bezirk profile page runs against
      gentrification_index via substr(area_code, 1, N) -- Ortsteil cannot use
      that trick (PLR codes do not encode Ortsteil membership), so this mart
      joins through the DOMINANT PLR->Ortsteil assignment instead (see
      int_berlin_plr_ortsteil_overlap.sql). Source: gentrification_index
      (ADR-0004 governed mart), variant='live_data', area_level='plr',
      city_code='BER' -- same scope every existing stage-mix chart uses.
      'uninhabited / no data' is an explicit bucket (uninhabited PLRs'
      status_class is NULL by design, index-definition.md §7.1) -- never
      silently dropped.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - ortsteil_area_code
              - period_yyyymm
              - typology_stage
    columns:
      - name: city_code
        description: City identifier; always 'BER'.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER"]
      - name: ortsteil_area_code
        description: 4-digit Ortsteil code.
        data_tests:

          - not_null
      - name: ortsteil_area_name
        description: Ortsteil name, denormalized for convenience.
      - name: period_yyyymm
        description: Period key matching gentrification_index's own period_yyyymm (YYYY12 snapshot convention for live_data).
        data_tests:

          - not_null
      - name: typology_stage
        description: >
          D1xD2 typology stage name (gentrification_index.status_class for
          variant='live_data'), or the literal 'uninhabited / no data' for
          PLRs with no MSS classification. (Named typology_stage, not `stage`,
          to avoid a reserved-keyword-as-identifier lint (RF04).)
        data_tests:

          - not_null
      - name: n_plr
        description: >
          Count of this Ortsteil's dominantly-assigned constituent PLRs
          currently in this typology_stage, for this period.
        data_tests:

          - not_null

  - name: mart_poi_oa_methods
    description: >
      OA-D3/OA-D3b (#240/#280, ADR-0024): long-format serving view over
      int_poi_offering_advantage_methods's nine method columns per taxonomy
      level (ADR-0024 "methods as columns + a long serving view") --
      density/percapita (this slice) are absolute provision readings, NOT
      location quotients (OA-D0 domain sign-off Condition C -- never
      blended/legend-shared with the LQ family). Pure UNPIVOT/reshape --
      not itself a new methodology decision beyond what
      int_poi_offering_advantage_methods computes.

      Grain: one row per (city_code, snapshot_year, area_code, area_vintage,
      poi_domain_h, poi_category_h, poi_type_h, weight_variant,
      methodology_variant, taxonomy_level, oa_method). taxonomy_level in
      ('domain', 'category', 'type') is separate from OA-D2's area_level
      (spatial-scale) dimension -- this mart is PLR-grain only.

      C7 (geo sign-off, BLOCKING, never-blend): oa_method is
      accepted_values-tested against seed_oa_calculation_methods.csv;
      oa_value is a single scalar of one method -- never a blend of two or
      more.

      Graceful degradation: zero rows when
      int_poi_offering_advantage_methods has no rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - poi_domain_h
              - poi_category_h
              - poi_type_h
              - weight_variant
              - methodology_variant
              - taxonomy_level
              - oa_method
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). #281: canonicalized upstream in
          int_poi_offering_advantage_methods (its own output boundary) --
          this mart is a pure pass-through reshape, so it inherits the
          canonical-only output.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
              config:
                where: "area_code is not null"
      - name: area_code
        description: PLR area code (8-digit, zero-padded).
      - name: taxonomy_level
        description: Which POI taxonomy level this row's oa_value belongs to.
        data_tests:

          - accepted_values:
              arguments:
                values: ["domain", "category", "type"]
              config:
                where: "area_code is not null"
      - name: oa_method
        description: Calculation-method label, accepted-values-tested against seed_oa_calculation_methods.csv.
        data_tests:

          - relationships:
              arguments:
                to: ref('seed_oa_calculation_methods')
                field: oa_method
              config:
                where: "area_code is not null"
      - name: oa_value
        description: >
          The single scalar value for this (taxonomy_level, oa_method) pair
          -- unit depends on oa_method (see seed_oa_calculation_methods.csv
          `unit` column); never a blend of two or more methods.

  - name: mart_poi_oa_arealevel
    description: >
      OA-D6 (#240, ADR-0024): serving mart for OA-D2's area_level roll-up
      (int_poi_offering_advantage_arealevel) -- nested-LQ Offering Advantage
      at plr/bzr/pgr/bezirk (Berlin) and subarea_l2/subarea_l1/district
      (Hamburg, OA-D8) grain. Adds two derived disclosure columns,
      maup_caveat_required and area_level_publish_tier -- OA-D8 (#240)
      generalized both from Berlin-only literals to a per-city
      (dim_city.oa_leaf_area_level) / per-level (seed_dim_area_level.
      publish_tier) lookup; see model SQL header for the OA-D5
      forward-binding condition, the OA-D0 domain sign-off Condition D
      Berlin headline-scale framing, and the OA-D1b domain sign-off forward
      condition 1 Hamburg headline-scale reasoning (argued independently on
      Hamburg's own resolution-vs-stability terms) these discharge.

      Grain: one row per (city_code, snapshot_year, area_level, area_code,
      area_vintage, poi_domain_h, poi_category_h, poi_type_h, weight_variant,
      methodology_variant) -- identical to
      int_poi_offering_advantage_arealevel's own grain.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_level
              - area_code
              - area_vintage
              - poi_domain_h
              - poi_category_h
              - poi_type_h
              - weight_variant
              - methodology_variant
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). 'BER' (Berlin) or 'HH' (Hamburg,
          OA-D8, #240). #281: already canonical-only -- upstream
          int_poi_offering_advantage_arealevel INNER JOINs dim_city, which
          defensively excludes any legacy lowercase 'berlin' rows as a side
          effect (verified by query during the #281 fix).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null
      - name: area_level
        description: >
          Spatial roll-up level. Each city's own leaf level is the finest,
          pass-through grain; 'bzr'/'pgr'/'bezirk' (Berlin) and
          'subarea_l1'/'district' (Hamburg, OA-D8) are roll-ups (OA-D2/D8).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values:
                  ["plr", "bzr", "pgr", "bezirk", "subarea_l2", "subarea_l1", "district"]
              config:
                where: "area_code is not null"
      - name: area_code
        description: >
          Area code at this row's area_level (8-digit PLR, 6-digit BZR,
          4-digit PGR, or 2-digit Bezirk prefix for Berlin; native Gebiet/
          Stadtteil/Bezirk id for Hamburg). Vintage-specific.
        data_tests:

          - not_null
      - name: area_vintage
        description: >
          Spatial-join vintage. 'lor_pre2021'/'lor_2021' for Berlin;
          'current' for Hamburg (OA-D8).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
      - name: poi_domain_h
        description: Harmonized POI domain.
        data_tests:

          - not_null
      - name: poi_category_h
        description: Harmonized POI category.
        data_tests:

          - not_null
      - name: poi_type_h
        description: Harmonized POI type.
        data_tests:

          - not_null
      - name: weight_variant
        description: "'standard' or a Gaussian-weighted kernel variant."
        data_tests:

          - not_null
      - name: methodology_variant
        description: ADR-0017 D4 structural invariant.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["faithful", "improved"]
      - name: oa_domain
        description: Domain-level LQ at this area_level (ADR-0017 D1 formula, see int_poi_offering_advantage_arealevel).
      - name: oa_category
        description: Category-level LQ at this area_level, parent-relative to domain.
      - name: oa_type
        description: Type-level LQ at this area_level, parent-relative to domain.
      - name: oa_domain_min_base_flag
        description: True when this row's area_level-local all-domains base is below oa_min_poi_base_n.
        data_tests:

          - not_null
      - name: oa_category_min_base_flag
        description: True when this row's area_level-local domain base is below oa_min_poi_base_n.
        data_tests:

          - not_null
      - name: oa_type_min_base_flag
        description: True when this row's area_level-local domain base is below oa_min_poi_base_n.
        data_tests:

          - not_null
      - name: maup_caveat_required
        description: >
          OA-D5 (#240) forward-binding condition, generalized per-city by
          OA-D8 (#240): TRUE for every row coarser than THIS CITY's own OA
          leaf level (dim_city.oa_leaf_area_level) -- Berlin's bzr/pgr/bezirk
          relative to plr (nested_lq's PLR-vs-BZR rank correlation is
          empirically MAUP-fragile, docs/methodology/OA-D5-mode-comparison-
          findings.md, pooled rho=0.662 < spatial-methods.md §7's r>0.7
          threshold), and Hamburg's subarea_l1/district relative to
          subarea_l2 (a conservative disclosure default -- Hamburg's own
          MAUP rank-correlation has not yet been empirically re-run, see
          model SQL header). Any consumer displaying a row where this is
          TRUE alongside/against that city's leaf-grain figures MUST carry
          the §7 MAUP-fragility disclosure prominently.
        data_tests:

          - not_null
      - name: area_level_publish_tier
        description: >
          'primary' (each city's own leaf level), 'headline' (Berlin: bzr --
          maintainer-confirmed OA-D0 recommended scale; Hamburg: subarea_l1
          -- OA-D8, argued independently on Hamburg's own resolution/
          stability terms per the OA-D1b domain sign-off forward condition
          1, see model SQL header), or 'context_only' (Berlin: pgr, bezirk;
          Hamburg: district -- ecological-fallacy caveat, OA-D0 domain
          sign-off Condition D). Looked up from seed_dim_area_level.
          publish_tier.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["primary", "headline", "context_only"]

  - name: mart_poi_oa_hotspots
    description: >
      OA-D3c (#280, ADR-0025): Getis-Ord Gi* hotspot/coldspot mart -- the
      analysis->mart handoff ADR-0025 authorizes for the one OA method
      (Getis-Ord) ADR-0024 held out (needs a spatial-weights matrix W, not a
      SQL operation, OA-D0 geo sign-off C9). Pure join of
      int_poi_offering_advantage_arealevel's domain-grain local stock to
      stg_oa_getis_ord's precomputed Gi* statistic (analysis/
      f_oa_getis_ord.py) by the ADR-0025 Decision 2 stable key -- no spatial
      computation in this model.

      GRAIN ASYMMETRY (ADR-0025 Decision 3, BINDING, state explicitly):
      unlike every other OA mart (full type-leaf grain, up to four area
      levels), this mart is PLR/BZR area levels ONLY (not pgr, not bezirk --
      degenerate 12-unit contiguity) and DOMAIN taxonomy grain ONLY (not
      category/type leaf -- too sparse for a meaningful Gi* surface).

      PUBLIC LABELLING GUARDRAIL (binding): gi_star_cluster_label is the
      INTERNAL statistic label ('hot'/'cold'/'ns') -- a bare "hotspot" is
      prohibited on any public-facing surface; consumers MUST apply a
      provision/stock-calibrated hedged qualifier ("amenity-provision
      cluster" / "concentrated-provision area"), NOT a6_hotspots.py's own
      hedge ("amenity-change hotspot" / "social-change-pressure cluster"),
      which is calibrated for a change/dynamism input, not this column's
      single-snapshot-year stock input (OA-D3c domain sign-off F1) -- plus
      the ecological-inference disclaimer before publishing.

      FDR DISCLOSURE (binding, CC1 remediation #287): gi_star_p is the RAW
      uncorrected permutation p-value. TWO labelled BH-adjusted variants are
      carried: gi_star_p_fdr / gi_star_fdr_significant (PRIMARY, label
      source -- per-domain-per-map family, the standard ESDA unit) and
      gi_star_p_fdr_pooled_alldomains / gi_star_fdr_significant_pooled_alldomains
      (SECONDARY, conservative, pooled across all ~13 domains -- the
      original #280 design, per OA-D0 geo sign-off C9's multiple-comparison
      framing). gi_star_cluster_label is derived from the PRIMARY flag only.

      LOR_2021 SIGNIFICANCE DISCLOSURE (binding, CC2 #287): under the
      pooled-secondary FDR variant, lor_2021 still yields zero significant
      cells at any level -- suppression-by-conservatism (milder recent
      permutation p-floor + pooled-across-13-domains denominator). Under
      the PRIMARY per-domain FDR variant (CC1 remediation) lor_2021 DOES
      surface real discoveries (108 cells at PLR, 376 at BZR), confirming
      the pooled-only zero was conservatism, not an absence of amenity
      clustering. Any consumer must disclose the FDR-variant-dependence of
      this result and must not treat these Gi* results as temporal/change
      claims under either variant (C3 caveat applies).

      weight_variant='standard' / methodology_variant='faithful' only (the
      bandwidth-free hard-count construct) -- see model SQL header for why
      the gaussian_* sweep is out of this ticket's scope.

      Grain: one row per (city_code, area_vintage, area_level, area_code,
      snapshot_year, poi_domain_h) -- ADR-0025 Decision 2's binding stable
      key.

      Graceful degradation: all-NULL Gi* columns (LEFT JOIN) when
      analysis/f_oa_getis_ord.py has not yet been run; zero rows when
      int_poi_offering_advantage_arealevel has no plr/bzr domain-grain rows.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - area_vintage
              - area_level
              - area_code
              - snapshot_year
              - poi_domain_h
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: City identifier (ADR-0005).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
              config:
                where: "area_code is not null"
      - name: area_level
        description: >
          ADR-0025 Decision 3 (BINDING): PLR and BZR only -- NOT Bezirk
          (degenerate contiguity graph) and NOT PGR (not yet
          R-C1-validated for Gi*).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
          - accepted_values:
              arguments:
                values: ["plr", "bzr"]
              config:
                where: "area_code is not null"
      - name: area_code
        description: Area code at this row's area_level. Vintage-specific.
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: poi_domain_h
        description: >
          POI domain (ADR-0025 Decision 3: domain grain only, NOT
          category/type leaf -- too sparse for a meaningful Gi* surface).
        data_tests:

          - not_null:
              config:
                where: "area_code is not null"
      - name: domain_stock_local
        description: >
          The mass-conserved local POI stock Gi* was actually computed over
          (int_poi_offering_advantage_arealevel's domain_stock_local, same
          input the analysis script reads) -- carried through for context,
          not re-derived here.
      - name: gi_star_z
        description: >
          Getis-Ord Gi* z-score (esda.G_Local, star=True; Getis & Ord 1992;
          Ord & Getis 1995). Signed -- positive = high-value cluster,
          negative = low-value cluster. NULL where the analysis script has
          not been run yet or this cell was excluded (see
          analysis/f_oa_getis_ord.py).
        data_tests:

          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null"
              config:
                where: "area_code is not null and gi_star_z is not null"
      - name: gi_star_p
        description: >
          RAW (uncorrected) two-sided permutation p-value -- see
          gi_star_p_fdr for the multiple-comparison-corrected figure
          (ADR-0025 Decision 4).
        data_tests:

          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
              config:
                where: "area_code is not null and gi_star_p is not null"
      - name: gi_star_p_fdr
        description: >
          PRIMARY (label-source) Benjamini-Hochberg FDR-adjusted p-value
          (CC1 remediation, #287) -- corrected PER-DOMAIN, PER-MAP: one BH
          batch per (city_code, area_vintage, area_level, snapshot_year,
          poi_domain_h). Standard ESDA "one map = one family" unit (Caldas
          de Castro & Singer 2006). gi_star_cluster_label is derived from
          THIS column's significance flag, not gi_star_p_fdr_pooled_alldomains.
        data_tests:

          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
              config:
                where: "area_code is not null and gi_star_p_fdr is not null"
      - name: gi_star_fdr_significant
        description: >
          gi_star_p_fdr < 0.05 (PRIMARY, per-domain-per-map family).
          gi_star_cluster_label is derived from this flag, not the raw
          p-value and not the pooled secondary variant.
      - name: gi_star_p_fdr_pooled_alldomains
        description: >
          SECONDARY, labelled conservative variant (CC1, #287) -- the
          original #280 design: Benjamini-Hochberg FDR-adjusted p-value,
          corrected jointly across every (area_code, poi_domain_h) pair
          tested for the same (city_code, area_vintage, area_level,
          snapshot_year) "map" (~13 domains pooled). Wider/more conservative
          than the primary per-domain family; NOT the label source for
          gi_star_cluster_label. See analysis/f_oa_getis_ord.py Note 5 /
          docs/methodology/OA-D3c-getis-ord-geo-signoff.md CC1.
        data_tests:

          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
              config:
                where: >-
                  area_code is not null and gi_star_p_fdr_pooled_alldomains
                  is not null
      - name: gi_star_fdr_significant_pooled_alldomains
        description: >
          gi_star_p_fdr_pooled_alldomains < 0.05 (SECONDARY, pooled-across-
          domains family). NOT the flag gi_star_cluster_label is derived
          from -- see gi_star_fdr_significant for the primary flag.
      - name: gi_star_cluster_label
        description: >
          INTERNAL statistic label only -- 'hot' / 'cold' / 'ns', derived
          from the PRIMARY per-domain-per-map FDR flag (gi_star_fdr_significant,
          CC1 remediation, #287). A bare "hotspot" is PROHIBITED on any
          public-facing surface; apply a provision/stock-calibrated hedged
          qualifier ("amenity-provision cluster" / "concentrated-provision
          area"), NOT a6_hotspots.py's own hedge ("amenity-change hotspot" /
          "social-change-pressure cluster"), which is calibrated for a
          change/dynamism input, not this column's single-snapshot-year
          stock input (OA-D3c domain sign-off F1), plus the
          ecological-inference disclaimer before publishing.

          `lor_2021` yields ZERO significant cells under the POOLED-secondary
          FDR variant at any level -- CC2 (#287): suppression-by-conservatism
          (a milder permutation p-floor for the more-recent, better-covered
          period compounding with the pooled x13-domain denominator). Under
          the PRIMARY per-domain FDR variant (this column's flag source,
          CC1 remediation) lor_2021 DOES surface real discoveries (108 cells
          at PLR, 376 at BZR) -- confirming the pooled-only zero was
          conservatism, not an absence of amenity clustering. Any future
          consumer (G2 methodology page, site content) MUST disclose the
          FDR-variant-dependence of this result and MUST NOT present these
          Gi* results as temporal/change claims under either variant (C3
          completeness-contamination caveat). Full detail:
          docs/methodology/OA-D3c-getis-ord-geo-signoff.md CC2 /
          analysis/f_oa_getis_ord.py Note 7.
        data_tests:

          - accepted_values:
              arguments:
                values: ["hot", "cold", "ns"]
              config:
                where: "area_code is not null and gi_star_cluster_label is not null"
      - name: gi_star_w_fallback
        description: >
          TRUE when this area_code had no Queen-contiguity neighbours and
          received the k-NN (k=6) fallback weights instead (ADR-0025
          Decision 4 / ADR-0010 Sec 5) -- audit column.

  - name: mart_poi_dominance
    description: >
      OA-D6 (#240, ADR-0024): serving mart for OA-D4's within-group
      offering-dominance model (int_poi_within_group_dominance) -- pure
      pass-through, not methodology-bearing beyond what OA-D0/OA-D4 already
      signed off. Does NOT filter is_public_safe (see model SQL header) --
      any future consumer publishing a dominance figure on a public,
      displacement-adjacent surface MUST filter is_public_safe = true first
      (OA-D4 domain sign-off forward-binding condition).

      Grain: one row per (city_code, snapshot_year, area_code, area_vintage,
      weight_variant, dominance_group) -- identical to
      int_poi_within_group_dominance's own grain.
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city_code
              - snapshot_year
              - area_code
              - area_vintage
              - weight_variant
              - dominance_group
          config:
            where: "area_code is not null"
    columns:
      - name: city_code
        description: >
          City identifier (ADR-0005). #281: canonicalized upstream in
          int_poi_within_group_dominance (its own base CTE) -- this mart is
          a pure pass-through, so it inherits the canonical-only output.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["BER", "HH"]
      - name: snapshot_year
        description: Calendar year of the OSM snapshot.
        data_tests:

          - not_null
      - name: area_code
        description: PLR area code (8-digit, zero-padded).
        data_tests:

          - not_null
      - name: area_vintage
        description: Spatial-join vintage, carried through from int_poi_within_group_dominance.
        data_tests:

          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021", "current"]
              config:
                where: "area_code is not null"
      - name: weight_variant
        description: "'standard' or a Gaussian-weighted kernel variant, carried through unchanged."
      - name: dominance_group
        description: >
          One of the five curated allow-list groups (OA-D0 domain sign-off
          Condition A). Governed by seed_oa_dominance_groups.csv.
        data_tests:

          - accepted_values:
              arguments:
                values:
                  [
                    "gastronomy_category",
                    "gastronomy_restaurant_cuisine",
                    "retail_category",
                    "entertainment_category",
                    "wellness_curated",
                  ]
              config:
                where: "area_code is not null"
      - name: is_public_safe
        description: >
          FALSE only for gastronomy_restaurant_cuisine (anti-stigma clause).
          NOT filtered by this mart -- any consumer rendering a dominance
          figure on a public, displacement-adjacent surface MUST filter
          is_public_safe = true first.
      - name: group_stock_local
        description: Sum of child_stock across all present (positive-stock) children in this group cell.
      - name: n_children
        description: Count of present (positive-stock) children contributing to this group cell.
      - name: hhi
        description: >
          Herfindahl-Hirschman concentration index, sum(share_i^2), range
          [1/n_children, 1]. Never publish without top_child/
          top_child_offering_tier (sign-blindness clause).
        data_tests:

          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1.0000001 }
              config:
                where: "area_code is not null"
      - name: top_share
        description: Largest single child's share of the group (max share_i).
        data_tests:

          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1.0000001 }
              config:
                where: "area_code is not null"
      - name: entropy
        description: Shannon entropy of the within-group share distribution, range [0, ln(n_children)].
      - name: evenness
        description: Pielou evenness (entropy / ln(n_children)), range [0,1]. NULL when n_children <= 1.
      - name: top_child
        description: The child_label (category or type name) with the largest share in this group cell.
      - name: top_child_level
        description: "'category' or 'type' -- the taxonomy grain of top_child."
      - name: top_child_offering_tier
        description: top_child's offering_tier from seed_poi_offering_relevance.csv.
      - name: top_child_offering_weight
        description: top_child's offering_weight from seed_poi_offering_relevance.csv.
      - name: is_thin_base
        description: >
          TRUE when group_stock_local < greatest(10, 5 * n_children) --
          flags, never drops (anti-erasure).
