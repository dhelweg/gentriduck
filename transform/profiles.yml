# Repo-local dbt profile (kept here so the global ~/.dbt/profiles.yml is untouched).
# Local-first: a DuckDB file under data/ with the spatial extension loaded.
# Path is relative to the repo root — all dbt runs go via `uv run poe <task>` from
# the repo root (CWD = repo root, with --project-dir transform).
gentriduck:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "data/gentriduck.duckdb"
      threads: 4
      extensions:
        - spatial
    # F2 (#34) / ADR-0012 decision 2: MotherDuck free tier is an OPTIONAL convenience target
    # for building/sharing the warehouse itself only — never on the visitor-facing serving
    # path (that's static parquet + in-browser DuckDB-WASM, ADR-0012 decision 1). Requires
    # MOTHERDUCK_TOKEN in .env (see .env.example); same models run unchanged (ADR-0001).
    md:
      type: duckdb
      path: "md:gentriduck?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      threads: 4
      extensions:
        - spatial
