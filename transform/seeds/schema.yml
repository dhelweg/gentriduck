version: 2

seeds:
  - name: seed_poi_mapping
    description: >
      POI tag-to-taxonomy mapping seed (translated to English from the 2018 thesis
      reference/poi_mapping.csv). Maps OSM POI types to (domain, category, type)
      hierarchy used in int_poi_mapping and the POI pivot (Epic C). 163 rows.
      Original German labels translated at this seed boundary; reference/poi_mapping.csv
      is the read-only thesis artefact and must not be modified.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: domain
        description: Top-level POI domain (English label; e.g. 'Gastronomy', 'Tourism').
        data_tests:

          - not_null
      - name: category
        description: Mid-level POI category within the domain (English label).
        data_tests:

          - not_null
      - name: type
        description: Specific POI type (English label; maps to OSM tag values).
        data_tests:

          - not_null

  - name: seed_dim_city
    description: >
      City dimension seed (ADR-0005 city-agnostic seam). One row per city.
      Berlin (BER) + Hamburg (HH, ADR-0014, #40 H1). Multi-city expansion
      (Epic H) adds a new row per additional city.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: city_code
        description: Short city identifier (e.g. 'BER', 'HH'). Natural key.
        data_tests:

          - not_null
          - unique
      - name: city_name
        description: Human-readable city name (e.g. 'Berlin', 'Hamburg').
        data_tests:

          - not_null
      - name: country_code
        description: ISO 3166-1 alpha-2 country code (e.g. 'DE').
        data_tests:

          - not_null
      - name: native_crs_epsg
        description: >
          EPSG code of the city's native projected CRS used for spatial
          distance/area computations (ADR-0005 per-city CRS parameter,
          first exercised by Hamburg in ADR-0014: Berlin=25833 ETRS89/UTM33N,
          Hamburg=25832 ETRS89/UTM32N). Geometries are stored in this native
          CRS in staging (not reprojected at ingestion); ST_Transform to
          WGS84 happens per-consumer (e.g. the ohsome join), matching the
          existing Berlin int_osm_poi_plr_weighted.sql convention.
        data_tests:

          - not_null

  - name: seed_dim_area_level
    description: >
      Area level taxonomy seed (ADR-0005 city-agnostic seam). Maps Berlin's
      administrative area codes (bzr, plr) to human-readable level names.
      'bezirk' level is deferred until Epic C adds the district-level breakdown.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: level_code
        description: Area level code (stable administrative abbreviation; e.g. 'bzr', 'plr').
        data_tests:

          - not_null
          - unique
      - name: level_name
        description: Human-readable level name (e.g. 'Bezirksregion').
        data_tests:

          - not_null
      - name: description
        description: Brief description of the administrative level.

  - name: seed_ewr_indicator_meta
    description: >
      Metadata for the 13 EWR socio-economic indicators computed by
      ingestion/berlin/ewr/ingest_ewr.py (C3b). One row per indicator.
      Documents the indicator key, German and English labels, unit, stable vintage
      range (definition_vintage_from / definition_vintage_to), the source EWR
      column expression, and any caveats (e.g. methodological breaks).
      Used by analysts and the methodology page (Epic G2) to understand the series.
      Key caveat: migration_background_share has definition_vintage_from=2017 due to
      the Mikrozensus definitional change around 2017. The pre-2017 column is present
      in the data but is encoded separately (not silently concatenated) so analysts
      can filter by reference_year >= 2017 for reliable comparisons.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: indicator
        description: Indicator key matching stg_berlin_ewr.indicator.
        data_tests:

          - not_null
          - unique
      - name: label_de
        description: German label for the indicator as used in EWR documentation.
        data_tests:

          - not_null
      - name: label_en
        description: English label / description of the indicator and its computation.
        data_tests:

          - not_null
      - name: unit
        description: Unit of measurement (e.g. 'share', 'count', 'years').
        data_tests:

          - not_null
      - name: definition_vintage_from
        description: >
          First reference year for which this indicator definition is methodologically
          stable and comparable. Analysts should filter reference_year >= definition_vintage_from
          for time-series analysis. For migration_background_share this is 2017 (not 2015)
          due to the Mikrozensus definitional break.
        data_tests:

          - not_null
      - name: definition_vintage_to
        description: Last reference year for which this indicator definition is stable.
        data_tests:

          - not_null
      - name: source_table
        description: >
          Source EWR CSV column name (or expression) from which this indicator is derived
          (e.g. 'E_E' for residents_total, 'DAU5' for residence_duration_5y_share).
        data_tests:

          - not_null
      - name: caveats
        description: >
          Free-text caveat or known issue with the series. Empty string when no
          caveat applies. migration_background_share has a mandatory caveat
          documenting the ~2017 Mikrozensus definitional break.

  - name: seed_lor_crosswalk_2006_to_2021
    description: >
      PLR-level crosswalk BETWEEN the pre-2021 LOR scheme (lor_pre2021, 447 PLRs,
      reference_year <= 2020) and the LOR 2021 reform scheme (lor_2021, 542 PLRs,
      reference_year >= 2021), in BOTH directions. `weight` (forward, pre2021 -> 2021)
      is required by int_berlin_ewr_plr2021 to align the EWR socio-economic time
      series across the LOR 2021 boundary. `reverse_weight` (2021 -> pre2021, #136)
      re-keys mart_price_rent_dimension (published only on lor_2021) back onto the
      governed index's lor_pre2021 area codes.

      STATUS (as of 2026-07-04): POPULATED with 3088 areal_pop_weighted rows derived
      from GDI Berlin WFS geometries (EPSG:25833) via
      ingestion/berlin/lor/ingest_lor_crosswalk.py, which now computes BOTH weight
      directions from the same intersection geometry (forward-only through
      2026-06-19; reverse direction added for #136, geo-DS approved 2026-07-04 --
      docs/epic-d/D1d-followup-geo-signoff.md, verdict PASS). Weight-sum validation
      passed for both directions: all 448 pre-2021 PLRs have `weight` summing to
      1.0 +/- 0.01, and all 542 2021 PLRs have `reverse_weight` summing to
      1.0 +/- 0.01. Zero-weight rows (numerical precision artifacts, both
      directions) are excluded from the seed.

      PROVENANCE: GDI Berlin WFS geometries, CC BY 3.0 DE.
        https://gdi.berlin.de/

      Mapping types used:
        'areal_pop_weighted' -- weight = intersection_area / pre2021_plr_area;
        reverse_weight = intersection_area / lor2021_plr_area (all rows; same
        intersection geometry, different normalizing denominator).
      weight=1.0 / reverse_weight=1.0 for 1:1 maps; fractional for PLRs split
      across new/old boundaries.
    config:
      column_types:
        weight: double
        reverse_weight: double
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: plr_id_pre2021
        description: >
          PLR area code in the pre-2021 LOR scheme (8-digit string, zero-padded).
          Matches area_code in stg_berlin_ewr where area_vintage='lor_pre2021'.
        data_tests:

          - not_null
      - name: plr_id_2021
        description: >
          PLR area code in the LOR 2021 reform scheme (8-digit string, zero-padded).
          Matches area_code in stg_berlin_ewr where area_vintage='lor_2021'.
        data_tests:

          - not_null
      - name: mapping_type
        description: >
          Type of mapping: 'official_concordance' (from Senate publication),
          'areal_pop_weighted' (areal/population weighted), 'identity' (same code),
          or 'stub' (placeholder, not for analysis).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values:
                  - official_concordance
                  - areal_pop_weighted
                  - identity
                  - stub
      - name: weight
        description: >
          Forward fractional weight (pre2021 -> 2021): 1.0 for 1:1 maps; <1.0 for
          splits where one pre-2021 PLR maps to multiple 2021 PLRs. Weights for a
          given plr_id_pre2021 should sum to 1.0. weight = intersection_area /
          pre2021_plr_area. Type: double (enforced via column_types to ensure
          scientific-notation values in the CSV are parsed correctly).
        data_tests:

          - not_null
      - name: reverse_weight
        description: >
          Reverse fractional weight (2021 -> pre2021, #136): 1.0 for 1:1 maps;
          <1.0 for splits where one 2021 PLR maps to multiple pre-2021 PLRs.
          Weights for a given plr_id_2021 should sum to 1.0.
          reverse_weight = intersection_area / lor2021_plr_area — the SAME
          intersection geometry as `weight`, normalized by the 2021-PLR area
          instead of the pre2021-PLR area. Used to re-key intensive price/rent
          covariates (mart_price_rent_dimension, lor_2021-only) onto lor_pre2021
          area codes via area-weighted averaging (geo-DS approved, #136). Type:
          double (enforced via column_types).
        data_tests:

          - not_null
      - name: note
        description: >
          Free-text provenance note for this mapping row. Documents the computation
          method and source geometry attribution.

  - name: seed_poi_tag_drift
    description: >
      C2 POI tag-schema drift mapping seed.  Documents approved OSM tag migrations
      and alternative tagging conventions that must be normalised for cross-year
      comparability of the gentrification index.  Each row maps one raw OSM tag pair
      (osm_key / osm_value, with optional secondary key/value) to its canonical
      equivalent (canonical_key / canonical_value).  The stg_poi_type column stores
      the English poi_type label that the C1 ingestion layer writes for this tag; it
      is used to join against stg_osm_poi.poi_type in int_osm_poi_harmonized.
      Rows with an empty stg_poi_type are forward-looking definitions for tags not
      yet captured by C1 (e.g. secondary-tag organic variants, unrecognised tags).
      10 rows; geo-data-scientist approved.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: osm_key
        description: Raw OSM tag key (e.g. 'amenity', 'shop', 'sport', 'leisure').
        data_tests:

          - not_null
      - name: osm_value
        description: Raw OSM tag value (e.g. 'coworking_space', 'health_food').
        data_tests:

          - not_null
      - name: osm_secondary_key
        description: >
          Optional secondary OSM tag key qualifying the primary tag
          (e.g. 'organic' for shop=bakery + organic=yes).  Empty when not applicable.
      - name: osm_secondary_value
        description: >
          Optional secondary OSM tag value (e.g. 'yes', 'only').  Empty when not applicable.
      - name: stg_poi_type
        description: >
          English poi_type label written by the C1 ingestion layer for this OSM tag
          (e.g. 'Coworking Space').  Used as the join key against stg_osm_poi.poi_type.
          Empty for tags not yet in the C1 poi_mapping (forward-looking drift rules).
      - name: canonical_key
        description: Target canonical OSM key after drift remapping (e.g. 'office', 'shop').
        data_tests:

          - not_null
      - name: canonical_value
        description: Target canonical OSM value after drift remapping (e.g. 'coworking', 'organic').
        data_tests:

          - not_null
      - name: since_year
        description: Year from which this drift rule should be applied (integer).
        data_tests:

          - not_null
      - name: confidence
        description: Geo-data-scientist confidence level for this rule.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: rationale
        description: Free-text rationale for the drift mapping rule.
        data_tests:

          - not_null

  - name: seed_poi_canonical_category
    description: >
      C2 canonical POI tag to category mapping seed.  Maps canonical (key, value)
      pairs — as defined in seed_poi_tag_drift — to the (poi_domain, poi_category,
      poi_type, gentrification_proxy) classification used in the harmonized
      int_osm_poi_harmonized model.  4 rows; geo-data-scientist approved.

      Bug fix (#199, 2026-07-09): poi_domain/poi_category/poi_type were originally
      authored in a lower-case, underscore-separated stub convention that diverged
      from the Title-Case convention seed_poi_mapping.csv (the C2 harmonization
      target) uses everywhere else.  Since int_osm_poi_harmonized.sql's `final` CTE
      does `coalesce(canonical_poi_domain, poi_domain)` (this seed's value wins when
      it matches), any row where this seed matched was silently leaking lower-case
      labels into poi_domain_h/poi_category_h/poi_type_h — confirmed materially
      affecting the office/coworking row (327 real Berlin POIs mislabeled
      'economy/workspace/coworking_space' instead of 'Other/Hipster/Coworking
      Space', which also silently undercounted int_poi_features_pivot's
      poi_type_coworking_space column, since that pivot filters on the Title-Case
      value).  The office/coworking row is fixed to the Title-Case triple exactly
      matching seed_poi_mapping.csv's `Other,Hipster,Coworking Space`.  The other 3
      rows (shop/organic, leisure/yoga_studio, leisure/fitness_outdoor) share the
      same latent bug pattern but currently match zero real Berlin POIs (verified
      against the live warehouse) and have no existing Title-Case target in
      seed_poi_mapping.csv to copy verbatim — assigning them a new harmonized triple
      is a taxonomy decision, not a mechanical copy, and is tracked as a follow-up
      (#201), not fixed here.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: canonical_key
        description: Canonical OSM tag key (e.g. 'office', 'shop', 'leisure').
        data_tests:

          - not_null
      - name: canonical_value
        description: Canonical OSM tag value (e.g. 'coworking', 'organic', 'yoga_studio').
        data_tests:

          - not_null
      - name: poi_domain
        description: >
          Top-level POI domain label in the canonical classification. Title-Case
          for the office/coworking row (#199 fix, matches seed_poi_mapping.csv);
          still lower-case for the 3 rows tracked by #201 (currently inactive --
          match zero real Berlin POIs).
        data_tests:

          - not_null
      - name: poi_category
        description: >
          Mid-level POI category within the domain. Same Title-Case-vs-lower-case
          split as poi_domain -- see #199/#201.
        data_tests:

          - not_null
      - name: poi_type
        description: >
          Specific canonical POI type. Same Title-Case-vs-lower-case split as
          poi_domain -- see #199/#201.
        data_tests:

          - not_null
      - name: gentrification_proxy
        description: >
          Whether this canonical POI type serves as a gentrification proxy signal
          (boolean string 'true' / 'false').
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["true", "false"]

  - name: seed_mss_expected_counts
    description: >
      R-A3 row-count reconciliation reference. Published per-edition PLR counts for
      Berlin MSS (Monitoring Soziale Stadtentwicklung), hard-coded from ADR-0006.
      Used by test_mss_plr_row_count to assert that each ingested edition matches
      the expected number of PLR rows (±5 tolerance).
      447 PLR for pre-2021 LOR editions (<=2019); 542 PLR for LOR 2021 (>=2021).
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: edition
        description: MSS publication year (2013, 2015, 2017, 2019, 2021, 2023, 2025).
        data_tests:

          - not_null
          - unique
      - name: expected_plr_count
        description: >
          Published PLR count for this edition. 447 for pre-2021 LOR editions;
          542 for LOR 2021 editions. Source: ADR-0006 / MSS reports.
        data_tests:

          - not_null
      - name: lor_vintage
        description: >
          LOR boundary vintage for this edition. 'lor_pre2021' for editions <=2019;
          'lor_2021' for editions >=2021.
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["lor_pre2021", "lor_2021"]

  - name: seed_gentrification_ground_truth
    description: >
      B2 back-test harness ground-truth seed. Curated list of ~20 Berlin PLRs
      (LOR 2021 vintage) with literature-based gentrification labels used to
      validate the live gentrification index against known hotspots and coldspots.

      Labels:
        'hotspot' — areas under active gentrification pressure or with known
          high vulnerability; expected to appear in the top decile (highest
          status_index = most deprived) of the live index. West-Berlin-shaped
          (deprived AND under pressure); tested by Test B.
        'coldspot' — stable, affluent outer-city areas; expected to appear in
          the bottom decile (lowest status_index = least deprived).
        'mixed' — areas that have completed gentrification or are in
          transition; not expected to appear cleanly in either decile.
        'emerging-east' (R-B2c, #278) — eastern-Berlin (Lichtenberg) gentrification
          frontiers that do NOT fit the 'hotspot' shape: the R-B2b domain sign-off
          (docs/methodology/R-B2b-domain-signoff.md) found no Lichtenberg PLR is
          simultaneously a documented gentrification frontier AND top-decile
          deprived — the real frontiers sit at mittel status (D1=2) with
          stabil-or-improving dynamism (D2 in {1,2}) under active Milieuschutz
          protection, inheriting invasion-succession pressure from Friedrichshain
          (Dangschat 1988). Tested by its own path, Test E (dynamism-aware
          recall: D1=2 AND D2<=2 AND under_milieuschutz), NOT by Test B's
          top-decile criterion — folding these PLRs into 'hotspot' would either
          mis-sign GDR-era Plattenbau deprivation as gentrification-by-proxy or
          silently dilute what Test B measures (R-B2b domain sign-off). Tracked
          descriptively at mittel status, not asserted as causally destined to
          displace (G2/O2 framing guard).

      Sources: Döring & Ulbricht (2016), Holm & Schulz (2016), Helweg 2018
      thesis, Dangschat (1988) invasion-succession, and MSS 2023/2025 direct
      class assignments.
      Approved PLR IDs verified against stg_berlin_lor lor_2021 vintage.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: plr_id
        description: >
          8-character PLR area code (LOR 2021 vintage). Natural key.
          Verified against stg_berlin_lor (area_vintage='lor_2021').
        data_tests:

          - not_null
          - unique
      - name: plr_name
        description: Human-readable PLR name (German proper noun; Berlin place names).
        data_tests:

          - not_null
      - name: bezirk
        description: Berlin district (Bezirk) name (e.g. 'Neukölln', 'Pankow').
        data_tests:

          - not_null
      - name: label
        description: >
          Ground-truth gentrification label: 'hotspot' (under pressure / vulnerable,
          west-Berlin-shaped, tested @ top decile by Test B), 'coldspot' (stable /
          low deprivation), 'mixed' (transitional / completed), or 'emerging-east'
          (R-B2c, #278 — eastern-Berlin mittel-status frontier, tested by the
          dynamism-aware Test E, not Test B).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [hotspot, coldspot, mixed, emerging-east]
      - name: source
        description: >
          Short citation for the label assignment (e.g. 'Döring & Ulbricht 2016',
          'MSS 2023 Status=4', 'Helweg 2018 thesis §4.2').
        data_tests:

          - not_null
      - name: notes
        description: >
          Optional context: current MSS status/class, literature reference,
          or caveats about the mapping accuracy.

  - name: seed_berlin_mietspiegel
    description: >
      D1 — Berliner Mietspiegel multi-vintage rent table seed (2017-present).
      Each row is one cell of the Mietspiegeltabelle: a (vintage, year_built_bucket,
      size_bucket, wohnlage) combination with the net cold rent range (low/mid/high
      EUR/m2/month, representing the 3/4-Spanne and Median).
      All cells represent standard-equipped apartments (mit Sammelheizung, Bad, IWC).
      Apartments without SH or Bath use fixed footnote deductions; these are NOT rows.
      ausstattung is not a dimension in the Mietspiegel table structure.
      PDFs available at mietspiegel.berlin.de/berliner-mietspiegel/archiv/ —
      NOT redistributable in automated form (ADR-0003 item 11); only transcribed
      numeric values are committed.
      Vintages available: 2017, 2019, 2021, 2023, 2024, 2026 (all fully transcribed).
    meta:
      dbt_meta_owner: data-engineer
    data_tests:

      - dbt_utils.expression_is_true:
          arguments:
            expression: "rent_low <= rent_mid"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          arguments:
            expression: "rent_mid <= rent_high"
          config:
            severity: warn
    columns:
      - name: vintage
        description: >
          Mietspiegel edition year (integer; 2017, 2019, 2021, 2023, 2024, or 2026).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [2017, 2019, 2021, 2023, 2024, 2026]
              config:
                severity: warn
      - name: year_built_bucket
        description: >
          Construction year bucket. 2017 values: 'pre_1918', '1919_1949', '1950_1964',
          '1965_1972', '1973_1990_west', '1973_1990_ost', '1991_2002', '2003_2015'.
          Later editions may merge west/ost and use 'ab_2003' for the newest bucket.
        data_tests:

          - not_null
      - name: size_bucket
        description: >
          Apartment floor area bucket: 'under_40' (<40 m2), '40_to_60' (40-<60 m2),
          '60_to_90' (60-<90 m2), '90_plus' (>=90 m2).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [under_40, 40_to_60, 60_to_90, 90_plus]
      - name: wohnlage
        description: Location quality tier ('einfach', 'mittel', 'gut').
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [einfach, mittel, gut]
      - name: rent_low
        description: Lower bound of the 3/4-Spanne (EUR/m2/month, net cold rent).
        data_tests:

          - not_null
      - name: rent_mid
        description: Median net cold rent (EUR/m2/month).
        data_tests:

          - not_null
      - name: rent_high
        description: Upper bound of the 3/4-Spanne (EUR/m2/month, net cold rent).
        data_tests:

          - not_null
      - name: source
        description: >
          Source citation including edition year, publisher, reference date, and
          equipment standard.

  - name: seed_poi_thesis_taxonomy_crosswalk
    description: >
      OA-A.3 (#167): crosswalk from the 2018 thesis's golden oa_*/prev_oa_*
      column suffixes (German taxonomy slugs, reference/system/70_oa_helper.sql,
      71_oa.sql) to the current OSM-derived taxonomy (poi_domain_h/category_h/
      type_h vocabulary, seed_poi_mapping.csv). 85 rows -- one per golden OA
      column suffix (13 domain + 27 category + 45 type), generated to match
      the golden CSV's exact 85-suffix inventory (see
      stg_thesis_2018_result_plr_oa.sql header). Used by
      analysis/b_oa_validation.py to join recomputed OA
      (int_poi_offering_advantage) against the golden.
      One documented divergence: thesis groups Biergarten under vergnuegung
      (Entertainment); current taxonomy classifies Beer Garden under
      Gastronomy -- mapped to domain_h='Gastronomy' (see note column) so the
      join is non-empty; flagged for geo-DS/domain-expert review.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: level
        description: Taxonomy level this crosswalk row resolves ('domain', 'category', 'type').
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["domain", "category", "type"]
      - name: thesis_oa_suffix
        description: >
          Raw thesis OA column suffix, e.g. 'total_d_tourismus_stock',
          'gastro_t_restaurant_italiener_stock'. Unique per row.
        data_tests:

          - not_null
          - unique
      - name: domain_h
        description: Our poi_domain_h value this suffix resolves to (always populated).
        data_tests:

          - not_null
      - name: category_h
        description: Our poi_category_h value (populated for level in category/type; null for domain).
      - name: type_h
        description: Our poi_type_h value (populated only for level='type').
      - name: note
        description: Free-text note flagging translation ambiguity or a known crosswalk divergence.

  - name: seed_poi_offering_relevance
    description: >
      OA-B.1 (#170): causality-first POI relevance/tier seed curating which POI types
      count toward the **improved** (Workstream 2, `methodology_variant='improved'`)
      offering-advantage signal (ADR-0017 D3; ADR-0018 -- the standalone decision record
      that formalizes this exact rule's mechanics, non-circularity proof, and boundary
      against causal inference). One row per (level, domain, category,
      type) node of the existing 3-level taxonomy (seed_poi_mapping.csv) -- 231 rows
      (13 domain + 55 category + 163 type). Tiers are set from **urban-sociology/retail-
      gentrification theory alone**, before any correlation with an outcome is looked at
      (ADR-0017 D3 2x2, formalized by ADR-0018 D1/D2: causally-plausible-and-correlated
      is kept, non-causal correlates are dropped as spurious even if correlated; theory
      can never be overridden upward by data). `data_corr` is a placeholder, filled by
      OA-B.2 (#171) with the data-driven confirmation pass; it can only corroborate or
      down-weight within a tier, never promote a tier-0 ('drop') node -- the
      non-circularity rule (ADR-0017 D3; ADR-0018 D1/D3, plan "POI relevance model").
      I15 (#232) review note: as of this ticket, no model consumes offering_weight into
      a `methodology_variant='improved'` OA row yet (that build is OA-B.3 #172, not yet
      implemented) -- this seed is tiering-only, correctly not yet wired into
      int_poi_offering_advantage (which emits 'faithful' only).

      Grounding: Zukin 2009 *Naked City* (boutique/artisanal "third wave" retail);
      Ley 1996 *The New Middle Class* (cultural-intermediary consumption); Lees, Slater
      & Wyly 2008 *Gentrification* (retail-succession signature list: cafes, galleries,
      boutiques, fitness/wellness); Dangschat 1988 invasion-succession (incumbent trades
      displaced BY upgrading are not themselves a signal of it); Smith 1979 rent-gap
      theory (Vacancy retained as the theorised **opposite-pole disinvestment** marker,
      ADR-0017 D-2 -- never summed with amenity rows); Florida 2002 creative class
      (coworking); Gotham 2005 tourism gentrification (hotel/hostel growth). Full source
      list in `docs/adr/0017-poi-offering-advantage-revival.md` Sources. The original
      4-row `seed_poi_canonical_category.csv` stub (`coworking_space=true`,
      `organic_food=true`, `yoga_studio=true`, `fitness_outdoor=false`) is the historical
      precedent this seed generalizes and supersedes for offering-relevance purposes;
      that seed's `gentrification_proxy` column is unaffected/untouched here.

      `offering_tier` in {0,1,2,3} maps to `offering_weight` in {0.0, 0.33, 0.66, 1.0}:
      0 = drop (not causally plausible as a commercial-offering signal, e.g. public/civic
      infrastructure explicitly out of scope per the ticket -- benches, toilets, vending,
      public transport); 1 = keep at low weight (ambiguous / incumbent-serving, flagged
      for OA-B.2 data confirmation); 2 = keep at medium weight (plausible but not a
      headline signature); 3 = keep at full weight (headline literature signature, e.g.
      specialty cafes, boutiques, independent bookstores, coworking, boutique fitness).

      **Methodology-bearing (CLAUDE.md R-C1):** this seed sets tier weights that feed
      the improved-variant offering-advantage weighting (OA-B.3 #172); requires geo-DS +
      domain-expert `Verdict: PASS` before integration into `develop`.
    meta:
      dbt_meta_owner: data-engineer
    columns:
      - name: level
        description: Taxonomy level this row's tier applies to ('domain', 'category', 'type').
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: ["domain", "category", "type"]
      - name: poi_domain_h
        description: poi_domain_h value this row's tier applies to (always populated).
        data_tests:

          - not_null
      - name: poi_category_h
        description: poi_category_h value (populated for level in category/type; blank for domain).
      - name: poi_type_h
        description: poi_type_h value (populated only for level='type').
      - name: offering_tier
        description: >
          Causality-first relevance tier in {0,1,2,3}: 0=drop (not causally plausible),
          1=keep low weight (ambiguous/incumbent-serving), 2=keep medium weight
          (plausible, not headline), 3=keep full weight (headline literature signature).
          Set from theory alone, before any outcome correlation is examined (ADR-0017 D3;
          ADR-0018 D1 Step 1).
        data_tests:

          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
      - name: offering_weight
        description: Numeric weight derived 1:1 from offering_tier (0/0.33/0.66/1.0).
        data_tests:

          - not_null
      - name: causal_rationale
        description: >
          Cited theoretical justification for the tier (thesis/urban-sociology source per
          R-C2 grounding rule); the sole record of the causality-first, pre-data decision.
        data_tests:

          - not_null
      - name: data_corr
        description: >
          OA-B.2 (#171) data-driven confirmation pass: Spearman rho of this node's
          faithful-variant Offering Advantage (int_poi_offering_advantage,
          weight_variant='standard', snapshot_year=2016) against the 2018 thesis
          outcome status_index (int_thesis_2018_area_index), computed by
          analysis/c_offering_relevance_validation.py. Blank where n < 10 PLR pairs
          (insufficient data, typically near-zero-stock leaf types). Diagnostic only
          -- never used to promote a tier-0 node or demote a causally-plausible
          (tier >= 1) node (non-circularity rule, ADR-0017 D3; ADR-0018 D1 Step 2/D2);
          see docs/epic-c/B2-offering-relevance-validation-findings.md for the full
          crosstab and flagged direction-mismatch findings.
