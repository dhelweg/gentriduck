[project]
name = "gentriduck"
version = "0.1.0"
description = "Reviving a 2018 Berlin gentrification thesis on dbt + DuckDB; growing into a public open-data stats website."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pandas>=2.2,<3.0",
    "pyarrow>=14",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    # osmium (BSL-1.0): full-history .osh.pbf reader for C1 OSM ingestion (ADR-0002 Option B).
    # `quackosm` was pruned here (QA-8b, #206, ADR-0002 Amendment 2026-07-09): it was declared per
    # the ADR's original Decision but never imported -- osmium's history-aware SimpleHandler is the
    # right fit for the multi-timestamp .osh.pbf format quackosm's snapshot-oriented reader doesn't
    # natively support. See the ADR amendment for the full rationale.
    "osmium>=4.0",
    "shapely>=2.0",
    "certifi>=2024.0",
    # ADR-0010: PySAL spatial-statistics family (BSD-3).
    # libpysal: spatial weights from shapely geometries (no geopandas).
    # esda: Getis-Ord Gi*, Moran's I, LISA (R-A6, R-A9).
    # spreg: spatial-lag/error regression (R-A9).
    # h3: optional MAUP sensitivity layer, analysis-only (Apache-2.0). Deliberately deferred/
    # unused dependency (QA-8b, #206 confirms this is not drift): spatial-methods.md #7
    # explicitly allows skipping the H3 lens once PLR-vs-BZR rank correlation clears the r>0.7
    # MAUP threshold, which analysis/a6_maup.py confirms it does -- so h3 stays an accepted,
    # roadmapped floor rather than dead weight. Re-evaluate if a future PLR-vs-BZR check fails.
    # Excluded: geopandas, pyogrio, pyproj, fiona, tobler (ADR-0010 Amendment 1).
    "libpysal>=4.10",
    "esda>=2.5",
    "spreg>=1.4",
    "h3>=4.0",
    "openpyxl>=3.1.5",
]

# Dev tooling lives in an isolated group; installed via `uv sync`.
[dependency-groups]
dev = [
    "poethepoet>=0.29",
    "shandy-sqlfmt>=0.23",
    "sqlfluff>=3.2",
    "ruff>=0.7",
    "pre-commit>=4.0",
    # QA-1 (#176): pytest harness for ingestion/analysis pure functions (R-C3 extension).
    "pytest>=8.0",
    "quarto-cli>=1.9.38",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "transform/dbt_packages", "transform/target"]

# QA-8 (#183): deliberate rule selection (previously only the ruff default E/F ran,
# so the project's several `# noqa: S310`/`# noqa: BLE001` comments referenced
# rule families ruff never actually checked -- dead noqa). `S` (flake8-bandit) is
# now live; per-call-site noqa comments where the finding is a deliberate,
# reviewed choice (fixed HTTPS-only URLs to known open-data endpoints, `git`
# subprocess calls with a fixed argv, best-effort `LOAD spatial` fallback).
[tool.ruff.lint]
# QA-8 (#183): extend-select (not select!) -- this ADDS to ruff's existing
# default rule set (E4/E7/E9/F: a curated pycodestyle+pyflakes subset, NOT the
# full E family) rather than replacing it. A bare `select = ["E", ...]` was
# tried here first and pulled in E501/E-whitespace/etc, surfacing ~170
# unrelated pre-existing findings across the repo -- out of scope for a lint
# *hygiene* ticket. `S` (flake8-bandit) is the one family this ticket asks
# for, so the existing `# noqa: S310`/etc. comments (previously dead, since
# ruff never checked S at all) now mean something.
extend-select = ["S"]
ignore = [
    # S608 (SQL injection via string-built query): every hit here is an f-string
    # building a query from our own model/column/path names against a local,
    # single-user DuckDB file -- there is no untrusted-input surface (no web
    # server, no external caller). Ignored project-wide rather than noqa'd at
    # 10 call sites; revisit if this project ever accepts external query input.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
# S101 (assert): idiomatic in pytest test files, not a security concern.
"tests/**" = ["S101"]

[tool.sqlfmt]
# Exclude generated dbt artefacts; sqlfmt owns source models only.
exclude = ["transform/target/**", "transform/dbt_packages/**"]

# Cross-platform task runner — identical commands on macOS / Windows / Linux.
# dbt always runs against the project in transform/ with a repo-local profile.
[tool.poe.tasks]
debug = "dbt debug --project-dir transform --profiles-dir transform"
deps  = "dbt deps --project-dir transform"
build = "dbt build --project-dir transform --profiles-dir transform"
test  = "dbt test --project-dir transform --profiles-dir transform"
# QA-1 (#176): pytest for ingestion/analysis pure functions (crosswalk math,
# ADR-0016 drift-guard severity classification, PDF-parser regexes). No dbt/DB
# dependency -- pure Python, runs on all OSes, wired into the pre-commit push stage.
test-py = "pytest tests/ -v"
docs  = "dbt docs generate --project-dir transform --profiles-dir transform"
# CV-3 (#188) / ADR-0020 §3: community-voting-board triage, run as a step in the devmode
# PM loop's re-scan, or manually. Defaults to a dry run; pass -- --apply to actually post
# comments / create issues. See ops/triage_community.py for the gh-api deny-list caveat.
triage-community = "python ops/triage_community.py"
# F2 (#34) / ADR-0012: export the published marts to parquet (data/serving/, gitignored).
# Run after `poe build`. Future web build (G0/G1) consumes this parquet snapshot.
export-serving = "python transform/export_serving_parquet.py"
# G1c (#132): join dim_area_geometry + gentrification_index into static per-area_level
# GeoJSON FeatureCollections for Evidence's AreaMap (web/static/geo/, gitignored).
# Run after `poe export-serving`.
export-area-geojson = "python web/scripts/export_area_geojson.py"
# ADR-0016: fast, local drift check between the committed manifest
# (ingestion/manifest/*.json) and this machine's data/ contents. Seconds, no dbt
# build. Default is informational (always exit 0); --strict gates on pinned-source
# drift only (rolling/OSM sources never fail --strict). See ingestion/verify_data.py.
verify-data = "python ingestion/verify_data.py"
# ADR-0016: one-time / re-runnable tool that populates manifest entries from
# artefacts already on disk, without re-fetching anything (in particular, without
# the ~20h OSM history extraction). See ingestion/manifest_backfill.py.
manifest-backfill = "python ingestion/manifest_backfill.py"
fmt      = { sequence = ["ruff format .", "sqlfmt transform"], default_item_type = "cmd" }
lint     = { sequence = ["ruff check .", "sqlfluff lint transform"], default_item_type = "cmd" }
# R-C3: analysis scripts are deterministic (random_state=42) and require ingested data.
# Run after `poe build` when dev.duckdb is populated.
analysis = { sequence = [
    "python analysis/e1_regressions.py",
    "python analysis/e2_classification.py",
    "python analysis/a6_hotspots.py",
    "python analysis/a6_maup.py",
    "python analysis/a9_spatial_dynamic.py",
    # A10-P1 (#80): out-of-time-validated early-warning displacement-risk
    # indicator. Imports build_queen_weights from a9_spatial_dynamic.py (must
    # run after it in this list only in the sense that both need `poe build`
    # first; there is no runtime ordering dependency between the two scripts
    # themselves -- the import is a pure function reuse, not a shared-state
    # dependency).
    "python analysis/e4_early_warning.py",
    # QA-7 (#182): e3_* were previously omitted from this sequence with no
    # documented reason -- both are runnable, __file__-anchored, deterministic
    # (no RNG) analysis scripts, so they belong here like their siblings.
    "python analysis/e3_maps.py",
    "python analysis/e3_narratives.py",
    # H-C3 (#160): independent Hamburg annual-cadence lead-lag H3a/H3b re-test.
    # Deterministic (no RNG); requires int_hamburg_lead_lag from `poe build`.
    "python analysis/e5_hamburg_lead_lag.py",
], default_item_type = "cmd" }
# B2: back-test harness — validates live index against MSS classes and known hotspot/coldspot PLRs.
# Run after `poe build`. Results written to docs/methodology/backtest.md.
backtest = "python analysis/backtest_index.py"
# Ingestion scripts — rebuild raw data from open sources (gitignored artefacts).
# Run once before `poe build` on a fresh checkout. See ingestion/README.md for the full
# module-by-module reference (inputs/outputs, licensing, cross-platform notes).
#
# #251 (ADR-0015 amendment 2026-07-12): `poe ingest` runs through `ingestion/run_ingest.py`,
# a thin stdlib-`subprocess` driver that (a) isolates each source's failure instead of
# aborting the whole sequence on the first non-zero exit (poe's own `sequence`/`cmd`
# semantics), gating the driver's own exit code on a small release-blocking allowlist, and
# (b) skips re-ingesting a source whose on-disk output already matches the committed
# ADR-0016 manifest (reusing `verify_data.classify()`), unless `--force`/`FORCE_REFRESH=1`
# is set. See the driver's module docstring for the full rationale. `uv run poe ingest --
# --force` re-ingests everything.
#
# OSM history ingestion (`ingest-osm-*`, ADR-0002) is deliberately NOT included: it
# requires a one-off, manually-downloaded `.osh.pbf` behind the maintainer's OSM contributor
# login (Geofabrik internal server) — not something a fresh no-login checkout can run
# unattended. Run it separately once the file is in place.
ingest = "python ingestion/run_ingest.py"
# OSM full-history ingestion (ADR-0002/C1, H1 Pillar 6) — run manually once the maintainer has
# downloaded the Germany `.osh.pbf` from Geofabrik's internal (login-gated) server into
# data/raw/osm/. Not part of `poe ingest` (see note above).
ingest-osm-berlin = "python ingestion/berlin/osm/ingest_osm_history.py --osh-pbf data/raw/osm/germany-internal.osh.pbf --out-dir data/raw/osm/berlin"
ingest-osm-hamburg = "python ingestion/hamburg/osm/ingest_hamburg_osm.py --osh-pbf data/raw/osm/germany-internal.osh.pbf --out-dir data/raw/osm/hamburg"
# F3 (#35) / ADR-0015: one-command end-to-end data refresh — raw sources through servable
# artefacts. Chains existing tasks in dependency order via poe task refs (not duplicated shell
# commands): dbt deps -> all fresh-checkout-safe ingestion -> dbt build -> export marts -> export
# geo bundle. Deliberately excludes ingest-osm-* (login-gated, ADR-0002), the web build (Node
# toolchain, owned by web-engineer/G0-G1), and analysis/backtest (one-off validation, not
# site-serving artefacts). See ADR-0015 for the full rationale, including the deferred
# GitHub-Actions-schedule path for a future automated cadence.
# ADR-0016: verify-data runs FIRST as a non-strict, informational pre-flight (prints
# a drift summary; always exits 0) — never a hard gate on refresh, preserving
# ADR-0015's graceful degradation. Run `poe verify-data --strict` separately for a
# gating check.
refresh = { sequence = ["verify-data", "deps", "ingest", "build", "export-serving", "export-area-geojson"], default_item_type = "ref" }
# QA-9 (#184): cheap smoke check that mart/schema changes haven't silently broken the Evidence
# build -- today the weekly release routine's `cd web && npm ci && npm run sources && npm run
# build` (see ops/README.md Deploy section) is the only place this is exercised, and only after
# a `develop -> main` merge. `poe web-build` runs the same three steps locally/in the release
# routine as an explicit, reusable task instead of hand-typed shell. Requires `poe refresh` (or at
# least `export-serving` + `export-area-geojson`) to have populated `data/serving/` and
# `web/static/geo/` first -- this task does not re-run the data pipeline.
#
# #248 item 3 (architect review, "no action now, monitor"): the final step wraps
# `npm run build` in ops/time_web_build.py, a stdlib-only timer that appends one
# line to ops/web-build-timings.log per run (committed, so the prerender-time trend
# is visible across releases before it becomes a visible fraction of the release --
# no new tool, same discipline as #251's ingestion driver). Exit code is unchanged
# (a failed build still fails this poe sequence).
web-build = { sequence = ["npm ci", "npm run sources", "python ../ops/time_web_build.py"], cwd = "web", default_item_type = "cmd" }
# O2 (#82) / ADR-0013: single-command reproducible whitepaper build (Quarto + Typst,
# quarto-cli installed into the repo-local .venv). Renders docs/whitepaper/whitepaper.qmd to
# HTML + PDF under the gitignored data/whitepaper/. Content is a staged slice (see the
# "Deferred content slice" notes in whitepaper.qmd) -- this task builds whatever content
# currently exists, methodology-bearing sections included only once they clear R-C1.
whitepaper = "quarto render docs/whitepaper"
